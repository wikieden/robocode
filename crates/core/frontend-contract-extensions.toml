[live_work_owner]
facts = ["agent_task_record", "tool_call_view", "queued_input_view", "evidence_view"]
boundary = "each live-work fact carries an optional full RuntimeOwner, populated only where the emitting site holds a real owner identity (Lane worker binding, published Agent session, merge gate, durable agent job); absence stays absent and is never a default owner or an owner inferred from timing, ordering, or label"
compatibility = "omitted when unknown, so a record with no owner encodes to exactly the bytes it did before the field existed and a producer predating the field deserializes to none"

[runtime_agent_session_input]
commands = ["send_agent_session_input", "retry_agent_session"]
events = ["agent_session_input_accepted", "agent_session_started", "agent_session_completed", "agent_session_failed"]
recovery = "logical session identity and owner remain stable across follow-up, retry, snapshot, and replay"

[runtime_workspace_eligibility]
commands = ["preview_default_starter_lane"]
events = ["workspace_eligibility_updated", "starter_lane_previewed"]
boundary = "Core alone validates Git and HEAD eligibility and generates Lane, branch, and worktree identity"

[runtime_agent_adapters]
commands = ["query_agent_adapters", "probe_agent_adapter"]
events = ["agent_adapters_loaded", "agent_adapter_probed"]
boundary = "safe views omit process arguments, environment references, and agent-native authentication data"

[runtime_agent_permission_bridge]
events = ["approval_requested", "approval_resolved"]
boundary = "foreground and asynchronous ACP work share the owner-scoped supervisor approval queue"

[runtime_agent_sessions]
commands = ["start_agent_session", "cancel_agent_session"]
events = ["agent_session_started", "agent_session_updated", "agent_session_completed", "agent_session_failed"]
recovery = "interrupted external sessions are terminated before Core publishes a recoverable failed fact"

[runtime_cockpit_context_v1]
events = ["workspace_source_updated", "runtime_service_health_updated", "workspace_change_updated", "check_run_updated"]
source_boundary = "read-only Git sampling at connect, snapshot, and completed runtime turns; failed inspection publishes no invented clean status"
service_boundary = "MCP stays unavailable until tools are wired; LSP is ready only for a running configured server"
evidence_boundary = "workspace changes and checks come from structured tool results, never transcript or rendered assistant text"
limits = "50 retained rows and 65536 bytes per captured patch"

[core_workspace_host]
commands = ["open_workspace"]
boundary = "trusted host returns a transport-neutral CoreClient; frontends never construct SessionEngine or RuntimeSupervisor"

[runtime_credential_staging]
commands = ["store_credential_handle"]
boundary = "secret bytes cross only the non-serializable host boundary and become one-use opaque request ids"

[runtime_lane_owner_projection]
events = ["lane_runtime_owner_bound"]
availability = "frontends require exactly one live binding for the selected active Lane and otherwise send no cancel command"

[runtime_recent_work]
commands = ["query_recent_work"]
events = ["recent_work_loaded"]

[runtime_audit]
commands = ["query_audit"]
events = ["audit_page_loaded"]
boundary = "read-only, newest-first, exclusive `before` cursor, page size clamped to 1..=500; `action` is a stable dotted key and args are bounded sanitized tokens, never localized prose or secret bytes"
correlation = "audit_page_loaded carries the command id of the query it answers; a client requires an exact match and falls back to its own accepted query only for a page with no id (a Core predating the field), never inferring one from record contents"
filters = "query_audit accepts optional actor (operator / system / any_agent / a named agent) and a half-open [from, until) unix-second range, applied before pagination so `complete` and `next_before` describe the filtered timeline; an inverted range is rejected rather than answered with an empty page"

[runtime_starter_lane_preview]
commands = ["preview_starter_lane", "create_starter_lane"]
events = ["starter_lane_previewed", "starter_lane_created", "starter_lane_preview_invalidated"]

[ui_preference_persistence]
commands = ["set_ui_preferences", "reset_ui_preferences"]
events = ["ui_preferences_updated"]

[runtime_project_onboarding]
command_count = 4
events = ["project_probed", "project_config_previewed", "project_config_confirmed", "credential_handle_stored", "provider_health_updated"]
credential_secret_boundary = "secret bytes stay in the injected backend; wire and audit facts contain opaque ids and safe handles only"

[runtime_lane_lifecycle]
command_count = 13
events = ["lane_command_accepted", "lane_updated", "lane_output_appended", "lane_conflict_detected", "lane_recovery_required"]
legacy_clients = "require frozen capabilities only; preserve unsupported event payloads as unknown"

[runtime_trust_loop]
command_count = 8
events = ["handoff_updated", "review_request_updated", "contract_updated", "dependency_updated", "merge_conflict_bounced", "revert_recorded", "merge_gate_updated"]
review_decision = "decide_review records the independent reviewer lane verdict; the requester lane is never accepted as decider and a rejected review blocks accept_merge_gate"
decision_compatibility = "schema-1 legacy string decisions deserialize as read-only legacy facts; new writes are typed"
evidence_boundary = "canonical evidence is required for acceptance; summary-only evidence never satisfies a merge gate"

[runtime_workspace_files]
commands = ["query_workspace_files"]
events = ["workspace_files_loaded"]
boundary = "permission-gated read: Core consults the permission engine under the non-mutating `workspace_file_inventory` tool with the workspace root as the input path before it reads a single directory entry; a deny, and an unresolved ask, both publish the standard Error event naming the refusal and never an empty page, while plan mode still answers through the engine's SafeRead branch because the tool mutates nothing"
exclusions = "gitignore-aware walk (honored outside a Git repository, without global or parent ignore files so the same workspace enumerates identically on two machines) plus unconditional removal of `.git/`, `.viden/`, `.omx/`, `.worktrees/`, and `.ref/`, which hold runtime and agent state rather than workspace content"
ordering = "entries are sorted lexicographically before the prefix filter, the exclusive `after` cursor, and the limit clamp of 1..=500, so `complete` and `next_after` describe the filtered ordered inventory; a prefix that leaves the workspace is rejected rather than clamped or answered with an empty page"
correlation = "workspace_files_loaded carries the command id of the query it answers as a required field, so unlike audit_page_loaded there is no uncorrelated page and a client never falls back to attributing a page to its own acceptance"
