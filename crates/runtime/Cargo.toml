[package]
name = "viden-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
viden-config = { path = "../config" }
viden-context = { path = "../context" }
viden-lanes = { path = "../lanes" }
viden-lsp = { path = "../lsp" }
viden-plugin-api = { path = "../plugin-api" }
viden-plugin-host = { path = "../plugin-host" }
viden-provider = { path = "../provider" }
viden-permissions = { path = "../permissions" }
viden-session = { path = "../session" }
viden-tools = { path = "../tools" }
viden-types = { path = "../types" }
viden-workflows = { path = "../workflows" }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
libc = "0.2"

[dev-dependencies]
# Lane inspection helpers are `cfg(test)`-gated inside `viden-lanes`, which
# does not apply to this crate's test build; the feature re-exposes them.
viden-lanes = { path = "../lanes", features = ["testing"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
