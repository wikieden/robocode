        async () => result,

      requestAnimationFrame(() => {
        if (showAgentMenu) {
          document.querySelector('[data-activity="lanes"]')?.click();
          requestAnimationFrame(() => document.querySelector("[data-create-lane]")?.click());
        }
        if (params.get("drawer") === "open") {
          document.querySelector("[data-context-drawer-toggle]")?.click();
          document.body.dataset.drawer = "open";
        }
        if (params.get("contextScroll") === "bottom") {
          const dock = document.querySelector("[data-context-dock]");
          if (dock) {
            dock.scrollTop = dock.scrollHeight;
            document.body.dataset.contextScroll = "bottom";
            document.body.dataset.contextScrollTop = String(dock.scrollTop);
            document.body.dataset.contextScrollHeight = String(dock.scrollHeight);
            document.body.dataset.contextClientHeight = String(dock.clientHeight);

      document.body.dataset.fixtureSha256 =
        "f96ba30cc6e80aa52cb15a2fd1f03c082487a3cd4779c25f61e42ee1548e1e3b";
