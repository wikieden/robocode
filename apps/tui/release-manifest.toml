[release]
component = "tui"
version = "0.3.1"
min_core_version = "0.3.2"
base_core_checkpoint = "a927e2f31d2cb9bb6015c30bc0ed0976e958c77e"
contract_payload_sha = "5bd2b80b0953f4194d082940a7b9164c7231ca2d"
extension_fixture_sha256 = "96dd5fde9f1241eb50f9d8978cf478d0ac5d3327448dc6ccde9d0e5018ce1580"
supported_schema_versions = [1]
design_entry = "docs/viden-design/Viden/index.html"
tui_design_entry = "docs/viden-design/Viden/TUI/Viden - 设计稿索引 (TUI).html"
tui_reference = "docs/viden-design/Viden/TUI/Viden - 统一原型 (TUI).html"

[compatibility]
required_capabilities = [
  "runtime.agent_dag",
  "runtime.approvals",
  "runtime.commands",
  "runtime.context",
  "runtime.cost",
  "runtime.events",
  "runtime.evidence",
  "runtime.merge_gate",
  "runtime.queued_input",
  "runtime.replay",
  "runtime.snapshot",
  "runtime.transcript_page",
  "runtime.typed_lanes",
  "runtime.typed_tasks",
  "ui.preferences",
]

[extensions]
# Extensions are independently negotiated feature gates. Missing one entry
# never blocks the frozen schema-1 base client from starting.
capabilities = [
  "core.workspace_host",
  "runtime.credential_handles",
  "runtime.credential_staging",
  "runtime.lane_lifecycle",
  "runtime.lane_owner_projection",
  "runtime.project_onboarding",
  "runtime.recent_work",
  "runtime.starter_lane_preview",
  "runtime.trust_loop",
  "ui.preference_persistence",
]

[presentation]
# Resolver inputs may contain `system`/`auto`; effective values never do.
locales = ["system", "en", "zh-CN"]
effective_locales = ["en", "zh-CN"]
skins = ["aurora", "ice", "mono", "amber", "phosphor"]
modes = ["system", "dark", "light"]
effective_modes = ["dark", "light"]
valid_skin_modes = [
  "aurora:dark",
  "aurora:light",
  "ice:dark",
  "ice:light",
  "mono:dark",
  "mono:light",
  "amber:dark",
  "phosphor:dark",
]
densities = ["compact", "regular", "comfy"]
motion = ["system", "reduced", "full"]
tui_color_depth = ["auto", "truecolor", "ansi256", "ansi16"]
effective_tui_color_depth = ["truecolor", "ansi256", "ansi16"]
mouse_capture = false

[source_revisions]
algorithm = "sha256"
tokens_css = "826826ee6ddab845897472701add67ee9f55aff25af539651e6089553b7e6398"
catalog_en = "e2b01eee9ee74a057a879398d1c459ddc629aee3429f2ef53cffc1c2f18f7e79"
