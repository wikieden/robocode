<svg width="680" viewBox="0 0 680 540" role="img" xmlns="http://www.w3.org/2000/svg">
<title>裁决后数据模型</title>
<desc>八个核心对象及关系:AgentTask 与 AgentLane 经 Dispatch 多对多,ContextBundle 挂在 Dispatch,LoopRun 每次运行即一次派发。星号标注相对原设计的修改点。</desc>
<style>
text{font-family:-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif}
.t{font-size:14px;fill:#2C2C2A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.c-gray>.th,.c-gray>.t{fill:#2C2C2A}.c-gray>.ts{fill:#5F5E5A}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="540" fill="#FAF9F5"/>

<g class="c-purple"><rect x="40" y="40" width="180" height="118" rx="4"/>
<text class="th" x="130" y="62" text-anchor="middle">AgentTask</text>
<text class="ts" x="130" y="84" text-anchor="middle">id · kind · status</text>
<text class="ts" x="130" y="101" text-anchor="middle">scope · budget</text>
<text class="ts" x="130" y="118" text-anchor="middle">mutation_policy ★</text>
<text class="ts" x="130" y="135" text-anchor="middle">persona_ref(可选)</text></g>

<g class="c-purple"><rect x="245" y="60" width="180" height="100" rx="4"/>
<text class="th" x="335" y="82" text-anchor="middle">Dispatch ★新增</text>
<text class="ts" x="335" y="104" text-anchor="middle">task_id · lane_id</text>
<text class="ts" x="335" y="121" text-anchor="middle">context_bundle_id</text>
<text class="ts" x="335" y="138" text-anchor="middle">route · started_at</text></g>

<g class="c-purple"><rect x="450" y="40" width="180" height="100" rx="4"/>
<text class="th" x="540" y="62" text-anchor="middle">AgentLane</text>
<text class="ts" x="540" y="84" text-anchor="middle">id · route_kind</text>
<text class="ts" x="540" y="101" text-anchor="middle">gate_strength ★</text>
<text class="ts" x="540" y="118" text-anchor="middle">worktree · isolation</text></g>

<g class="c-gray"><rect x="40" y="220" width="180" height="100" rx="4"/>
<text class="th" x="130" y="242" text-anchor="middle">Evidence</text>
<text class="ts" x="130" y="264" text-anchor="middle">kind · verdict</text>
<text class="ts" x="130" y="281" text-anchor="middle">artifact_refs</text>
<text class="ts" x="130" y="298" text-anchor="middle">permission_snapshot</text></g>

<g class="c-gray"><rect x="245" y="220" width="180" height="100" rx="4"/>
<text class="th" x="335" y="242" text-anchor="middle">ContextBundle</text>
<text class="ts" x="335" y="264" text-anchor="middle">included/omitted+原因</text>
<text class="ts" x="335" y="281" text-anchor="middle">summaries · token 估算</text>
<text class="ts" x="335" y="298" text-anchor="middle">★ 每次 Dispatch 一份</text></g>

<g class="c-teal"><rect x="450" y="220" width="180" height="118" rx="4"/>
<text class="th" x="540" y="242" text-anchor="middle">LoopDefinition</text>
<text class="ts" x="540" y="264" text-anchor="middle">readiness L0–L3</text>
<text class="ts" x="540" y="281" text-anchor="middle">trigger · denylist</text>
<text class="ts" x="540" y="298" text-anchor="middle">budget 三档 ★</text>
<text class="ts" x="540" y="315" text-anchor="middle">熔断阈值</text></g>

<g class="c-gray"><rect x="40" y="396" width="180" height="100" rx="4"/>
<text class="th" x="130" y="418" text-anchor="middle">MergeGate</text>
<text class="ts" x="130" y="440" text-anchor="middle">七态持久状态机</text>
<text class="ts" x="130" y="457" text-anchor="middle">verdict 派生五值</text>
<text class="ts" x="130" y="474" text-anchor="middle">verifier_id</text></g>

<g class="c-teal"><rect x="450" y="396" width="180" height="100" rx="4"/>
<text class="th" x="540" y="418" text-anchor="middle">LoopRun</text>
<text class="ts" x="540" y="440" text-anchor="middle">status · outcome</text>
<text class="ts" x="540" y="457" text-anchor="middle">run_log · incident</text>
<text class="ts" x="540" y="474" text-anchor="middle">★ 每 run 一次派发</text></g>

<line class="arr" x1="220" y1="100" x2="243" y2="100" marker-end="url(#arrow)"/>
<text class="ts" x="222" y="92">1..*</text>
<line class="arr" x1="450" y1="100" x2="427" y2="100" marker-end="url(#arrow)"/>
<text class="ts" x="447" y="92" text-anchor="end">1..*</text>
<line class="arr" x1="335" y1="160" x2="335" y2="218" marker-end="url(#arrow)"/>
<line class="arr" x1="130" y1="158" x2="130" y2="218" marker-end="url(#arrow)"/>
<line class="arr" x1="130" y1="320" x2="130" y2="394" marker-end="url(#arrow)"/>
<line class="arr" x1="540" y1="338" x2="540" y2="394" marker-end="url(#arrow)"/>
<path d="M450 430 L437 430 L437 130 L427 130" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="40" y="528">紫 = 工作对象 · 青 = loop 对象 · 灰 = 信任/上下文 · ★ = 相对原设计文档的修改点</text>
</svg>