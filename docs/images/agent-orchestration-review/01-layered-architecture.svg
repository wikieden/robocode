<svg width="680" viewBox="0 0 680 764" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Viden 分层总架构</title>
<desc>五层架构:产品表面、共享 runtime contract、runtime core(含事前门控簇与事后信任簇)、执行 routes、持久层。</desc>
<style>
text{font-family:-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif}
.t{font-size:14px;fill:#2C2C2A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.leader{stroke:#B4B2A9;stroke-width:.75;stroke-dasharray:3 3;fill:none}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.c-gray>.th,.c-gray>.t{fill:#2C2C2A}.c-gray>.ts{fill:#5F5E5A}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="764" fill="#FAF9F5"/>

<rect x="40" y="20" width="600" height="88" rx="8" fill="none" stroke="#D3D1C7" stroke-dasharray="4 4"/>
<text class="ts" x="52" y="38">① 产品表面 — 只渲染快照 · 只提交命令</text>
<g class="c-gray"><rect x="60" y="48" width="170" height="44" rx="4"/><text class="th" x="145" y="66" text-anchor="middle">TUI cockpit</text><text class="ts" x="145" y="83" text-anchor="middle">现役主界面</text></g>
<g class="c-gray"><rect x="255" y="48" width="170" height="44" rx="4"/><text class="th" x="340" y="66" text-anchor="middle">GUI</text><text class="ts" x="340" y="83" text-anchor="middle">0.3.x 并行轨道</text></g>
<g class="c-gray"><rect x="450" y="48" width="170" height="44" rx="4"/><text class="th" x="535" y="66" text-anchor="middle">CLI · 自动化</text><text class="ts" x="535" y="83" text-anchor="middle">脚本与 CI</text></g>

<line class="arr" x1="300" y1="108" x2="300" y2="130" marker-end="url(#arrow)"/>
<text class="ts" x="312" y="124">命令</text>
<line class="arr" x1="380" y1="132" x2="380" y2="110" marker-end="url(#arrow)"/>
<text class="ts" x="392" y="124">快照</text>

<rect x="40" y="132" width="600" height="88" rx="8" fill="none" stroke="#D3D1C7" stroke-dasharray="4 4"/>
<text class="ts" x="52" y="150">② 共享 runtime contract — 0.3.0 冻结面</text>
<g class="c-purple"><rect x="70" y="160" width="250" height="44" rx="4"/><text class="th" x="195" y="178" text-anchor="middle">RuntimeViewState</text><text class="ts" x="195" y="195" text-anchor="middle">apply_event replay 快照</text></g>
<g class="c-purple"><rect x="360" y="160" width="250" height="44" rx="4"/><text class="th" x="485" y="178" text-anchor="middle">CommandBus</text><text class="ts" x="485" y="195" text-anchor="middle">RuntimeCommand 入口</text></g>

<line class="arr" x1="340" y1="220" x2="340" y2="242" marker-end="url(#arrow)"/>

<rect x="40" y="244" width="600" height="252" rx="8" fill="none" stroke="#D3D1C7" stroke-dasharray="4 4"/>
<text class="ts" x="52" y="262">③ Runtime core — 唯一 mutation 路径</text>
<g class="c-purple"><rect x="60" y="276" width="170" height="40" rx="4"/><text class="th" x="145" y="300" text-anchor="middle">RuntimeSupervisor</text></g>
<line class="arr" x1="230" y1="296" x2="268" y2="296" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="270" y="276" width="190" height="40" rx="4"/><text class="th" x="365" y="292" text-anchor="middle">AgentOrchestrator</text><text class="ts" x="365" y="308" text-anchor="middle">Task DAG · dispatch</text></g>
<g class="c-purple"><rect x="500" y="272" width="120" height="52" rx="4"/><text class="th" x="560" y="292" text-anchor="middle">LoopRunner</text><text class="ts" x="560" y="309" text-anchor="middle">L0–L3 · kill</text></g>
<line class="arr" x1="500" y1="298" x2="462" y2="298" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

<rect x="60" y="352" width="280" height="126" rx="8" fill="none" stroke="#D3D1C7" stroke-dasharray="4 4"/>
<text class="ts" x="72" y="370">事前门控 — mutation 之前</text>
<g class="c-purple"><rect x="76" y="380" width="248" height="26" rx="4"/><text class="ts" x="200" y="397" text-anchor="middle">Permission · RiskClass 四级+阈值</text></g>
<g class="c-purple"><rect x="76" y="412" width="248" height="26" rx="4"/><text class="ts" x="200" y="429" text-anchor="middle">Budget · 触顶即停(下一请求前)</text></g>
<g class="c-purple"><rect x="76" y="444" width="248" height="26" rx="4"/><text class="ts" x="200" y="461" text-anchor="middle">Conflict · path/branch 碰撞</text></g>

<rect x="360" y="352" width="280" height="126" rx="8" fill="none" stroke="#D3D1C7" stroke-dasharray="4 4"/>
<text class="ts" x="372" y="370">事后信任 — 完成之后</text>
<g class="c-purple"><rect x="376" y="380" width="248" height="26" rx="4"/><text class="ts" x="500" y="397" text-anchor="middle">Evidence · 采集与归档</text></g>
<g class="c-purple"><rect x="376" y="412" width="248" height="26" rx="4"/><text class="ts" x="500" y="429" text-anchor="middle">Verifier · 独立 session · 默认拒绝</text></g>
<g class="c-purple"><rect x="376" y="444" width="248" height="26" rx="4"/><text class="ts" x="500" y="461" text-anchor="middle">MergeGate · 裁决与合并</text></g>

<line class="arr" x1="340" y1="496" x2="340" y2="518" marker-end="url(#arrow)"/>
<line class="arr" x1="520" y1="520" x2="520" y2="498" marker-end="url(#arrow)"/>
<text class="ts" x="532" y="512">lane 事件</text>

<rect x="40" y="520" width="600" height="96" rx="8" fill="none" stroke="#D3D1C7" stroke-dasharray="4 4"/>
<text class="ts" x="52" y="538">④ 执行 routes — 统一 AgentLane 契约</text>
<g class="c-teal"><rect x="60" y="548" width="170" height="52" rx="4"/><text class="th" x="145" y="568" text-anchor="middle">native</text><text class="ts" x="145" y="586" text-anchor="middle">gate = full</text></g>
<g class="c-teal"><rect x="255" y="548" width="170" height="52" rx="4"/><text class="th" x="340" y="568" text-anchor="middle">ACP</text><text class="ts" x="340" y="586" text-anchor="middle">gate = cooperative</text></g>
<g class="c-teal"><rect x="450" y="548" width="170" height="52" rx="4"/><text class="th" x="535" y="568" text-anchor="middle">terminal</text><text class="ts" x="535" y="586" text-anchor="middle">gate = containment</text></g>

<line class="arr" x1="340" y1="616" x2="340" y2="638" marker-end="url(#arrow)"/>

<rect x="40" y="640" width="600" height="88" rx="8" fill="none" stroke="#D3D1C7" stroke-dasharray="4 4"/>
<text class="ts" x="52" y="658">⑤ 持久层 — JSONL canonical · 其余派生</text>
<g class="c-gray"><rect x="55" y="668" width="135" height="44" rx="4"/><text class="th" x="122" y="686" text-anchor="middle">Session JSONL</text><text class="ts" x="122" y="702" text-anchor="middle">只追加</text></g>
<g class="c-gray"><rect x="205" y="668" width="135" height="44" rx="4"/><text class="th" x="272" y="686" text-anchor="middle">Workflow log</text><text class="ts" x="272" y="702" text-anchor="middle">durable 历史</text></g>
<g class="c-gray"><rect x="355" y="668" width="135" height="44" rx="4"/><text class="th" x="422" y="686" text-anchor="middle">SQLite index</text><text class="ts" x="422" y="702" text-anchor="middle">派生 · 可重建</text></g>
<g class="c-gray"><rect x="505" y="668" width="135" height="44" rx="4"/><text class="th" x="572" y="686" text-anchor="middle">Artifacts</text><text class="ts" x="572" y="702" text-anchor="middle">diffs · logs</text></g>

<text class="ts" x="40" y="748">紫 = runtime · 青 = 执行 route · 灰 = 表面 / 持久 · 虚线箭头 = loop 包装 route</text>
</svg>