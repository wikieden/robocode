<svg width="680" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Lane 统一契约与门控分级</title>
<desc>AgentLane 统一契约经三种权限适配(native/ACP/terminal)汇入统一 evidence 信封与 MergeGate;mutation_policy 与 LoopDefinition 为正交轴。</desc>
<style>
text{font-family:-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif}
.t{font-size:14px;fill:#2C2C2A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.leader{stroke:#B4B2A9;stroke-width:.75;stroke-dasharray:3 3;fill:none}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.c-gray>.th,.c-gray>.t{fill:#2C2C2A}.c-gray>.ts{fill:#5F5E5A}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="480" fill="#FAF9F5"/>

<g class="c-gray"><rect x="40" y="80" width="160" height="180" rx="4"/>
<text class="th" x="120" y="104" text-anchor="middle">AgentLane 契约</text>
<text class="ts" x="120" y="128" text-anchor="middle">id · route_kind</text>
<text class="ts" x="120" y="146" text-anchor="middle">gate_strength</text>
<text class="ts" x="120" y="164" text-anchor="middle">worktree · isolation</text>
<text class="ts" x="120" y="182" text-anchor="middle">process_handle</text>
<text class="ts" x="120" y="204" text-anchor="middle">— 生命周期事件 —</text>
<text class="ts" x="120" y="222" text-anchor="middle">created → exited</text></g>

<rect x="240" y="30" width="220" height="312" rx="8" fill="none" stroke="#D3D1C7" stroke-dasharray="4 4"/>
<text class="ts" x="252" y="48">权限适配 — 按 route 分化</text>
<g class="c-teal"><rect x="256" y="62" width="188" height="72" rx="4"/>
<text class="th" x="350" y="88" text-anchor="middle">native — full</text>
<text class="ts" x="350" y="108" text-anchor="middle">逐工具调用拦截</text></g>
<g class="c-teal"><rect x="256" y="150" width="188" height="88" rx="4"/>
<text class="th" x="350" y="172" text-anchor="middle">ACP — cooperative</text>
<text class="ts" x="350" y="192" text-anchor="middle">权限请求 → 审批闸</text>
<text class="ts" x="350" y="208" text-anchor="middle">worktree 围栏兜底</text></g>
<g class="c-teal"><rect x="256" y="254" width="188" height="72" rx="4"/>
<text class="th" x="350" y="278" text-anchor="middle">terminal — containment</text>
<text class="ts" x="350" y="298" text-anchor="middle">围栏 + 退出 diff 闸</text></g>

<line class="arr" x1="200" y1="170" x2="238" y2="170" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="500" y="70" width="140" height="140" rx="4"/>
<text class="th" x="570" y="94" text-anchor="middle">evidence 信封</text>
<text class="ts" x="570" y="118" text-anchor="middle">退出码 · log tail</text>
<text class="ts" x="570" y="136" text-anchor="middle">worktree diff</text>
<text class="ts" x="570" y="154" text-anchor="middle">artifact refs</text>
<text class="ts" x="570" y="172" text-anchor="middle">cost facts</text>
<text class="ts" x="570" y="190" text-anchor="middle">(外部 CLI 标盲区)</text></g>

<path d="M444 98 L498 112" class="arr" marker-end="url(#arrow)"/>
<path d="M444 194 L498 140" class="arr" marker-end="url(#arrow)"/>
<path d="M444 290 L498 172" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="500" y="260" width="140" height="60" rx="4"/>
<text class="th" x="570" y="284" text-anchor="middle">MergeGate</text>
<text class="ts" x="570" y="302" text-anchor="middle">同一 diff review</text></g>
<line class="arr" x1="570" y1="210" x2="570" y2="258" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="40" y="290" width="160" height="96" rx="4"/>
<text class="th" x="120" y="312" text-anchor="middle">mutation_policy</text>
<text class="ts" x="120" y="334" text-anchor="middle">autonomous</text>
<text class="ts" x="120" y="350" text-anchor="middle">propose-only</text>
<text class="ts" x="120" y="366" text-anchor="middle">read-only · 正交轴</text></g>
<line class="arr" x1="200" y1="330" x2="238" y2="330" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="280" y="380" width="200" height="76" rx="4" stroke-dasharray="4 4"/>
<text class="th" x="380" y="402" text-anchor="middle">LoopDefinition</text>
<text class="ts" x="380" y="420" text-anchor="middle">包装任一 route</text>
<text class="ts" x="380" y="436" text-anchor="middle">每次 run = 派发一个 task</text></g>
<line class="arr" x1="380" y1="380" x2="380" y2="344" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
</svg>