<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
/* Token 单一真源 → ../tokens.css;本页只用 var(--*)。默认 :root = dark 皮肤。 */
*{box-sizing:border-box;}
body{margin:0;background:var(--page-bg);color:var(--fg-primary);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
.doc{max-width:1080px;margin:0 auto;padding:30px 28px 120px;}
.pkicker{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.pkicker::before{content:"";width:24px;height:2px;background:var(--accent);}
h1{font-size:29px;margin:0 0 10px;letter-spacing:-.6px;} h1 .ac{color:var(--accent);}
.lead{font-size:14px;color:var(--fg-secondary);margin:0 0 6px;max-width:920px;line-height:1.65;text-wrap:pretty;} .lead b{color:var(--fg-primary);font-weight:600;}
.lead .note{font-family:var(--mono);font-size:11px;color:var(--fg-faint);margin-top:8px;}
.sech{display:flex;align-items:baseline;gap:11px;margin:46px 0 10px;}
.sech .no{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:700;} .sech h2{font-size:20px;margin:0;} .sech .en{font-family:var(--mono);font-size:10.5px;color:var(--fg-faint);letter-spacing:1px;text-transform:uppercase;} .sech .sp{flex:1;height:1px;background:var(--border-soft);align-self:center;}
.subl{font-size:13px;color:var(--fg-muted);margin:6px 0 16px;line-height:1.6;max-width:900px;} .subl b{color:var(--fg-secondary);}
kbd,code{font-family:var(--mono);font-size:12px;color:var(--accent-bright);background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:4px;padding:0 5px;}

/* source comparison cards */
.srcwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.scard{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:12px;padding:16px 18px;border-top:2px solid;}
.scard.oc{border-top-color:var(--accent);} .scard.hm{border-top-color:var(--gold);}
.scard .nm{font-family:var(--mono);font-size:15px;font-weight:800;display:flex;align-items:center;gap:9px;}
.scard.oc .nm{color:var(--accent-bright);} .scard.hm .nm{color:var(--gold-bright);}
.scard .nm .tag{font-family:var(--mono);font-size:9px;font-weight:700;border-radius:4px;padding:1px 7px;border:1px solid;color:var(--fg-muted);border-color:var(--border);}
.scard .ds{font-size:12px;color:var(--fg-muted);line-height:1.55;margin:7px 0 11px;}
.scard .row{display:flex;align-items:baseline;gap:9px;padding:6px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
.scard .row:last-child{border-bottom:none;}
.scard .row .k{flex:none;width:14px;text-align:center;color:var(--fg-faint);}
.scard.oc .row .k{color:var(--accent);} .scard.hm .row .k{color:var(--gold);}
.scard .row .nmm{color:var(--fg-primary);font-weight:600;} .scard .row .dd{color:var(--fg-muted);}

/* adopt table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
.tbl th{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--fg-muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border-soft);color:var(--fg-secondary);vertical-align:top;line-height:1.5;}
.tbl .src{font-family:var(--mono);font-size:12px;color:var(--accent-bright);white-space:nowrap;} .tbl .src .sub{display:block;color:var(--fg-faint);font-size:10px;margin-top:2px;}
.tbl .src.h{color:var(--gold-bright);}
.tbl .map b{color:var(--fg-primary);}
.tier{font-family:var(--mono);font-size:9.5px;font-weight:700;border-radius:4px;padding:1px 7px;white-space:nowrap;border:1px solid;}
.t-now{color:var(--success);border-color:color-mix(in srgb,var(--success) 40%,transparent);background:color-mix(in srgb,var(--success) 7%,transparent);}
.t-adapt{color:var(--accent-bright);border-color:var(--accent-dim);background:color-mix(in srgb,var(--accent) 7%,transparent);}
.t-late{color:var(--gold-bright);border-color:color-mix(in srgb,var(--gold) 40%,transparent);background:color-mix(in srgb,var(--gold) 6%,transparent);}
.t-avoid{color:var(--error);border-color:color-mix(in srgb,var(--error) 35%,transparent);background:color-mix(in srgb,var(--error) 6%,transparent);}

/* ── terminal mockup ── */
.demo{margin:8px 0 4px;}
.demo .cap{display:flex;align-items:baseline;gap:10px;margin:0 2px 8px;flex-wrap:wrap;}
.demo .cap .t{font-size:13.5px;font-weight:700;color:var(--fg-primary);}
.demo .cap .from{font-family:var(--mono);font-size:10px;color:var(--fg-faint);border:1px solid var(--border-soft);border-radius:4px;padding:1px 7px;}
.demo .cap .from.oc{color:var(--accent);border-color:var(--accent-dim);}
.demo .cap .from.hm{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 35%,transparent);}
.demo .cap .why{font-size:11.5px;color:var(--fg-muted);}
.demogrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
.term{background:linear-gradient(180deg,var(--term-screen),var(--term-screen));border:1px solid var(--border);border-radius:10px;overflow:hidden;font-family:var(--mono);box-shadow:0 12px 34px rgba(0,0,0,.42);}



.tbody{padding:16px 16px 14px;min-height:60px;}
.statusbar{display:flex;align-items:center;height:24px;background:var(--term-bar);border-top:1px solid var(--border-soft);font-size:10.5px;white-space:nowrap;overflow:hidden;}
.statusbar .seg{padding:0 9px;display:flex;align-items:center;gap:6px;height:100%;color:var(--fg-muted);}
.statusbar .seg.proj{background:var(--accent);color:var(--bg-void);font-weight:800;}
.statusbar .seg.lane{color:var(--fg-primary);} .statusbar .seg.be{color:var(--accent);font-weight:700;}
.statusbar .sp{flex:1;}
.statusbar .seg.r{color:var(--fg-muted);} .statusbar .seg.r.gold{color:var(--gold-bright);}
.statusbar .led{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 7px var(--success);}
.bbar{display:inline-flex;letter-spacing:-1px;}
.bbar .f{color:var(--accent);} .bbar .e{color:var(--accent-dim);}

/* empty state */
.es{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 8px 4px;}
.es .mark{font-family:var(--mono);font-weight:800;font-size:34px;letter-spacing:5px;color:var(--fg-primary);text-shadow:0 0 26px color-mix(in srgb,var(--accent) 28%,transparent);}
.es .mark .b{color:var(--accent);}
.es .tagl{font-size:11px;color:var(--fg-muted);margin:6px 0 18px;}
.composer{width:100%;text-align:left;background:var(--bg-base);border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:8px;padding:11px 13px;}
.composer .ph{font-size:12.5px;color:var(--fg-secondary);} .composer .ph .ex{color:var(--fg-faint);}
.composer .mline{font-size:10.5px;color:var(--fg-muted);margin-top:8px;display:flex;align-items:center;gap:7px;}
.composer .mline .ag{color:var(--accent-bright);font-weight:700;} .composer .mline .bk{color:var(--builtin);}
.es .hints{font-size:10.5px;color:var(--fg-faint);margin-top:10px;display:flex;gap:16px;}
.es .hints b{color:var(--fg-secondary);font-weight:700;}
.es .tip{font-size:11px;color:var(--fg-muted);margin-top:14px;display:flex;align-items:center;gap:8px;}
.es .tip .d{color:var(--gold);} .es .tip .cmd{color:var(--accent-bright);}
.es .cat{font-size:10.5px;color:var(--fg-faint);margin-top:16px;border-top:1px solid var(--border-soft);padding-top:11px;width:100%;}
.es .cat b{color:var(--fg-secondary);}

/* streaming timeline */
.tl{display:flex;flex-direction:column;}
.tlr{display:flex;align-items:center;gap:10px;font-size:12px;padding:3px 0;position:relative;}
.tlr .gut{flex:none;width:14px;text-align:center;color:var(--border);} 
.tlr .ic{flex:none;width:15px;text-align:center;font-size:11px;}
.tlr .lb{flex:none;width:74px;color:var(--fg-muted);}
.tlr .ar{flex:1;color:var(--fg-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tlr .du{flex:none;color:var(--fg-faint);font-size:10.5px;}
.tlr.prep .ic{color:var(--fg-muted);} .tlr.prep .ar{color:var(--fg-muted);}
.tlr.ask .ic{color:var(--gold-bright);} .tlr.ask .lb{color:var(--gold);} .tlr.ask .ar{color:var(--gold-bright);}
.tlr.done .ic{color:var(--accent-bright);} .tlr.done .lb{color:var(--accent);}
.tlr.run .ic{color:var(--progress);} .tlr.run .lb{color:var(--progress);} .tlr.run .du{color:var(--progress);}
.tlr.ok .ic{color:var(--success);} .tlr.ok .lb{color:var(--success);}
.tlr.err .ic{color:var(--error);} .tlr.err .lb{color:var(--error);} .tlr.err .ar{color:var(--error);}

/* approval gate */
.gate{border:1px solid color-mix(in srgb,var(--gold) 38%,transparent);border-radius:8px;background:color-mix(in srgb,var(--gold) 4%,transparent);overflow:hidden;}
.gate .gh{display:flex;align-items:center;gap:9px;padding:9px 13px;background:color-mix(in srgb,var(--gold) 8%,transparent);border-bottom:1px solid color-mix(in srgb,var(--gold) 22%,transparent);font-size:12px;font-weight:700;color:var(--gold-bright);}
.gate .gh .tg{margin-left:auto;font-size:9.5px;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:4px;padding:0 6px;font-weight:700;}
.gate .gb{padding:11px 13px;}
.gate .cmd{font-size:12.5px;color:var(--fg-primary);} .gate .cmd .pr{color:var(--accent);}
.gate .csq{font-size:11px;color:var(--error);margin:6px 0 12px;display:flex;align-items:center;gap:7px;}
.gate .opt{display:flex;align-items:center;gap:10px;font-size:12px;padding:5px 9px;border-radius:6px;color:var(--fg-secondary);}
.gate .opt .n{color:var(--fg-faint);font-weight:700;width:12px;}
.gate .opt.sel{background:var(--bg-sel);color:var(--accent-bright);} .gate .opt.sel .n{color:var(--accent);}
.gate .opt.sel::before{content:"❯";color:var(--accent);margin-left:-9px;margin-right:-3px;}
.gate .opt .sub{margin-left:auto;font-size:9.5px;color:var(--fg-faint);}
.gate .opt.deny{color:var(--fg-muted);}
.gate .foot{display:flex;align-items:center;gap:12px;font-size:10px;color:var(--fg-faint);margin-top:10px;border-top:1px solid var(--border-soft);padding-top:9px;}
.gate .foot .cd{color:var(--gold-bright);} .gate .foot .cd .bar{display:inline-block;width:54px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--gold) 14%,var(--term-screen));overflow:hidden;vertical-align:middle;margin-left:5px;}
.gate .foot .cd .bar i{display:block;height:100%;width:62%;background:var(--gold);}

/* denied fallback */
.reply{border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);border-radius:8px;margin-top:11px;}
.reply .rh{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--gold-bright);padding:8px 12px 0;}
.reply .rb{font-size:12px;color:var(--fg-secondary);line-height:1.65;padding:6px 13px 11px;}
.reply .rb .run{display:block;color:var(--accent-bright);background:var(--bg-base);border:1px solid var(--border-soft);border-radius:5px;padding:5px 9px;margin:7px 0;}

/* command palette */
.pal{display:flex;flex-direction:column;}
.palr{display:flex;align-items:baseline;gap:13px;font-size:12.5px;padding:5px 9px;border-radius:5px;}
.palr .c{flex:none;width:96px;color:var(--accent-bright);font-weight:600;}
.palr .d{color:var(--fg-muted);}
.palr.sel{background:color-mix(in srgb,var(--gold) 10%,transparent);} .palr.sel .c{color:var(--gold-bright);} .palr.sel .d{color:var(--fg-secondary);}
.palq{font-size:12.5px;color:var(--fg-primary);margin-bottom:9px;} .palq .pr{color:var(--gold);}

/* chips + toast row */
.minirow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px;}
.chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;background:var(--bg-base);border:1px solid var(--border-soft);border-radius:6px;padding:4px 10px;color:var(--fg-secondary);}
.chip .ck{color:var(--success);} .chip .md{color:var(--accent-bright);} .chip .du{color:var(--fg-faint);}
.toast{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;border:1px solid var(--accent-dim);border-radius:6px;padding:5px 11px;color:var(--accent-bright);background:color-mix(in srgb,var(--accent) 5%,transparent);}
.toast .sp{width:9px;height:9px;border-radius:50%;border:1.6px solid var(--accent);border-top-color:transparent;}

/* principles */
.rules{display:flex;flex-direction:column;gap:9px;margin-top:6px;}
.rule{display:flex;gap:12px;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:10px;padding:11px 15px;}
.rule .ic{font-family:var(--mono);font-size:13px;color:var(--accent);flex:none;width:18px;text-align:center;}
.rule .tx{font-size:13px;color:var(--fg-secondary);line-height:1.55;} .rule .tx b{color:var(--fg-primary);}
.divnote{font-size:13.5px;color:var(--fg-secondary);line-height:1.7;background:var(--bg-panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:14px 18px;margin-top:18px;text-wrap:pretty;} .divnote b{color:var(--fg-primary);} .divnote .c{color:var(--accent-bright);font-family:var(--mono);font-size:12.5px;}
.miscap{font-family:var(--mono);font-size:10px;color:var(--fg-faint);margin:8px 2px 0;letter-spacing:.5px;}
/* glyph legend */
.glymap{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:11px;padding:13px 16px;margin:0 0 18px;}
.glymap .gmh{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px;color:var(--fg-muted);margin-bottom:11px;}
.glymap .gmrow{display:flex;flex-wrap:wrap;gap:8px;}
.glymap .gm{font-family:var(--mono);font-size:12px;color:var(--fg-secondary);background:var(--bg-base);border:1px solid var(--border-soft);border-radius:7px;padding:4px 11px;display:flex;align-items:center;gap:7px;white-space:nowrap;}
.glymap .gm b{font-size:13px;}
.glymap .gm.gold b{color:var(--gold-bright);} .glymap .gm.blue b{color:var(--progress);} .glymap .gm.green b{color:var(--success);} .glymap .gm.cyan b{color:var(--accent-bright);} .glymap .gm.violet b{color:var(--builtin);} .glymap .gm.grey b{color:var(--fg-muted);} .glymap .gm.red b{color:var(--error);}
.glymap .gmn{font-family:var(--sans);font-size:11.5px;color:var(--fg-muted);line-height:1.55;margin-top:11px;}
@media(max-width:840px){.srcwrap,.demogrid,.minirow{grid-template-columns:1fr;}}
</style>
</head>

<script type="text/babel">
const t = window.t || ((en,zh)=>en);

/* ───────── source decode ───────── */
const OC=[
  ['◇',t('Centered empty state','居中空状态'),t('wordmark + “Ask anything” composer + rotating Tip','wordmark + “Ask anything” composer + 轮换 Tip')],

  ['⌕',t('Slash command palette','斜杠命令面板'),t('two columns: /cmd + description, fuzzy','两列:/命令 + 描述,模糊')],
  ['☑',t('Completed-step chip','完成步骤 chip'),t('☑ Build · glm-5.1 · 7.1s — collapsible w/ duration','☑ Build · glm-5.1 · 7.1s —— 可折叠带耗时')],
  ['◳',t('Top-right update toast','右上更新提示'),t('“Updating to v1.17.6…” — ambient, non-blocking','“Updating to v1.17.6…” —— 余光、不阻断')],
];
const HM=[
  ['◆',t('Streaming tool/skill timeline','流式工具/技能时间线'),t('preparing→result rows: icon + arg + duration, tree pipes','preparing→结果行:图标 + 参数 + 耗时,树形管线')],
  ['⚠',t('Dangerous-command approval','危险命令审批'),t('4 grant tiers: once / session / permanent / deny','4 档授权:本次 / 会话 / 永久 / 拒绝')],
  ['◷',t('Countdown auto-deny','倒计时自动拒绝'),t('“Enter to confirm (55s)” → times out to Deny','“Enter 确认 (55s)” → 超时即拒')],
  ['▣',t('Capability catalog','能力目录'),t('Available Tools / Skills, “19 tools · 137 skills”','可用工具 / 技能,“19 tools · 137 skills”')],
  ['↩',t('Graceful denied fallback','拒绝后的优雅兜底'),t('“denied — here’s the command to run yourself”','“已拒 —— 这是你可自己跑的命令”')],
  ['▰',t('Block-bar budget meter','块状预算计'),t('kimi-k2.6 | 23.3K/256K [▰▰▱] 9% | elapsed','kimi-k2.6 | 23.3K/256K [▰▰▱] 9% | 耗时')],
];

/* ───────── adopt table ───────── */
const ADOPT=[
  ['hermes','◆ '+t('tool/skill timeline','工具/技能时间线'),[t('Work-state stream','工作态流')],'T3 · T1',[t('strongest pattern. preparing→result rows w/ per-step duration. Swap emoji → Viden glyphs (▶/⏸/✓/✕), color = state (T4 §08).','最强模式。preparing→结果行带每步耗时。emoji 换 Viden 字形(▶/⏸/✓/✕),颜色即状态(T4 §08)。')],'now',t('NOW','现在')],
  ['hermes','⚠ '+t('4-tier command gate','4 档命令闸'),[t('Approval / contract gate','审批 / 契约闸')],'T4 · D2',[t('once / session / permanent allowlist / deny — fold into our gate. Allowlist persists per-repo.','本次 / 会话 / 永久白名单 / 拒绝 —— 并入我们的闸。白名单按仓库持久化。')],'now',t('NOW','现在')],
  ['hermes','◷ '+t('countdown auto-deny','倒计时自动拒'),[t('Unattended gates','无人值守闸')],'T4',[t('safe default when away. Auto-deny (never auto-allow). Visible bar + seconds.','离开时的安全默认。超时即拒(绝不自动放行)。可见进度条 + 秒数。')],'now',t('NOW','现在')],
  ['opencode','⌕ '+t('slash palette + desc','斜杠面板 + 描述'),[t('Command palette','命令面板')],'T2',[t('two-column /cmd + description over our jump. Reuse fuzzy + grouped headers.','两列 /命令 + 描述,叠加到我们的跳转。复用模糊 + 分组 header。')],'now',t('NOW','现在')],
