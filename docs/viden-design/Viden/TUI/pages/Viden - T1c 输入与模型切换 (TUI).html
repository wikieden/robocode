<!DOCTYPE html>
<html lang="en" data-mode="dark" data-skin="aurora">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viden · TUI Multi-line Input & Model Switch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="../../i18n.js"></script>
<script src="../../chrome.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../tui-kit.css">
<style>
/* Token 单一真源 → ../tokens.css;本页只用 var(--*)。默认 :root = dark 皮肤。 */
*{box-sizing:border-box;}
body{margin:0;background:var(--page-bg);color:var(--fg-primary);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
.pwrap{max-width:1140px;margin:0 auto;padding:26px 24px 80px;}
.pkicker{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.pkicker::before{content:"";width:24px;height:2px;background:var(--accent);}
.ph1{font-size:26px;margin:0 0 8px;letter-spacing:-.6px;} .ph1 .ac{color:var(--accent);}
.plead{font-size:13.5px;color:var(--fg-secondary);margin:0 0 16px;max-width:960px;line-height:1.65;text-wrap:pretty;} .plead b{color:var(--fg-primary);font-weight:600;}
.plead kbd,kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--accent-bright);background:var(--bg-panel);}

.sech{display:flex;align-items:baseline;gap:11px;margin:28px 0 12px;}
.sech .no{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700;} .sech h2{font-size:17px;margin:0;} .sech .en{font-family:var(--mono);font-size:10px;color:var(--fg-faint);letter-spacing:1px;text-transform:uppercase;} .sech .sp{flex:1;height:1px;background:var(--border-soft);align-self:center;}

/* terminal —— 外框改用 tui-kit .vterm（单一真源） */
.vterm .vterm-chrome{opacity:.5;}


.tbody{padding:13px 15px;min-height:120px;font-size:13px;color:var(--fg-secondary);line-height:1.55;}
.t-acc{color:var(--accent);}.t-br{color:var(--accent-bright);}.t-gold{color:var(--gold-bright);}.t-suc{color:var(--success);}.t-mut{color:var(--fg-muted);}.t-fnt{color:var(--fg-faint);}.t-pri{color:var(--fg-primary);}.t-vio{color:var(--builtin);}.bld{font-weight:700;}
.umsg{display:flex;gap:8px;align-items:baseline;}.umsg .p{color:var(--accent-bright);font-weight:700;}

/* composer (multi-line) */
.composer{border-top:1px solid var(--border-soft);background:color-mix(in srgb,var(--bg-void) 60%,transparent);padding:9px 13px;}
.cline{display:flex;gap:9px;background:var(--bg-base);border:1px solid var(--border);border-radius:8px;padding:8px 11px;align-items:flex-start;}
.cline.multi{border-color:var(--accent-dim);}
.cline .pr{color:var(--accent-bright);font-weight:700;padding-top:1px;}
.cgut{flex:none;color:var(--fg-faint);font-size:12px;text-align:right;padding-top:1px;user-select:none;}
.cin{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:13px;color:var(--fg-primary);}
.cin .ln{white-space:pre;} .cin .ln.fence{color:var(--success);} .cin .cur{display:inline-block;width:7px;height:14px;background:var(--accent-bright);vertical-align:-2px;animation:blink 1.1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
.chint{display:flex;align-items:center;gap:13px;padding:7px 4px 1px;font-size:10.5px;color:var(--fg-faint);flex-wrap:wrap;}
.chint .sp{flex:1;} .chint b{color:var(--accent-bright);font-weight:600;}
/* 底部状态栏已迁到 tui-kit .vstatus / .vseg / .vbe（删除内联 .statusbar fork） */

/* control row */
.ctrl{display:flex;align-items:center;gap:10px;margin:6px 0 12px;flex-wrap:wrap;}
.seg2{display:flex;gap:3px;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:9px;padding:3px;}
.seg2 button{font-family:var(--mono);font-size:11.5px;color:var(--fg-muted);border:0;background:transparent;border-radius:6px;padding:5px 13px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.seg2 button.on{background:var(--bg-sel);} .seg2 button.on.acp{color:var(--accent-bright);} .seg2 button.on.builtin{color:var(--builtin);}
.seg2 button .d{width:7px;height:7px;border-radius:50%;}
.ctrl .hint{font-family:var(--mono);font-size:10.5px;color:var(--fg-faint);}

/* model picker overlay */
.ovl{position:absolute;inset:0;background:color-mix(in srgb,var(--term-screen) 62%,transparent);display:flex;align-items:flex-end;justify-content:center;padding-bottom:54px;z-index:10;}
.pick{width:min(560px,92%);background:var(--bg-panel);border:1px solid var(--accent-dim);border-radius:11px;overflow:hidden;box-shadow:var(--shadow-md);}
.pick .ph{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--border-soft);font-size:12px;}
.pick .ph .tt{font-weight:700;color:var(--fg-primary);} .pick .ph .be{font-family:var(--mono);font-size:9.5px;font-weight:700;border-radius:4px;padding:1px 7px;border:1px solid;margin-left:auto;}
.be.acp{color:var(--accent);border-color:var(--accent-dim);} .be.builtin{color:var(--builtin);border-color:color-mix(in srgb,var(--builtin) 45%,transparent);}
.pgrp{padding:5px 0;}
.pglabel{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--fg-faint);padding:6px 15px 4px;display:flex;align-items:center;gap:7px;}
.pglabel .lock{color:var(--fg-faint);font-weight:400;letter-spacing:0;text-transform:none;}
.prow{display:flex;align-items:center;gap:11px;padding:8px 15px;cursor:pointer;border-left:2px solid transparent;}
.prow:hover{background:var(--bg-base);} .prow.on{background:var(--bg-sel);border-left-color:var(--accent);}
.prow .rad{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--border);flex:none;display:grid;place-items:center;}
.prow.on .rad{border-color:var(--accent-bright);} .prow.on .rad::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent-bright);}
.prow .nm{font-family:var(--mono);font-size:12.5px;color:var(--fg-primary);} .prow .sp{flex:1;} .prow .tag{font-family:var(--mono);font-size:9px;color:var(--fg-muted);border:1px solid var(--border);border-radius:4px;padding:0 6px;}
.prow.dis{opacity:.4;cursor:not-allowed;}
.pick .routing{border-top:1px solid var(--border-soft);padding:9px 15px;background:var(--bg-void);}
.rrow{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;color:var(--fg-secondary);padding:3px 0;}
.rrow .lab{width:118px;flex:none;color:var(--fg-muted);} .rrow .arrow{color:var(--fg-faint);} .rrow .mdl{color:var(--builtin);font-weight:600;}
.pick .pf{padding:7px 15px;border-top:1px solid var(--border-soft);font-family:var(--mono);font-size:9.5px;color:var(--fg-faint);display:flex;gap:13px;}

.vtbl{width:100%;border-collapse:collapse;font-size:13px;}
.vtbl th{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--fg-muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);}
.vtbl td{padding:9px 12px;border-bottom:1px solid var(--border-soft);color:var(--fg-secondary);vertical-align:top;line-height:1.5;} .vtbl td:first-child{font-family:var(--mono);white-space:nowrap;color:var(--accent-bright);width:150px;} .vtbl td b{color:var(--fg-primary);}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.card{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:11px;padding:14px 16px;border-top:2px solid;}
.card.acp{border-top-color:var(--accent);} .card.builtin{border-top-color:var(--builtin);}
.card .h{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:6px;} .card .h .tag{font-family:var(--mono);font-size:9px;font-weight:700;border-radius:4px;padding:1px 7px;border:1px solid;}
.card.acp .h .tag{color:var(--accent);border-color:var(--accent-dim);} .card.builtin .h .tag{color:var(--builtin);border-color:color-mix(in srgb,var(--builtin) 45%,transparent);}
.card p{font-size:12.5px;color:var(--fg-secondary);line-height:1.55;margin:6px 0;} .card p b{color:var(--fg-primary);}
.divnote{font-size:13px;color:var(--fg-secondary);line-height:1.65;background:var(--bg-panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:13px 17px;margin-top:14px;text-wrap:pretty;} .divnote b{color:var(--fg-primary);} .divnote .c{color:var(--accent-bright);font-family:var(--mono);font-size:12px;}
@media(max-width:760px){.cards{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="pwrap"><div id="root"></div></div>
<script type="text/babel">
const {useState} = React;
const t = window.t || ((en,zh)=>en);

const ACP_MODELS=[
  {id:'gpt-5-codex',tag:'default'},
  {id:'gpt-5',tag:''},
  {id:'o4-mini',tag:'fast'},
];
const BUILTIN=[
  {prov:'Anthropic',models:[['claude-sonnet-4.6',''],['claude-haiku-4.5','fast']]},
  {prov:'OpenAI',models:[['gpt-5',''],['gpt-5-mini','fast']]},
  {prov:'Google',models:[['gemini-2.5-pro','']]},
  {prov:'DeepSeek',models:[['deepseek-v4','cheap']]},
  {prov:'Local',models:[['qwen3-coder','on-device']]},
];

function Picker({backend,model,setModel,close}){
  return (
    <div className="ovl" onClick={close}>
      <div className="pick" onClick={e=>e.stopPropagation()}>
        <div className="ph"><span className="tt">{t('Switch model','切换模型')}</span><span className="t-mut" style={{fontFamily:'var(--mono)',fontSize:'10.5px'}}>/model</span><span className={"be "+backend}>{backend==='acp'?'ACP: codex':t('Built-in','内置')}</span></div>
        {backend==='acp' ? <React.Fragment>
          <div className="pgrp">
            <div className="pglabel">{t('Models exposed by codex','codex 暴露的模型')} <span className="lock">· {t('provider = the agent\u2019s account','供应商 = 该 agent 账户')}</span></div>
            {ACP_MODELS.map(m=>(
              <div key={m.id} className={"prow "+(model===m.id?'on':'')} onClick={()=>{setModel(m.id);close();}}>
                <span className="rad"></span><span className="nm">{m.id}</span><span className="sp"></span>{m.tag&&<span className="tag">{m.tag}</span>}
              </div>
            ))}
          </div>
          <div className="pf"><span>{t('provider fixed by ACP agent','供应商由 ACP agent 固定')}</span><span>·</span><span>{t('switch agent → ⌃L','换 agent → ⌃L')}</span></div>
        </React.Fragment> : <React.Fragment>
          {BUILTIN.map(g=>(
            <div className="pgrp" key={g.prov}>
              <div className="pglabel">{g.prov}</div>
              {g.models.map(m=>(
                <div key={m[0]} className={"prow "+(model===m[0]?'on':'')} onClick={()=>{setModel(m[0]);close();}}>
                  <span className="rad"></span><span className="nm">{m[0]}</span><span className="sp"></span>{m[1]&&<span className="tag">{m[1]}</span>}
                </div>
              ))}
            </div>
          ))}
          <div className="routing">
            <div className="pglabel" style={{padding:'0 0 5px'}}>{t('Routing policy','模型路由策略')} <span className="lock">· viden.toml [models]</span></div>
            <div className="rrow"><span className="lab">{t('triage / summarize','整理 / 摘要')}</span><span className="arrow">→</span><span className="mdl">deepseek-v4</span></div>
            <div className="rrow"><span className="lab">{t('implement / refactor','实现 / 重构')}</span><span className="arrow">→</span><span className="mdl">{model}</span></div>
          </div>
          <div className="pf"><span>{t('built-in = pick provider + model freely','内置 = 供应商 + 模型自由选')}</span><span>·</span><span>{t('per-task routing','按任务路由')}</span></div>
        </React.Fragment>}
      </div>
    </div>
  );
}

function App(){
  const [backend,setBackend]=useState('acp');
  const [pick,setPick]=useState(false);
  const [acpModel,setAcpModel]=useState('gpt-5-codex');
  const [biModel,setBiModel]=useState('claude-sonnet-4.6');
  const model = backend==='acp'?acpModel:biModel;
  const setModel = backend==='acp'?setAcpModel:setBiModel;

  return (
    <React.Fragment>
      <div className="pkicker">viden · TUI · input &amp; models</div>
      <h1 className="ph1">{t('Multi-line Input & Model Switch','多行输入与模型切换')} <span className="ac">{t('composer · /model','composer · /model')}</span></h1>
      <p className="plead">{t('Two TUI questions: (1) how the composer handles ','两个 TUI 问题:(1) 输入框怎么处理')}<b>{t('multi-line input','多行输入')}</b>{t('; (2) how you switch ','; (2) 怎么切')}<b>{t('model & provider','模型 & 供应商')}</b>{t(' for built-in vs ACP agents. Both demos below.',' —— builtin 与 ACP 两种情况。下面都是 demo。')}</p>

      {/* ── Section 1: multi-line input ── */}
      <div className="sech"><span className="no">01</span><h2>{t('Multi-line input','多行输入')}</h2><span className="en">enter sends · shift+enter newline</span><span className="sp"></span></div>
      <div className="vterm">
        <div className="vterm-chrome"><span className="vlights"><i className="a"></i><i className="b"></i><i className="c"></i></span><span className="vtitle">{t('your terminal','你的终端')} · L2 · S1</span></div>
        <div className="tbody">
          <div className="umsg"><span className="p">❯</span><span className="t-pri">{t('Refactor the dash cancel to use a buffer; keep these constraints:','把冲刺取消改成用缓冲;保持这些约束:')}</span></div>
        </div>
        <div className="composer">
          <div className="cline multi">
            <span className="pr">❯</span>
            <span className="cgut">1<br/>2<br/>3<br/>4</span>
            <div className="cin">
              <span className="ln">{t('Refactor _cancel_window() to read from an input buffer.','把 _cancel_window() 改成从输入缓冲读。')}</span>
              <span className="ln">{t('Constraints:','约束:')}</span>
              <span className="ln">  - {t('window stays in 8\u201312f (contract \u00a74)','窗口保持 8–12 帧(契约 §4)')}</span>
              <span className="ln">  - {t('must pass replay/stagger-combo','必须过 replay/stagger-combo')}<span className="cur"></span></span>
            </div>
          </div>
          <div className="chint">
            <span><kbd>⏎</kbd> <b>{t('send','发送')}</b></span>
            <span><kbd>⇧⏎</kbd> / <kbd>⌥⏎</kbd> {t('newline','换行')}</span>
            <span><kbd>⌃E</kbd> {t('open $EDITOR','打开 $EDITOR')}</span>
            <span><kbd>```</kbd> {t('code block','代码块')}</span>
            <span><kbd>⌃V</kbd> {t('paste keeps newlines','粘贴保留换行')}</span>
            <span className="sp"></span>
            <span className="t-fnt">{t('auto-grows to ~8 lines, then scrolls','自动长到 ~8 行后内部滚动')}</span>
          </div>
        </div>
        <div className="vstatus">
          <span className="vseg proj">◉ boss-rush</span><span className="vseg" style={{color:'var(--fg-primary)'}}>L2 · S1</span>
          <span className="vsp"></span><span className="vseg r"><span className="vk-gold">⊟ 4 {t('lines','行')}</span></span><span className="vseg r">INSERT</span>
        </div>
      </div>
      <table className="vtbl" style={{marginTop:'14px'}}>
        <tbody>
          <tr><td>⏎ Enter</td><td><b>{t('Send','发送')}</b> {t('(default). Single most common action stays one keystroke.','(默认)。最常用动作保持一击。')}</td></tr>
          <tr><td>⇧⏎ / ⌥⏎</td><td>{t('Insert newline — composer ','插入换行 —— 输入框 ')}<b>{t('auto-grows','自动增高')}</b>{t(' (up to ~8 lines, then scrolls inside). Gutter line numbers appear once multi-line.',' (到 ~8 行后内部滚动)。多行后出现行号。')}</td></tr>
          <tr><td>⌃E</td><td>{t('Hand off to ','交给 ')}<b>$EDITOR</b>{t(' (vim/nvim/$VISUAL) for long prompts — edit, save, quit returns the text. The terminal-native ','(vim/$VISUAL)写长 prompt —— 编辑、保存、退出即回填。终端原生的"')}<b>{t('compose mode','撰写模式')}</b>{t('".','"。')}</td></tr>
          <tr><td>``` fence</td><td>{t('Opening a triple-backtick starts a ','打三反引号进入')}<b>{t('code/paste block','代码/粘贴块')}</b>{t(' — Enter inside is a newline until the closing fence, so pasted code never sends early.',' —— 块内 Enter 是换行,直到闭合,粘贴代码不会提前发送。')}</td></tr>
          <tr><td>{t('Paste','粘贴')}</td><td>{t('Multi-line paste keeps newlines (bracketed paste) and ','多行粘贴保留换行(bracketed paste),且')}<b>{t('does not auto-send','不自动发送')}</b>{t(' — you review, then ⏎.',' —— 你先看,再 ⏎。')}</td></tr>
          <tr><td>Esc</td><td>{t('Leave INSERT → NORMAL (keys act on the view); composer keeps the draft.','离开 INSERT → NORMAL(单键作用于视图);草稿保留。')}</td></tr>
        </tbody>
      </table>

      {/* ── Section 2: model / provider switch ── */}
      <div className="sech"><span className="no">02</span><h2>{t('Switch model & provider','切换模型与供应商')}</h2><span className="en">built-in vs ACP</span><span className="sp"></span></div>
      <div className="ctrl">
        <span className="hint">{t('current lane backend:','当前 lane 后端:')}</span>
        <div className="seg2">
          <button className={"acp "+(backend==='acp'?'on acp':'')} onClick={()=>setBackend('acp')}><span className="d" style={{background:'var(--accent)'}}></span>ACP · codex</button>
          <button className={"builtin "+(backend==='builtin'?'on builtin':'')} onClick={()=>setBackend('builtin')}><span className="d" style={{background:'var(--builtin)'}}></span>{t('Built-in','内置')}</button>
        </div>
        <span className="hint">{t('click the model in the status bar ↓ (or','点状态栏里的模型 ↓(或')} <kbd>⌃M</kbd> / <code style={{fontFamily:'var(--mono)',color:'var(--accent-bright)'}}>/model</code>)</span>
      </div>
      <div className="vterm">
        <div className="vterm-chrome"><span className="vlights"><i className="a"></i><i className="b"></i><i className="c"></i></span><span className="vtitle">{t('your terminal','你的终端')} · L2 · S1</span></div>
        <div className="tbody" style={{minHeight:'90px'}}>
          <div className="umsg"><span className="p">❯</span><span className="t-pri">{backend==='acp'?t('(ACP) codex runs on its own account — you pick among the models it exposes.','(ACP)codex 跑在自己账户上 —— 你在它暴露的模型里挑。'):t('(Built-in) viden\u2019s own agent — pick any provider + model, and set per-task routing.','(内置)viden 自带 agent —— 供应商 + 模型随便选,还能配按任务路由。')}</span></div>
          {backend==='builtin' && <div style={{marginTop:'8px'}} className="t-vio">⇄ {t('routing: triage → deepseek-v4 · implement → ','路由:整理 → deepseek-v4 · 实现 → ')}{biModel}</div>}
        </div>
        <div className="vstatus">
          <span className="vseg proj">◉ boss-rush</span>
          <span className="vseg"><span className={"vbe "+backend}>{backend==='acp'?<React.Fragment><span className="k">ACP</span>:<span className="ag">codex</span></React.Fragment>:t('built-in','内置')}</span></span>
          <span className="vseg" style={{cursor:'pointer'}} onClick={()=>setPick(true)}>◇ {model} <span className="vk-faint">⌃M</span></span>
          <span className="vsp"></span><span className="vseg r">⊨ local</span><span className="vseg r">ctx 24%</span>
        </div>
        {pick && <Picker backend={backend} model={model} setModel={setModel} close={()=>setPick(false)}/>}
      </div>
      <div className="cards" style={{marginTop:'14px'}}>
        <div className="card acp">
          <div className="h">{t('ACP agent','ACP 外部 agent')} <span className="tag">{t('switch within','内部切')}</span></div>
          <p>{t('The agent owns the connection & account. You switch among ','agent 自带连接与账户。你在它')}<b>{t('the models it exposes','暴露的模型')}</b>{t(' (codex → gpt-5-codex / gpt-5 / o4-mini). Provider is fixed by the agent.',' 之间切(codex → gpt-5-codex / gpt-5 / o4-mini)。供应商由 agent 固定。')}</p>
          <p>{t('Want a different provider? That\u2019s a ','想换供应商?那是')}<b>{t('different agent','换 agent')}</b>{t(' — switch lane backend via ',' —— 用 ')}<kbd>⌃L</kbd>{t(' or new lane (D4).',' 或新建 lane(D4)切后端。')}</p>
        </div>
        <div className="card builtin">
          <div className="h">{t('Built-in agent','内置 agent')} <span className="tag">{t('full control','全可控')}</span></div>
          <p>{t('viden drives the API directly: pick ','viden 直连 API:')}<b>{t('provider + model','供应商 + 模型')}</b>{t(' freely (Anthropic / OpenAI / Google / DeepSeek / local), incl. on-device for privacy.',' 自由选(Anthropic/OpenAI/Google/DeepSeek/本地),含本地离线。')}</p>
          <p><b>{t('Routing policy','模型路由')}</b>{t(': cheap model for triage/summarize, strong model for implement — declared in ',':整理/摘要用便宜模型、实现用强模型 —— 在 ')}<code style={{fontFamily:'var(--mono)',color:'var(--accent-bright)'}}>viden.toml [models]</code>{t(', editable here.',' 声明,这里也能改。')}</p>
        </div>
      </div>
      <div className="divnote"><b>{t('Key distinction','关键区别')}</b>{t(': ACP = ','::ACP = ')}<span className="c">{t('switch model within an agent','在一个 agent 内换模型')}</span>{t(' (provider comes with the agent); built-in = ','(供应商随 agent);内置 = ')}<span className="c">{t('switch provider + model + routing','换供应商 + 模型 + 路由')}</span>{t('. Both via the status-bar model chip or ','。都走状态栏模型块或 ')}<kbd>⌃M</kbd> / <code style={{fontFamily:'var(--mono)',color:'var(--accent-bright)'}}>/model</code>{t('; switching the whole agent/provider stack is ','切换整个 agent/供应商栈用 ')}<kbd>⌃L</kbd>{t('. Same list contract as everything else (T4).',' 套用 T4 的列表契约。')}</div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
