<!DOCTYPE html>
<html lang="en" data-mode="dark" data-skin="aurora">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viden · TUI Conversation Work States</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="../../i18n.js"></script>
<script src="../../chrome.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../tui-kit.css">
<style>
/* Token 单一真源 → ../tokens.css;本页只用 var(--*)。默认 :root = dark 皮肤。 */
*{box-sizing:border-box;}
body{margin:0;background:var(--page-bg);color:var(--fg-primary);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
.pwrap{max-width:1240px;margin:0 auto;padding:26px 24px 90px;}
.pkicker{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.pkicker::before{content:"";width:24px;height:2px;background:var(--accent);}
.ph1{font-size:27px;margin:0 0 8px;letter-spacing:-.6px;}
.ph1 .ac{color:var(--accent);}
.plead{font-size:13.5px;color:var(--fg-secondary);margin:0 0 18px;max-width:960px;line-height:1.65;text-wrap:pretty;}
.plead b{color:var(--fg-primary);font-weight:600;}
.plead .g{color:var(--gold-bright);} .plead .c{color:var(--accent-bright);}

.sech{display:flex;align-items:baseline;gap:11px;margin:34px 0 14px;}
.sech .no{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700;}
.sech h2{font-size:18px;margin:0;letter-spacing:-.3px;}
.sech .en{font-family:var(--mono);font-size:10.5px;color:var(--fg-faint);letter-spacing:1px;text-transform:uppercase;}
.sech .sp{flex:1;height:1px;background:var(--border-soft);align-self:center;}
.subl{font-size:13px;color:var(--fg-muted);margin:-6px 0 14px;line-height:1.6;text-wrap:pretty;}
.subl b{color:var(--fg-secondary);}

/* terminal —— 外框改用 tui-kit .vterm（单一真源） */
.vterm .vterm-chrome{opacity:.5;}


.vterm-chrome .sp{flex:1;} .vterm-chrome .st{font-size:9.5px;color:var(--fg-faint);font-style:italic;}
.tbody{padding:13px 16px;font-size:13.5px;line-height:1.55;min-height:200px;display:flex;flex-direction:column;gap:9px;}
/* 底部状态栏已迁到 tui-kit .vstatus / .vseg / .vbe（动态状态段以 vseg + 色类渲染） */

/* text colors */
.t-acc{color:var(--accent);}.t-br{color:var(--accent-bright);}.t-gold{color:var(--gold-bright);}.t-gd{color:var(--gold);}
.t-suc{color:var(--success);}.t-warn{color:var(--warning);}.t-err{color:var(--error);}.t-prog{color:var(--progress);}
.t-mut{color:var(--fg-muted);}.t-fnt{color:var(--fg-faint);}.t-sec{color:var(--fg-secondary);}.t-pri{color:var(--fg-primary);}.bld{font-weight:700;}
.umsg{display:flex;gap:9px;align-items:baseline;background:var(--bg-base);border-left:2px solid var(--accent-dim);border-radius:0 6px 6px 0;padding:6px 11px;}
.umsg .p{color:var(--accent-bright);font-weight:700;}
.tool{border-left:2px solid var(--border);padding:2px 0 2px 11px;display:flex;flex-direction:column;gap:2px;color:var(--fg-secondary);}
.tool .g{color:var(--accent);font-weight:700;} .add{color:var(--success);} .del{color:var(--error);}
.curs{display:inline-block;width:8px;height:15px;background:var(--accent-bright);vertical-align:-3px;margin-left:1px;}
.blink{animation:blink 1.05s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}

/* play controls */
.playbar{display:flex;align-items:center;gap:10px;margin:10px 0 4px;flex-wrap:wrap;}
.pb{font-family:var(--mono);font-size:11.5px;color:var(--fg-secondary);border:1px solid var(--border);border-radius:7px;padding:5px 12px;cursor:pointer;background:transparent;display:flex;align-items:center;gap:7px;}
.pb:hover{color:var(--fg-primary);border-color:var(--fg-muted);}
.pb.on{color:var(--accent-bright);border-color:var(--accent-dim);background:var(--bg-sel);}
.steps{display:flex;gap:4px;flex-wrap:wrap;}
.stp{font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);padding:3px 9px;border-radius:6px;cursor:pointer;border:1px solid transparent;}
.stp:hover{color:var(--fg-secondary);}
.stp.on{color:var(--accent-bright);background:var(--bg-sel);border-color:var(--accent-dim);}

/* catalog */
.cat{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.scard{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:11px;overflow:hidden;border-left:3px solid var(--border);}
.scard .sh{display:flex;align-items:center;gap:9px;padding:9px 14px 7px;}
.scard .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.scard .nm{font-size:14px;font-weight:700;}
.scard .en{font-family:var(--mono);font-size:9.5px;color:var(--fg-faint);}
.scard .sp{flex:1;}
.scard .sbtok{font-family:var(--mono);font-size:9.5px;border:1px solid var(--border);border-radius:5px;padding:1px 7px;color:var(--fg-muted);}
.scard .demo{background:var(--bg-void);border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);padding:10px 14px;font-family:var(--mono);font-size:12.5px;min-height:42px;display:flex;align-items:center;white-space:pre;overflow:hidden;}
.scard .note{padding:8px 14px;font-size:11.5px;color:var(--fg-muted);line-height:1.5;}
.scard .note b{color:var(--fg-secondary);}
.braille{letter-spacing:-1px;}

/* permission prompt */
.perm{border:1px solid color-mix(in srgb,var(--gold) 38%,transparent);background:color-mix(in srgb,var(--gold) 7%,var(--bg-void));border-radius:9px;overflow:hidden;}
.perm.pulse{animation:permpulse 2.1s ease-in-out infinite;}
@keyframes permpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 0%,transparent);}50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 10%,transparent);}}
.perm .ph{display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid color-mix(in srgb,var(--gold) 22%,transparent);font-size:13px;font-weight:700;color:var(--gold-bright);}
.perm .ph .risk{margin-left:auto;font-family:var(--mono);font-size:9.5px;font-weight:700;border-radius:4px;padding:1px 7px;border:1px solid;}
.risk.hi{color:var(--error);border-color:color-mix(in srgb,var(--error) 45%,transparent);background:color-mix(in srgb,var(--error) 8%,transparent);}
.risk.md{color:var(--gold-bright);border-color:color-mix(in srgb,var(--gold) 45%,transparent);}
.risk.lo{color:var(--success);border-color:color-mix(in srgb,var(--success) 40%,transparent);}
.perm .pwhat{padding:10px 14px;font-family:var(--mono);font-size:12.5px;color:var(--fg-secondary);line-height:1.6;}
.perm .pwhat .cmd{color:var(--fg-primary);background:var(--bg-void);border:1px solid var(--border);border-radius:5px;padding:2px 8px;display:inline-block;}
.perm .pwhat .why{color:var(--fg-muted);font-family:var(--sans);font-size:12px;}
.perm .pwhat .tgt{color:var(--error);font-weight:700;}
.perm .opts{display:flex;flex-wrap:wrap;gap:7px;padding:11px 14px;border-top:1px solid color-mix(in srgb,var(--gold) 18%,transparent);}
.opt{font-family:var(--mono);font-size:11.5px;border-radius:6px;padding:5px 11px;border:1px solid var(--border);color:var(--fg-secondary);display:flex;align-items:center;gap:6px;cursor:pointer;}
.opt:hover{border-color:var(--fg-muted);color:var(--fg-primary);}
.opt .k{color:var(--accent-bright);font-weight:700;}
.opt.allow{border-color:color-mix(in srgb,var(--success) 40%,transparent);color:var(--success);}
.opt.allow:hover{background:color-mix(in srgb,var(--success) 10%,transparent);}
.opt.deny{border-color:color-mix(in srgb,var(--error) 35%,transparent);color:var(--error);}
.opt.deny:hover{background:color-mix(in srgb,var(--error) 9%,transparent);}
.opt.always{border-color:color-mix(in srgb,var(--gold) 38%,transparent);color:var(--gold-bright);}
.permgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* compare perm vs gate */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.cmpc{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:11px;padding:14px 16px;border-top:2px solid;}
.cmpc.p{border-top-color:var(--gold);} .cmpc.g{border-top-color:var(--accent);}
.cmpc .h{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.cmpc .h .tag{font-family:var(--mono);font-size:9.5px;font-weight:700;border-radius:4px;padding:1px 7px;border:1px solid;}
.cmpc.p .h .tag{color:var(--gold-bright);border-color:color-mix(in srgb,var(--gold) 40%,transparent);}
.cmpc.g .h .tag{color:var(--accent-bright);border-color:var(--accent-dim);}
.cmpc dl{margin:0;display:grid;grid-template-columns:62px 1fr;gap:6px 10px;font-size:12.5px;}
.cmpc dt{font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);}
.cmpc dd{margin:0;color:var(--fg-secondary);line-height:1.45;} .cmpc dd b{color:var(--fg-primary);}

/* principles / policy */
.rules{display:flex;flex-direction:column;gap:9px;}
.rule{display:flex;gap:12px;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:10px;padding:11px 15px;}
.rule .ic{font-family:var(--mono);font-size:13px;color:var(--accent);flex:none;width:18px;text-align:center;}
.rule .tx{font-size:13px;color:var(--fg-secondary);line-height:1.55;} .rule .tx b{color:var(--fg-primary);} .rule .tx code{font-family:var(--mono);font-size:12px;color:var(--accent-bright);}
.divnote{font-size:13px;color:var(--fg-secondary);line-height:1.65;background:var(--bg-panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:13px 17px;margin-top:16px;text-wrap:pretty;}
.divnote b{color:var(--fg-primary);} .divnote .c{color:var(--accent-bright);font-family:var(--mono);font-size:12px;}
.links{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;}
.lk{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--fg-secondary);background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:8px;padding:8px 13px;text-decoration:none;}
.lk:hover{border-color:var(--accent-dim);color:var(--fg-primary);} .lk .ar{color:var(--accent);}
@media(max-width:860px){.cat,.permgrid,.cmp{grid-template-columns:1fr;}}
@media (prefers-reduced-motion: reduce){.perm.pulse{animation:none;}.blink{animation:none;}}
</style>
</head>
<body>
<div class="pwrap">
  <div class="pkicker">viden · TUI · conversation states + permissions</div>
  <div id="root"></div>
</div>

<script type="text/babel">
const {useState,useEffect,useRef} = React;
const t = window.t || ((en,zh)=>en);
const SPIN=['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
const BR=['░','▒','▓','█'];

function useTick(ms){const [f,setF]=useState(0);useEffect(()=>{const id=setInterval(()=>setF(x=>x+1),ms);return()=>clearInterval(id);},[]);return f;}

/* braille progress bar */
function bar(frac,width){const full=Math.round(frac*width);return '█'.repeat(full)+'░'.repeat(width-full);}

/* ─────────── HERO: full-arc auto play ─────────── */
const ARC=[
  {k:'ready',nm:t('Ready','待命')},{k:'queued',nm:t('Queued','已提交')},{k:'thinking',nm:t('Thinking','思考')},{k:'streaming',nm:t('Streaming','流式')},
  {k:'edit',nm:t('Edit file','改文件')},{k:'run',nm:t('Run cmd','跑命令')},{k:'validate',nm:t('Validate','验证')},{k:'permission',nm:t('Permission','权限')},{k:'done',nm:t('Done','完成')},
];
function Hero(){
  const f=useTick(95);
  const [step,setStep]=useState(2);
  const [play,setPlay]=useState(true);
  const stepRef=useRef(step); stepRef.current=step;
  useEffect(()=>{
    if(!play)return;
    const id=setInterval(()=>setStep(s=>(s+1)%ARC.length),1900);
    return()=>clearInterval(id);
  },[play]);
  const k=ARC[step].k;
  const sp=SPIN[f%10];
  const STT={ready:['t-mut',t('● ready','● 待命')],queued:['t-acc',sp+t(' queueing',' 提交中')],thinking:['t-acc',sp+t(' thinking 14s',' 思考 14s')],streaming:['t-prog',sp+t(' streaming',' 输出中')],edit:['t-acc',sp+t(' editing',' 改文件')],run:['t-prog',sp+t(' running',' 跑命令')],validate:['t-prog',sp+t(' validate ',' 验证 ')+Math.min(240,Math.floor((f*7)%260))+'f'],permission:['t-gold',t('⏸ awaiting you','⏸ 待你批准')],done:['t-suc',t('✓ done','✓ 完成')]}[k];
  // streaming typewriter
  const planTxt=t('Plan: change HITSTUN constant → run deterministic replay stagger-combo → check assertions.','计划:改 HITSTUN 常数 → 跑确定性回放 stagger-combo → 看断言。');
  const shown=planTxt.slice(0,Math.max(0,(f*2)%(planTxt.length+10)));
  const runLines=['compiling project…','loading replay/stagger-combo.vseq','frame 120 / 240 …','frame 210 / 240 …'];
  return (
    <div>
      <div className="playbar">
        <button className={"pb "+(play?'on':'')} onClick={()=>setPlay(p=>!p)}>{play?t('⏸ pause','⏸ 暂停'):t('▶ play','▶ 播放')} {t('full flow','全流程')}</button>
        <div className="steps">
          {ARC.map((s,i)=><span key={s.k} className={"stp "+(step===i?'on':'')} onClick={()=>{setPlay(false);setStep(i);}}>{i+1} {s.nm}</span>)}
        </div>
      </div>
      <div className="vterm">
        <div className="vterm-chrome"><span className="vlights"><i className="a"></i><i className="b"></i><i className="c"></i></span><span className="vtitle">{t('your terminal · L2 · S1 hitstun','你的终端 · L2 · S1 受击硬直')}</span><span className="sp"></span><span className="st">{t('live animation','实时动画')}</span></div>
        <div className="tbody">
          <div className="umsg"><span className="p">❯</span><span className="t-pri">{t('Bump hitstun from 0.18 to 0.24, run replay-regression to confirm combos don\u2019t stick.','把受击硬直从 0.18 提到 0.24,跑回放回归确认连段不卡。')}</span></div>
          {k==='ready' && <div className="t-fnt">❯ <span className="curs blink"></span> <span className="t-fnt">{t('Ask codex, or / for commands …','问 codex,或 / 命令 …')}</span></div>}
          {k==='queued' && <div className="t-acc">{sp}{t(' sent · waiting for codex to take over',' 已发送 · 等待 codex 接管')}{'.'.repeat((f>>2)%4)}</div>}
          {k==='thinking' && <div><span className="t-acc">{sp}{t(' thinking',' 思考中')}</span> <span className="t-fnt">{t('· 14s · reads design-spec.md §4 · esc to interrupt','· 14s · 读 design-spec.md §4 · esc 打断')}</span></div>}
          {k==='streaming' && <div><span className="t-gold bld">⡾ codex</span>  <span className="t-sec">{shown}</span><span className="curs"></span></div>}
          {k==='edit' && <div className="tool"><div><span className="g">⚙ edit</span> · src/enemy/stagger.gd <span className="t-fnt">+1 −1</span></div><div className="del">{'- const HITSTUN := 0.18'}</div><div className="add">{'+ const HITSTUN := 0.24'}</div></div>}
          {k==='run' && <div className="tool"><div><span className="g">▶ run</span> · godot --headless replay/stagger-combo.vseq</div><div className="t-mut">{runLines[(f>>3)%runLines.length]}</div><div className="t-fnt">{t('stdout streaming · ⌃C interrupt','stdout 流式 · ⌃C 打断')}</div></div>}
          {k==='validate' && <div><span className="t-prog">{t('replay re-run','回放重演')}</span> <span className="t-sec">{Math.min(240,Math.floor((f*7)%260))} / 240f</span>  <span className="t-prog braille">{bar(Math.min(1,((f*7)%260)/240),16)}</span></div>}
          {k==='permission' && <div className="perm pulse"><div className="ph">{t('⏸ Permission request · codex wants to run a command','⏸ 权限请求 · codex 想运行命令')}<span className="risk hi">{t('high risk','高危')}</span></div><div className="pwhat"><span className="cmd">rm -rf build/ &amp;&amp; godot --export</span><br/><span className="why">{t('Reason: clean old build then re-export — includes recursive delete','理由:清理旧构建后重新导出 —— 含递归删除')}</span></div><div className="opts"><span className="opt allow"><span className="k">y</span>{t(' allow once',' 允许一次')}</span><span className="opt"><span className="k">a</span>{t(' this session',' 本会话')}</span><span className="opt always"><span className="k">⇧A</span>{t(' always (write policy)',' 始终(写策略)')}</span><span className="opt deny"><span className="k">n</span>{t(' deny',' 拒绝')}</span></div></div>}
          {k==='done' && <div><span className="t-suc">{t('✓ done','✓ 完成')}</span> <span className="t-fnt">{t('· 3 tools · 1.4k tok · 28s · replay-regression gate formed → /gate','· 3 工具 · 1.4k tok · 28s · 回放回归闸已成形 → /gate')}</span></div>}
        </div>
        <div className="vstatus">
          <span className="vseg proj">◉ boss-rush</span>
          <span className="vseg lane">L2 · S1</span>
          <span className="vseg"><span className="vbe acp"><span className="k">ACP</span>:<span className="ag">codex</span></span></span>
          <span className="vsp"></span>
          <span className={"vseg "+STT[0]} style={{fontWeight:600}}>{STT[1]}</span>
          <span className="vseg r">⊨ local</span>
        </div>
      </div>
    </div>
  );
}

/* ─────────── catalog ─────────── */
function Demo({k,f}){
  const sp=SPIN[f%10];
  const txt=t('Plan: change HITSTUN → run replay → check assertions…','计划:改 HITSTUN → 跑回放 → 看断言…');
  const shown=txt.slice(0,Math.max(0,(f*2)%(txt.length+8)));
  const out=['compiling…','frame 120/240','frame 240/240 ok'];
  switch(k){
    case'ready':return <span className="t-fnt">❯ <span className="curs blink"></span> {t('Ask codex, or / for commands …','问 codex,或 / 命令 …')}</span>;
    case'queued':return <span className="t-acc">{sp}{t(' sent · waiting',' 已发送 · 等待接管')}{'.'.repeat((f>>2)%4)}</span>;
    case'thinking':return <span><span className="t-acc">{sp}{t(' thinking',' 思考中')}</span> <span className="t-fnt">{t('· 14s · esc to interrupt','· 14s · esc 打断')}</span></span>;
    case'streaming':return <span><span className="t-gold">⡾ codex</span> <span className="t-sec">{shown}</span><span className="curs"></span></span>;
    case'edit':return <span><span className="t-acc bld">⚙ edit</span> <span className="t-sec">stagger.gd</span> <span className="add">+1</span> <span className="del">−1</span></span>;
    case'run':return <span><span className="t-prog bld">▶ run</span> <span className="t-mut">{out[(f>>3)%out.length]}</span></span>;
    case'validate':return <span><span className="t-prog">{t('validate ','验证 ')}</span><span className="t-prog braille">{bar(Math.min(1,((f*6)%240)/240),14)}</span> <span className="t-sec">{Math.min(240,Math.floor((f*6)%240))}/240f</span></span>;
    case'permission':return <span><span className="t-gold">{t('⏸ permission','⏸ 权限')}</span> <span className="t-sec">{t('write contracts/** ?','写 contracts/** ?')}</span> <span className="t-fnt">y/n</span></span>;
    case'ask':return <span><span className="t-gold">? </span><span className="t-sec">{t('clamp stunlock to 26f for safety, do it?','stunlock 钳到 26f 更稳,做吗?')}</span><span className="curs"></span></span>;
    case'interrupted':return <span className="t-warn">{t('⎋ interrupted · partial · ','⎋ 已打断 · 部分完成 · ')}<span className="t-fnt">{t('⏎ continue / new instruction','⏎ 继续 / 新指令')}</span></span>;
    case'error':return <span className="t-err">{t('✗ runner failed · exit 1 · ','✗ runner 失败 · 退出码 1 · ')}<span className="t-fnt">{t('r retry · l log','r 重试 · l 日志')}</span></span>;
    case'retry':return <span className="t-warn">{sp}{t(' rate-limited · ',' 限流 · ')}{4-((f>>3)%5||0)}{t('s before retry (2/5)…','s 后重试 (2/5)…')}</span>;
    case'done':return <span className="t-suc">{t('✓ done · ','✓ 完成 · ')}<span className="t-fnt">{t('3 tools · 1.4k tok · 28s','3 工具 · 1.4k tok · 28s')}</span></span>;
    case'background':return <span className="t-mut">{t('◷ L2 running in background · ','◷ L2 后台运行 · ')}<span className="t-fnt">{t('you\u2019re not in this session','你不在此会话')}</span></span>;
    default:return null;
  }
}
