<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viden · TUI Design Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="i18n.js"></script>
<script src="chrome.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../tokens.css">
<style>
/* Token 单一真源 → ../tokens.css;本页只用 var(--*)。默认 :root = dark 皮肤。 */
*{box-sizing:border-box;}
body{margin:0;background:var(--page-bg);color:var(--fg-primary);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
.pwrap{max-width:1400px;margin:0 auto;padding:26px 24px 90px;}
.pkicker{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.pkicker::before{content:"";width:24px;height:2px;background:var(--accent);}
.ph1{font-size:28px;margin:0 0 8px;letter-spacing:-.6px;}
.ph1 .ac{color:var(--accent);}
.plead{font-size:13.5px;color:var(--fg-secondary);margin:0 0 14px;max-width:980px;line-height:1.65;text-wrap:pretty;}
.plead b{color:var(--fg-primary);font-weight:600;}
.plead .g{color:var(--gold-bright);font-family:var(--mono);font-size:12.5px;}
.plead .c{color:var(--accent-bright);font-family:var(--mono);font-size:12.5px;}

.sech{display:flex;align-items:baseline;gap:11px;margin:34px 0 14px;}
.sech .no{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700;}
.sech h2{font-size:18px;margin:0;letter-spacing:-.3px;}
.sech .en{font-family:var(--mono);font-size:10.5px;color:var(--fg-faint);letter-spacing:1px;text-transform:uppercase;}
.sech .sp{flex:1;height:1px;background:var(--border-soft);align-self:center;}

/* why-terminal bullets */
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:4px 0 2px;}
.whyc{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:10px;padding:13px 15px;}
.whyc .h{font-family:var(--mono);font-size:11px;color:var(--accent-bright);letter-spacing:.5px;margin-bottom:6px;display:flex;align-items:center;gap:7px;}
.whyc .h .n{color:var(--fg-faint);}
.whyc p{font-size:12px;color:var(--fg-secondary);line-height:1.55;margin:0;text-wrap:pretty;}
.whyc p b{color:var(--fg-primary);}

/* capability map */
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:2px 0;}
.tbl th{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--fg-muted);text-align:left;padding:9px 13px;border-bottom:1px solid var(--border);}
.tbl td{padding:9px 13px;border-bottom:1px solid var(--border-soft);color:var(--fg-secondary);vertical-align:top;line-height:1.5;}
.tbl tr:hover td{background:var(--bg-base);}
.tbl .cap{color:var(--fg-primary);font-weight:600;}
.tbl .lvl{font-family:var(--mono);font-size:10px;font-weight:700;border-radius:4px;padding:1px 7px;white-space:nowrap;border:1px solid;}
.l-native{color:var(--success);border-color:color-mix(in srgb,var(--success) 40%,transparent);background:color-mix(in srgb,var(--success) 7%,transparent);}
.l-deg{color:var(--gold-bright);border-color:color-mix(in srgb,var(--gold) 40%,transparent);background:color-mix(in srgb,var(--gold) 7%,transparent);}
.l-out{color:var(--accent-bright);border-color:var(--accent-dim);background:color-mix(in srgb,var(--accent) 6%,transparent);}
.tbl code,.inlc{font-family:var(--mono);font-size:12px;color:var(--accent-bright);background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:4px;padding:0 5px;}

/* ───── terminal cockpit ───── */
.term{font-family:var(--mono);background:var(--bg-void);border:1px solid var(--term-edge);border-radius:8px;overflow:hidden;box-shadow:0 26px 64px -30px rgba(0,0,0,.8);}
.term.depth256{
  --bg-void:#080808; --bg-panel:#1c1c1c; --bg-base:#121212; --bg-sel:#005f5f;
  --fg-primary:#d7d7d7; --fg-secondary:#afafaf; --fg-muted:#767676; --fg-faint:#585858;
  --accent:#00afd7; --accent-bright:#5fd7ff; --accent-dim:#005f87;
  --gold:#d7af5f; --gold-bright:#ffd75f; --success:#5fd787; --warning:#d7af00; --error:#d75f5f; --progress:#5fafd7;
  --border:#444444; --border-soft:#303030;
}
.term-chrome{display:flex;align-items:center;gap:9px;height:34px;padding:0 12px;background:var(--term-chrome);border-bottom:1px solid var(--term-edge);}
.term.depth256 .term-chrome{background:var(--term-screen);border-color:#303030;}
.tlt{display:flex;gap:6px;} .tlt i{width:10px;height:10px;border-radius:50%;}
.tnm{font-size:11px;color:var(--fg-muted);margin-left:3px;}
.term-chrome .sp{flex:1;}
/* in-terminal tab line — the app draws this inside the viewport (NOT the host titlebar) */
.tnav{flex:none;display:flex;align-items:center;gap:3px;padding:7px 12px 6px;border-bottom:1px solid var(--border-soft);background:rgba(5,9,15,.5);font-family:var(--mono);font-size:12.5px;white-space:nowrap;overflow:hidden;}
.tnav .tt{display:flex;align-items:center;gap:7px;padding:3px 11px;color:var(--fg-muted);cursor:pointer;}
.tnav .tt:hover{color:var(--fg-secondary);}
.tnav .tt.on{background:var(--accent);color:var(--bg-void);font-weight:700;}
.tnav .tt .sl{color:var(--fg-faint);font-size:11px;}
.tnav .tt.on .sl{color:var(--bg-void);opacity:.65;}
.tnav .tt .bdg{font-size:10px;color:var(--gold-bright);}
.tnav .tt.on .bdg{color:var(--bg-void);}
.tnav .tnavhint{margin-left:auto;color:var(--fg-faint);font-size:11px;}
.tnmhint{font-family:var(--mono);font-size:10px;color:var(--fg-faint);font-style:italic;}

.tscreen{min-height:560px;display:flex;flex-direction:column;}
.statline{flex:none;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--border-soft);background:rgba(5,9,15,.5);white-space:nowrap;overflow:hidden;font-size:12.5px;}
.statline .sp{flex:1;}
.tbody{flex:1;padding:11px 13px;}
.keybar{flex:none;display:flex;align-items:center;gap:15px;padding:8px 14px;border-top:1px solid var(--border-soft);background:rgba(5,9,15,.5);font-size:12px;color:var(--fg-muted);white-space:nowrap;overflow:hidden;flex-wrap:wrap;}
.keybar .sp{flex:1;} .keybar b{color:var(--accent-bright);font-weight:600;}
.keybar .fk{color:var(--fg-faint);}

/* terminal text helpers */
.t-acc{color:var(--accent);}.t-br{color:var(--accent-bright);}.t-gold{color:var(--gold-bright);}.t-gd{color:var(--gold);}
.t-suc{color:var(--success);}.t-warn{color:var(--warning);}.t-err{color:var(--error);}.t-prog{color:var(--progress);}
.t-mut{color:var(--fg-muted);}.t-fnt{color:var(--fg-faint);}.t-sec{color:var(--fg-secondary);}.t-pri{color:var(--fg-primary);}
.bld{font-weight:700;}

/* box-drawing frame */
.tl{display:flex;white-space:pre;font-size:13px;line-height:1.32;}
.bd{color:var(--border);flex:none;}
.tc{flex:1;min-width:0;overflow:hidden;white-space:nowrap;padding:0 1ch;}
.fillc{flex:1;min-width:0;overflow:hidden;white-space:nowrap;color:var(--border);}
.ttl{flex:none;color:var(--fg-primary);font-weight:700;} .ttl .lid{color:var(--accent);}
.ttag{flex:none;}
.tbox.foc>.tl>.bd,.tbox.foc>.tl>.fillc{color:var(--accent);}
.tbox.foc>.tl>.ttl{background:var(--accent);color:var(--bg-void);} .tbox.foc>.tl>.ttl .lid{color:var(--bg-void);}
.tbox.foc.brdonly>.tl>.ttl{background:transparent;color:var(--accent-bright);} .tbox.foc.brdonly>.tl>.ttl .lid{color:var(--accent-bright);}
.tbox.foc.brdonly>.tl>.bd,.tbox.foc.brdonly>.tl>.fillc{color:var(--accent-bright);}

.tboard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1px 16px;}

/* decision center */
.dcgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start;}
.dccol{min-width:0;}
.qrow{display:block;font-size:12.5px;line-height:1.5;padding:1px 0;color:var(--fg-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qrow.rev{background:var(--accent);color:var(--bg-void);} .qrow.rev b{color:var(--bg-void);}
.dchdr{padding:2px 2px 11px;font-size:13.5px;font-weight:700;line-height:1.4;}
.tbox{margin-bottom:9px;}
.difadd{color:var(--success);} .difdel{color:var(--error);}
.vopen{display:flex;align-items:center;gap:11px;background:color-mix(in srgb,var(--gold) 7%,var(--bg-void));border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);border-radius:6px;padding:8px 13px;font-size:12.5px;margin:2px 0 9px;}
.vopen .sp{flex:1;}
.vopenbtn{font-family:var(--mono);font-size:11px;color:var(--gold-bright);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:6px;padding:4px 11px;cursor:pointer;background:transparent;margin-left:auto;white-space:nowrap;}
.vopenbtn:hover{background:color-mix(in srgb,var(--gold) 12%,transparent);}
.dcact{display:flex;align-items:center;gap:10px;font-size:12.5px;}
.kk{font-family:var(--mono);font-weight:700;border:1px solid;border-radius:5px;padding:4px 11px;cursor:pointer;}
.kk.ap{color:var(--success);border-color:color-mix(in srgb,var(--success) 45%,transparent);}
.kk.rj{color:var(--error);border-color:color-mix(in srgb,var(--error) 40%,transparent);}
.kk.rt{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 40%,transparent);}
.curblink{color:var(--accent-bright);animation:blink 1.1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}

/* gallery */
.glwrap{display:flex;flex-direction:column;gap:11px;}
.gltop{display:flex;align-items:center;gap:10px;font-size:12.5px;white-space:nowrap;overflow:hidden;}
.gltop .sp{flex:1;}
.glgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
.gc{border:1px solid var(--border);background:var(--bg-void);overflow:hidden;cursor:pointer;}
.gc.foc{border-color:var(--accent-bright);box-shadow:0 0 0 1px var(--accent-dim);}
.gc.keep{border-color:color-mix(in srgb,var(--success) 50%,transparent);}
.gc.kill{opacity:.42;}
.gctop{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-bottom:1px solid var(--border-soft);color:var(--fg-primary);white-space:nowrap;overflow:hidden;}
.gctop.rev{background:var(--accent-bright);color:var(--bg-void);}
.gctop .gcvd{font-size:9px;}
.gcbody{background:var(--bg-void);} .gcbody svg{display:block;}
.ascii{font-size:10px;line-height:1.05;white-space:pre;padding:7px 8px;color:var(--fg-muted);letter-spacing:1px;}
.ascii .pf{color:var(--fg-secondary);}.ascii .en{color:var(--error);}.ascii .st{color:var(--success);}.ascii .ex{color:var(--gold-bright);}
.gcstat{font-family:var(--mono);font-size:9.5px;padding:4px 8px;border-top:1px solid var(--border-soft);white-space:nowrap;overflow:hidden;}
.glfoot{display:flex;align-items:center;gap:12px;padding-top:10px;border-top:1px solid var(--border-soft);font-size:11.5px;}
.glfoot .sp{flex:1;}
.glsub{font-family:var(--mono);font-size:12px;font-weight:700;color:#06222b;background:var(--accent);border-radius:6px;padding:6px 13px;white-space:nowrap;}
.glsub.dis{background:transparent;color:var(--fg-muted);border:1px solid var(--border);}

/* browser overlay */
.ovl{position:fixed;inset:0;background:rgba(3,6,11,.76);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:30px;}
.browser{width:min(720px,92%);background:#0e1620;border:1px solid var(--border);border-radius:11px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);}
.bchrome{display:flex;align-items:center;gap:9px;height:36px;padding:0 12px;background:var(--bg-void);border-bottom:1px solid var(--border);}
.bdots{display:flex;gap:6px;} .bdots i{width:10px;height:10px;border-radius:50%;}
.burl{flex:1;background:var(--bg-base);border:1px solid var(--border);border-radius:6px;padding:3px 11px;color:var(--fg-muted);font-family:var(--mono);font-size:11px;}
.bx{color:var(--fg-muted);cursor:pointer;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:5px;}
.bx:hover{color:var(--fg-primary);background:var(--bg-base);}
.bbody{padding:17px 19px 19px;}
.bbt{font-size:14.5px;font-weight:700;font-family:var(--sans);display:flex;align-items:center;gap:9px;}
.bbt .t-gold{font-family:var(--mono);font-size:12px;}
.player{margin-top:12px;aspect-ratio:16/9;background:radial-gradient(120% 100% at 50% 30%,#16283a,#070d14 75%);border:1px solid var(--border);border-radius:8px;position:relative;overflow:hidden;display:grid;place-items:center;}
.pply{width:52px;height:52px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,transparent);border:1.5px solid var(--accent);display:grid;place-items:center;color:var(--accent-bright);}
.pscrub{position:absolute;left:0;right:0;bottom:0;height:32px;background:linear-gradient(transparent,rgba(5,9,15,.7));display:flex;align-items:center;gap:9px;padding:0 13px;font-family:var(--mono);font-size:10.5px;color:var(--fg-secondary);}
.pscrub .pbar{flex:1;height:3px;background:rgba(255,255,255,.12);border-radius:2px;position:relative;}
.pscrub .pbar i{position:absolute;left:0;top:0;bottom:0;width:34%;background:var(--accent);border-radius:2px;}
.pab{position:absolute;top:10px;left:12px;font-family:var(--mono);font-size:10px;color:var(--accent-bright);background:rgba(5,9,15,.6);border:1px solid var(--accent-dim);border-radius:4px;padding:1px 7px;}

/* phasing + screens map */
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.phc{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:11px;padding:14px 16px;}
.phc .h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:9px;}
.phc .h .dot{width:8px;height:8px;border-radius:50%;flex:none;}
.phc .h .en{font-family:var(--mono);font-size:9.5px;color:var(--fg-faint);margin-left:auto;font-weight:400;letter-spacing:.5px;}
.phc ul{margin:0;padding-left:17px;font-size:12px;color:var(--fg-secondary);line-height:1.75;}
.phc li b{color:var(--fg-primary);font-weight:600;}
.phc .scr{font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);border-top:1px dashed var(--border-soft);margin-top:10px;padding-top:8px;line-height:1.7;}
.phc .scr b{color:var(--accent);}

.links{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px;}
.lk{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--fg-secondary);background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:8px;padding:8px 13px;text-decoration:none;}
.lk:hover{border-color:var(--accent-dim);color:var(--fg-primary);}
.lk .ar{color:var(--accent);}
.lk .d{width:7px;height:7px;border-radius:2px;flex:none;}
.note{font-family:var(--mono);font-size:11px;color:var(--fg-faint);margin-top:10px;line-height:1.7;}
.note .a{color:var(--accent);}
.divnote{font-size:13.5px;color:var(--fg-secondary);line-height:1.7;background:var(--bg-panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:13px 17px;margin:6px 0 2px;text-wrap:pretty;}
.divnote b{color:var(--fg-primary);} .divnote .c{color:var(--accent-bright);font-family:var(--mono);font-size:12.5px;}
/* session · 会话主窗口 */
.sess{display:flex;flex-direction:column;height:100%;min-height:500px;font-size:13px;}
.sessctx{display:flex;gap:9px;align-items:center;padding:1px 2px 9px;border-bottom:1px solid var(--border-soft);white-space:nowrap;overflow:hidden;font-size:11.5px;margin-bottom:10px;}
.sessctx .sp{flex:1;}
.sesslog{flex:1;overflow:auto;padding-right:4px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.umsg{display:flex;gap:9px;align-items:baseline;background:var(--bg-base);border-left:2px solid var(--accent-dim);border-radius:0 6px 6px 0;padding:6px 11px;}
.term.depth256 .umsg{background:#121212;}
.umsg .p{color:var(--accent-bright);font-weight:700;flex:none;}
.umsg .x{color:var(--fg-primary);line-height:1.5;}
.amsg{display:flex;flex-direction:column;gap:6px;}
.ahdr{color:var(--gold-bright);font-weight:700;display:flex;align-items:center;gap:8px;}
.ahdr .m{color:var(--fg-faint);font-weight:400;font-size:11px;}
.athink{color:var(--fg-faint);line-height:1.5;}
.atext{color:var(--fg-secondary);line-height:1.55;}
.atext b{color:var(--fg-primary);}
.tool{border-left:2px solid var(--border);padding:2px 0 2px 11px;margin-left:1px;display:flex;flex-direction:column;gap:2px;}
.tool .th{color:var(--fg-muted);} .tool .th .g{color:var(--accent);font-weight:700;}
.tool .to{color:var(--fg-secondary);white-space:pre;overflow:hidden;text-overflow:ellipsis;}
.tool .add{color:var(--success);} .tool .del{color:var(--error);}
.tool .ok{color:var(--success);} .tool .wn{color:var(--warning);}
.gatemsg{border:1px solid color-mix(in srgb,var(--gold) 32%,transparent);background:color-mix(in srgb,var(--gold) 8%,var(--bg-void));border-radius:6px;padding:7px 12px;color:var(--gold-bright);line-height:1.55;}
.gatemsg b{color:var(--gold-bright);font-weight:700;} .gatemsg .lk{color:var(--accent-bright);}
.composer{flex:none;border-top:1px solid var(--border-soft);padding-top:10px;margin-top:10px;position:relative;}
.cline{display:flex;align-items:center;gap:9px;background:var(--bg-base);border:1px solid var(--border);border-radius:7px;padding:8px 11px;}
.cline:focus-within{border-color:var(--accent-dim);}
.term.depth256 .cline{background:#121212;}
.cprompt{color:var(--accent-bright);font-weight:700;flex:none;}
.cin{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--fg-primary);font-family:var(--mono);font-size:13px;}
.cin::placeholder{color:var(--fg-faint);}
.cmodes{display:flex;gap:6px;flex:none;}
.cm{font-size:10px;color:var(--fg-muted);border:1px solid var(--border);border-radius:11px;padding:1px 8px;white-space:nowrap;}
.chint{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--fg-muted);padding:6px 2px 0;white-space:nowrap;overflow:hidden;}
.chint .sp{flex:1;}
.palette{position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:var(--bg-panel);border:1px solid var(--accent-dim);border-radius:8px;overflow:hidden;box-shadow:0 -14px 36px -18px rgba(0,0,0,.75);z-index:4;}
.pcmd{display:flex;align-items:center;gap:12px;padding:7px 13px;cursor:pointer;font-size:12.5px;}
.pcmd.on{background:var(--bg-sel);}
.pcmd .pc{color:var(--accent-bright);font-weight:700;width:92px;flex:none;}
.pcmd .pd{color:var(--fg-secondary);}
.pcmd .pg{margin-left:auto;color:var(--accent);font-size:11px;white-space:nowrap;}
@media(max-width:900px){.why,.ph,.tboard,.glgrid{grid-template-columns:1fr 1fr;}.dcgrid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="pwrap">
  <div id="root"></div>
</div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="tui-screens.jsx"></script>
<script type="text/babel">
const {useState,useEffect} = React;
const t = window.t || ((en,zh)=>en);

const SCREENS=[{k:'session',nm:t('Session','会话'),bdg:t('main','主')},{k:'board',nm:'Lanes',bdg:null},{k:'review',nm:t('Decisions','决策'),bdg:t('3','3')},{k:'gallery',nm:t('Gallery','画廊'),bdg:null}];

const WHY=[
  {n:'01',h:t('Agents are already CLIs','agent 本就是 CLI'),p:t('codex / claude-code are command-line agents; Viden grows right beside them rather than cramming them into a GUI.','codex / claude-code 是命令行 agent;Viden 长在它们旁边,而不是把它们塞进 GUI。')},
  {n:'02',h:t('Targets are already over SSH','目标本就 SSH 连'),p:t('Robot control boards and GPU hosts are all logged into remotely. Opening the cockpit inside the terminal is a <b>shortcut</b> — no graphics stack to boot first.','机器人主控板、GPU 主机都是远程登进去的。终端里开驾驶舱是<b>降维打击</b>,不用先起图形栈。')},
  {n:'03',h:t('Runs on the board','跑得进板子'),p:t('RoboCode is Rust — light enough to run on an ARM control board directly; the TUI opens natively on the on-site device.','RoboCode 是 Rust,轻到能直接上 ARM 主控板;TUI 在现场设备本机就能开。')},
  {n:'04',h:t('Scriptable','可脚本化'),p:t('<b>viden run …</b> into CI and cron — the foundation for nightly autopilot and batch gates.','<b>viden run …</b> 进 CI、进 cron —— 夜间自动驾驶、批量闸的底座。')},
];

const CAPS=[
  [t('Lane add/remove · status · board','Lane 增删 / 状态 / board'),'native',t('Card wall = box-drawing frames · status lights / spinner / spark all text','卡片墙 = box-drawing 框 · 状态灯 / spinner / spark 全文本')],
  [t('Session multi-open · state machine','Session 多开 · 状态机'),'native',t('tab / split pane · run/wait/gate/done single-line badges','tab / 分屏 pane · run/wait/gate/done 单行徽标')],
  [t('ACP agents · worktree / branch','ACP 接 agent · worktree / 分支'),'native',t('Already CLI + git semantics','本就是 CLI 与 git 语义')],
  [t('SSH target (D9)','SSH target(D9)'),'native',t('Already in the terminal — smoother than GUI, reconnect-resume is native','已在终端里 —— 比 GUI 还顺,断线续会话天然')],
  [t('Four primitives · gate approve/reject/return + reason','四原语 · 闸批/驳/退 + 理由'),'native',t('List + prompt flow; keyboard flow is smoothest, reason written to gate log','列表 + 提示流;键盘流最顺,理由落盘闸日志')],
  [t('viden.toml policy · Decision Center queue','viden.toml 策略 · 决策中心队列'),'native',t('Policy as file; gate / ask / contract in one list','策略即文件;闸/问询/契约同列表')],
  [t('Code diff · contract (MD) diff','代码 diff · 契约(MD)diff'),'native',t('What terminals do best','终端最擅长')],
  [t('Deterministic replay + assertions (Q3)','确定性回放 + 断言(Q3)'),'native',t('Input sequence + pass/fail, git-friendly and terminal-readable','输入序列 + pass/fail,git 友好、终端可读')],
  [t('Gallery review keep / kill','画廊评审 keep / kill'),'native',t('Keyboard flow K/X fits naturally; thumbnails via graphics protocol','键盘流 K/X 天生适配;缩略图走图形协议')],
  [t('Telemetry / loss / behavior curves','遥测 / loss / 行为曲线'),'deg',t('Braille sparkline for trend ("diverging?"); reading detail handed to GUI','braille sparkline 看趋势("发散没");读数细节交 GUI')],
  [t('Gallery minimap · golden frames','画廊小地图 · 金样画面'),'deg',t('kitty/sixel inline images; old terminals / low bandwidth degrade to ASCII','kitty/sixel 内联图;老终端 / 低带宽降级 ASCII')],
  [t('Inbox / briefing / memo ack (D7·D8)','收件箱 / 简报 / memo ack(D7·D8)'),'native',t('All text — near-zero loss in the TUI','全是文本,TUI 几乎零损耗')],
  [t('Playtest replay video · pixel-diff detail','试玩回放录像 · 像素 diff 细节'),'out',t('viden open launches browser/GUI · decision writes back to terminal queue','viden open 弹浏览器/GUI · 决策回写终端队列')],
];
const LVL={native:['native ✓','l-native'],deg:[t('◑ degraded','◑ 降级'),'l-deg'],out:[t('↗ to GUI','↗ 交 GUI'),'l-out']};

function App(){
  const [tw,setTweak]=useTweaks(/*EDITMODE-BEGIN*/{
    "depth": "256 色",
    "graphics": true,
    "corners": "圆角 ╭╮",
    "focus": "反色 reverse-video"
  }/*EDITMODE-END*/);
  const [screen,setScreen]=useState('session');
  const [foc,setFoc]=useState(1);
  const [spin,setSpin]=useState(0);
  const [qsel,setQsel]=useState('q2');
  const [glCur,setGlCur]=useState(0);
  const [verdict,setVerdict]=useState({3:'kill',6:'kill'});
  const [submitted,setSubmitted]=useState(false);
  const [browser,setBrowser]=useState(false);

  const corners=tw.corners.startsWith('圆角')?['╭','╮','╰','╯']:['┌','┐','└','┘'];
  const brdOnly=tw.focus.startsWith('亮边框');
  const is256=tw.depth==='256 色';

  useEffect(()=>{const id=setInterval(()=>setSpin(s=>(s+1)%SPIN.length),90);return()=>clearInterval(id);},[]);
  useEffect(()=>{
    const h=(e)=>{
      if(browser){if(e.key==='Escape')setBrowser(false);return;}
      if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')){return;}
      if(e.key==='1'){setScreen('session');return;} if(e.key==='2'){setScreen('board');return;} if(e.key==='3'){setScreen('review');return;} if(e.key==='4'){setScreen('gallery');return;}
      if(screen==='board'){
        if(e.key==='ArrowRight'){setFoc(f=>Math.min(LANES.length-1,f+1));e.preventDefault();}
        if(e.key==='ArrowLeft'){setFoc(f=>Math.max(0,f-1));e.preventDefault();}
        if(e.key==='ArrowDown'){setFoc(f=>Math.min(LANES.length-1,f+2));e.preventDefault();}
        if(e.key==='ArrowUp'){setFoc(f=>Math.max(0,f-2));e.preventDefault();}
      } else if(screen==='review'){
        const qi=QUEUE.findIndex(q=>q.id===qsel);
        if((e.key==='j'||e.key==='ArrowDown')&&qi<QUEUE.length-1){setQsel(QUEUE[qi+1].id);e.preventDefault();}
        if((e.key==='k'||e.key==='ArrowUp')&&qi>0){setQsel(QUEUE[qi-1].id);e.preventDefault();}
        if(e.key==='o'||e.key==='O')setBrowser(true);
      } else if(screen==='gallery'){
        if(e.key==='ArrowRight'){setGlCur(c=>Math.min(VARIANTS.length-1,c+1));e.preventDefault();}
        if(e.key==='ArrowLeft'){setGlCur(c=>Math.max(0,c-1));e.preventDefault();}
        if(e.key==='ArrowDown'){setGlCur(c=>Math.min(VARIANTS.length-1,c+4));e.preventDefault();}
        if(e.key==='ArrowUp'){setGlCur(c=>Math.max(0,c-4));e.preventDefault();}
        if(e.key==='k'||e.key==='K'){setVerdict(p=>({...p,[VARIANTS[glCur].id]:'keep'}));setGlCur(c=>Math.min(VARIANTS.length-1,c+1));}
        if(e.key==='x'||e.key==='X'){setVerdict(p=>({...p,[VARIANTS[glCur].id]:'kill'}));setGlCur(c=>Math.min(VARIANTS.length-1,c+1));}
        if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){const nP=20-Object.values(verdict).filter(v=>v).length;if(nP<=0)setSubmitted(true);}
      }
    };
    window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
  },[screen,foc,qsel,glCur,verdict,browser]);

  return (
    <React.Fragment>
      <div className="pkicker">viden · TUI track · {t('design overview','设计总览')}</div>
      <h1 className="ph1">{t('The whole TUI design','TUI 整套设计')} <span className="ac">terminal-first cockpit</span></h1>
      <p className="plead">{t('Collect the scattered TUI work onto one page: ','把分散的 TUI 工作收成一页:')}<b>{t('why the terminal is home → capability map → three operable cockpit screens → division & phasing','为什么终端是主场 → 能力地图 → 可操作的驾驶舱三屏 → 分工与分期')}</b>{t('. The cockpit below renders on a ','。下方驾驶舱按')}<b>{t('real-terminal fidelity baseline','真终端保真基线')}</b>{t(' (box-drawing frames · reverse-video selection · monospace grid · keyboard-first); rationale in the ','统一渲染(box-drawing 框 · 反色选中 · 等宽栅格 · 键盘优先),依据见 ')}<span className="c">{t('fidelity comparison','保真对比')}</span>{t('. Press ',' 稿。按 ')}<b>1/2/3</b>{t(' or click a tab to switch; each screen is keyboard-operable, and Tweaks (top-right) toggles color depth / graphics protocol.',' 或点 tab 切屏;每屏可键盘操作,右上 Tweaks 可切色深 / 图形协议。')}</p>

      {/* WHY */}
      <div className="sech"><span className="no">01</span><h2>{t('Why the terminal is home','为什么终端是主场')}</h2><span className="en">terminal-first, not a lesser GUI</span><span className="sp"></span></div>
      <div className="why">
        {WHY.map(w=>(
          <div key={w.n} className="whyc"><div className="h"><span className="n">{w.n}</span>{w.h}</div><p dangerouslySetInnerHTML={{__html:w.p}}></p></div>
        ))}
      </div>

      {/* CAPABILITY MAP */}
      <div className="sech"><span className="no">02</span><h2>{t('Capability map','能力地图')}</h2><span className="en">native ✓ · degraded ◑ · hands off ↗</span><span className="sp"></span></div>
      <table className="tbl">
        <thead><tr><th style={{width:'28%'}}>{t('Capability','能力')}</th><th style={{width:'14%'}}>{t('Terminal layer','终端层')}</th><th>{t('Approach','做法')}</th></tr></thead>
        <tbody>
          {CAPS.map((c,i)=>(
            <tr key={i}><td className="cap">{c[0]}</td><td><span className={"lvl "+LVL[c[1]][1]}>{LVL[c[1]][0]}</span></td><td>{c[2]}</td></tr>
          ))}
        </tbody>
      </table>
      <div className="note"><span className="a">{t('Key challenge','关键难题')}</span>{t(': the product\u2019s soul is reviewing visual evidence, but the terminal is text → three progressive render tiers: ① text-native (diff / input sequence / ASCII) ② kitty·sixel inline images (minimap / golden frame / curves) ③ ',':产品灵魂是评审视觉证据,终端是文本的 → 三档渐进渲染:① 文本原生(diff / 输入序列 / ASCII)② kitty·sixel 内联图(小地图 / 金样 / 曲线)③ ')}<span className="a">viden open</span>{t(' launches a browser to watch the recording. The cockpit on this page demos all three tiers.',' 弹浏览器看录像。本页驾驶舱把三档都演示了。')}</div>

      {/* COCKPIT */}
      <div className="sech"><span className="no">03</span><h2>{t('Cockpit · four operable screens · main window = session','驾驶舱 · 四屏可操作 · 主窗口 = 会话')}</h2><span className="en">box-drawing · reverse-video · keyboard-first</span><span className="sp"></span></div>
      <div className={"term "+(is256?'depth256':'')}>
        <div className="term-chrome">
          <div className="tlt"><i style={{background:'#e0564f'}}></i><i style={{background:'#e6b53f'}}></i><i style={{background:'#54c06a'}}></i></div>
          <span className="tnm">viden — fish — 142×40</span>
          <span className="sp"></span>
          <span className="tnmhint">{t("host terminal — we don't own this bar",'宿主终端 —— 这条不归我们')}</span>
        </div>
        <div className="tscreen">
          <div className="tnav">
            {SCREENS.map((s,i)=>(
              <span key={s.k} className={"tt "+(screen===s.k?'on':'')} onClick={()=>setScreen(s.k)}><span className="sl">{i+1}</span>{s.nm}{s.bdg&&<span className="bdg">{s.bdg}</span>}</span>
            ))}
            <span className="tnavhint">{t('1–4 switch screen','1–4 切屏')}</span>
          </div>
          <div className="statline">
            <span><span className="t-acc">[</span><span className="t-br">◉</span><span className="t-acc">]</span> <span className="t-gold">v</span><span className="t-acc">iden</span> <span className="t-mut">~/projects/</span><span className="bld t-pri">boss-rush</span><span className="t-acc">:main</span></span>
            <span className="sp"></span>
            <span className="t-gold">{t('⏸ 3 to review','⏸ 3 待批')}</span> <span className="t-prog">{SPIN[spin]} L3 run</span> <span className="t-suc">● local · godot 4.3</span> <span className="t-fnt">{is256?'· xterm-256':'· truecolor'}</span>
          </div>
          <div className="tbody">
            {screen==='session' && <Session onCommand={setScreen}/>}
            {screen==='board' && <Board foc={foc} corners={corners} brdOnly={brdOnly} spin={SPIN[spin]}/>}
            {screen==='review' && <DecisionCenter sel={qsel} setSel={setQsel} corners={corners} brdOnly={brdOnly} openBrowser={()=>setBrowser(true)}/>}
            {screen==='gallery' && <Gallery gfx={t.graphics} cur={glCur} setCur={setGlCur} verdict={verdict} submitted={submitted}/>}
          </div>
          <div className="keybar">
            {screen==='session' && <><span className="fk">[↵]</span><b>{t('send','发送')}</b><span className="fk">[/]</span><b>{t('command palette','命令面板')}</b><span className="fk">[⌃C]</span>{t('interrupt agent','打断 agent')}<span className="fk">[⌃R]</span>{t('session history','会话历史')}<span className="fk">[⇥]</span>{t('complete','补全')}</>}
            {screen==='board' && <><span className="fk">[↑↓←→]</span><b>{t('select lane','选 lane')}</b><span className="fk">[↵]</span><b>{t('open gate / follow','打开闸 / 跟车')}</b><span className="fk">[n]</span>{t('new lane','新 lane')}<span className="fk">[/]</span>{t('command','命令')}</>}
            {screen==='review' && <><span className="fk">[j/k]</span><b>{t('queue up/down','队列上下')}</b><span className="fk">[a]</span><b className="t-suc">{t('approve','批准')}</b><span className="fk">[r]</span><b className="t-err">{t('reject','驳回')}</b><span className="fk">[b]</span><b className="t-warn">{t('return','退回')}</b><span className="fk">[o]</span>viden open ↗</>}
            {screen==='gallery' && <><span className="fk">[←→↑↓]</span><b>{t('move','移动')}</b><span className="fk">[k]</span><b className="t-suc">keep</b><span className="fk">[x]</span><b className="t-err">kill</b><span className="fk">[⌘↵]</span>{t('submit gate','提交闸')}</>}
            <span className="sp"></span>
            <span className="fk">[1/2/3/4] {t('switch screen · daemon resident · reverse = selected','切屏 · daemon 常驻 · 反色 = 选中态')}</span>
          </div>
        </div>
      </div>
      <div className="note">{t('The main window is ','主窗口是 ')}<span className="a">{t('the session','会话')}</span>{t(' — you work with the agent inside one lane, editing files / running replay validation streamed in place; ',' —— 你在一条 lane 里跟 agent 干活,改文件 / 跑回放验证就地流式;')}<span className="a">{t('inline gate prompts','闸提示内联')}</span>{t(' (touching a managed path auto-forms a gate) and ','(触及受管路径自动成闸)、')}<span className="a">{t('/ commands','/ 命令')}</span>{t(' for cross-screen jumps are what set Viden apart from a plain agent CLI. Three screens share one dataset (Boss Rush «Counter Trial») · opening L2/L4 gates from the board enters Decision Center / Gallery · all rendered at real-terminal fidelity — consistent with ','跨屏跳转,是 Viden 区别于普通 agent CLI 的地方。三屏同源数据(Boss Rush《反击试炼》)· board 打开 L2/L4 的闸即进决策中心 / 画廊 · 全部按真终端保真渲染 —— 与 ')}<a href="Viden - T5 真终端保真对比 (TUI).html" style={{color:'var(--accent)'}}>{t('fidelity comparison','保真对比')}</a>{t(' consistent.',' 一致。')}</div>

      {/* PHASING */}
      <div className="sech"><span className="no">04</span><h2>{t('Phasing · aligned with M0/M1/M1.5','分期 · 与 M0/M1/M1.5 对齐')}</h2><span className="en">terminal track ships alongside desktop</span><span className="sp"></span></div>
      <div className="ph">
        <div className="phc">
          <div className="h"><span className="dot" style={{background:'var(--accent)'}}></span>M0 · {t('TUI is v0','TUI 即 v0')}<span className="en">{t('pure text, usable','纯文本即可用')}</span></div>
          <ul><li>welcome → <b>lane board</b> → {t('delegate / status','委派 / 状态')}</li><li><b>{t('Decision Center text mode','决策中心文本档')}</b>{t(': queue + code diff + gate approve/reject + reason to disk',':队列 + 代码 diff + 闸批驳 + 理由落盘')}</li><li>{t('No graphics dependency at all — the minimal usable TUI','完全不依赖图形,是 TUI 最小可用')}</li></ul>
          <div className="scr">{t('Screens:','屏:')}<b>Lane board</b> · <b>{t('Decision Center','决策中心')}</b></div>
        </div>
        <div className="phc">
          <div className="h"><span className="dot" style={{background:'var(--success)'}}></span>M1 · {t('game-package loop','游戏包闭环')}<span className="en">{t('graphics protocol enters','图形协议进场')}</span></div>
          <ul><li><b>{t('Gallery review','画廊评审')}</b>{t(' keyboard flow + input-sequence replay evidence',' 键盘流 + 输入序列回放证据')}</li><li><b>kitty/sixel</b>{t(' inline minimap / curves (old terminals degrade)',' 内联小地图 / 曲线(老终端降级)')}</li><li><b>viden open</b>{t(' browser handoff · SSH target full feature',' 浏览器交接 · SSH target 全功能')}</li></ul>
          <div className="scr">{t('Screens:','屏:')}<b>{t('Gallery review','画廊评审')}</b> · <b>{t('browser handoff','浏览器交接')}</b></div>
        </div>
        <div className="phc">
          <div className="h"><span className="dot" style={{background:'var(--gold)'}}></span>M1.5 · {t('Team','团队')}<span className="en">{t('near-zero loss','几乎零损耗')}</span></div>
          <ul><li>{t('Inbox / claim / handoff — all text','收件箱 / 认领 / 移交 —— 全是文本')}</li><li>scribe {t('briefing + dual-channel notice + memo ack','简报 + 双通道通告 + memo ack')}</li><li>{t('Nightly autopilot via','夜间自动驾驶走')} <b>viden run</b> + cron</li></ul>
          <div className="scr">{t('Screens:','屏:')}<b>{t('Inbox','收件箱')}</b> · <b>{t('Briefing','简报')}</b>{t(' (D7·D8 text fits naturally)','(D7·D8 文本天然适配)')}</div>
        </div>
      </div>

      <div className="divnote"><b>{t('Division in one line','一句话分工')}</b>{t(': ','：')}<span className="c">{t('TUI does the work + decides, GUI views rich evidence','TUI 干活 + 拍板,GUI 看富证据')}</span>{t('. Both tracks run in parallel, sharing one ','。两轨并行、共享同一份 ')}<span className="c">docs/evidence/</span>{t(' and viden.toml; the terminal decides, the browser inspects. This page is the TUI-track overview; boundary rationale in the fidelity comparison.',' 与 viden.toml;终端做决策,浏览器做细看。本页是 TUI 轨的总览,沟通边界依据见保真对比稿。')}</div>

      {/* LINKS */}
      <div className="sech"><span className="no">05</span><h2>{t('Related docs','相关稿件')}</h2><span className="en">the set</span><span className="sp"></span></div>
      <div className="links">
        <a className="lk" href="Viden - T5 真终端保真对比 (TUI).html"><span className="d" style={{background:'var(--accent)'}}></span>{t('TUI fidelity comparison','TUI 保真对比')} <span className="ar">↗</span></a>
        <a className="lk" href="../Core/Viden - Logo & TUI 品牌 (Core).html"><span className="d" style={{background:'var(--gold)'}}></span>{t('Logo & TUI brand','Logo & TUI 品牌')} <span className="ar">↗</span></a>
        <a className="lk" href="../GUI/Viden - D2 决策中心 (GUI).html"><span className="d" style={{background:'var(--accent)'}}></span>{t('D2 Decision Center (GUI)','D2 决策中心(GUI)')}<span className="ar">↗</span></a>
        <a className="lk" href="../GUI/Viden - D5 画廊评审 (GUI).html"><span className="d" style={{background:'var(--success)'}}></span>{t('D5 Gallery review (GUI)','D5 画廊评审(GUI)')}<span className="ar">↗</span></a>
        <a className="lk" href="../GUI/Viden - D9 远程目标开发 (GUI).html"><span className="d" style={{background:'var(--progress)'}}></span>{t('D9 remote target','D9 远程 target')} <span className="ar">↗</span></a>
        <a className="lk" href="../Core/Viden - 产品方案 v2 (Core).html"><span className="d" style={{background:'var(--fg-muted)'}}></span>{t('Product plan v2','产品方案 v2')} <span className="ar">↗</span></a>
      </div>
      <div className="note">{t('Note: the earlier \u201ccockpit concept\u201d file has been merged into this overview (the three screens rebuilt here on the real-terminal fidelity baseline). ','注:此前的「驾驶舱概念稿」文件已合并进本总览(三屏在此重建为真终端保真基线)。')}<span className="a">{t('TUI track','TUI 轨')}</span>{t(' is recommended to be numbered into the product-plan screen list as a line parallel to desktop D1.',' 建议作为与桌面 D1 并行的一条线编号进产品方案界面清单。')}</div>

      {browser && <BrowserOverlay close={()=>setBrowser(false)}/>}

      <TweaksPanel>
        <TweakSection label={t('Real-implementation choices (toggle to see)','真实现选择(切了看效果)')} />
        <TweakRadio label={t('Color depth','色深')} value={tw.depth} options={["truecolor",{value:"256 色",label:t('256-color','256 色')}]} onChange={v=>setTweak('depth',v)} />
        <TweakToggle label={t('kitty/sixel inline images (gallery)','kitty/sixel 内联图(画廊)')} value={tw.graphics} onChange={v=>setTweak('graphics',v)} />
        <TweakRadio label={t('Border chars','边框字符')} value={tw.corners} options={[{value:"圆角 ╭╮",label:t('round ╭╮','圆角 ╭╮')},{value:"直角 ┌┐",label:t('square ┌┐','直角 ┌┐')}]} onChange={v=>setTweak('corners',v)} />
        <TweakRadio label={t('Selection style','选中态')} value={tw.focus} options={[{value:"反色 reverse-video",label:t('reverse-video','反色 reverse-video')},{value:"亮边框 only",label:t('bright border only','亮边框 only')}]} onChange={v=>setTweak('focus',v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
