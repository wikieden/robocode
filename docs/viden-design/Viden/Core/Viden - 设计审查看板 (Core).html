<!DOCTYPE html>
<html lang="en" data-mode="dark" data-skin="aurora">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viden · Design Review Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<script src="../i18n.js"></script>
<script src="../chrome.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
/* Token 单一真源 → ../tokens.css;本页只用 var(--*)。默认 :root = dark 皮肤。 */
*{box-sizing:border-box;}
body{margin:0;background:var(--page-bg);color:var(--fg-primary);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
.pwrap{max-width:1500px;margin:0 auto;padding:26px 26px 90px;}
.pkicker{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.pkicker::before{content:"";width:24px;height:2px;background:var(--accent);}
.ph1{font-size:28px;margin:0 0 8px;letter-spacing:-.6px;} .ph1 .ac{color:var(--accent);}
.plead{font-size:13.5px;color:var(--fg-secondary);margin:0 0 18px;max-width:1000px;line-height:1.65;text-wrap:pretty;} .plead b{color:var(--fg-primary);font-weight:600;}

/* summary bar */
.sumbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.stat{display:flex;align-items:center;gap:9px;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:10px;padding:9px 15px;}
.stat .big{font-family:var(--mono);font-size:20px;font-weight:800;line-height:1;}
.stat .lab{font-size:11px;color:var(--fg-muted);line-height:1.3;}
.stat.open .big{color:var(--fg-secondary);} .stat.doing .big{color:var(--progress);} .stat.done .big{color:var(--success);} .stat.crit .big{color:var(--error);}
.prog{flex:1;min-width:160px;height:8px;border-radius:5px;background:var(--bg-panel);border:1px solid var(--border-soft);overflow:hidden;display:flex;}
.prog i{height:100%;display:block;} .prog .pd{background:var(--success);} .prog .pp{background:var(--progress);}
.sumbar .reset{font-family:var(--mono);font-size:11px;color:var(--fg-faint);border:1px solid var(--border);border-radius:7px;padding:7px 12px;cursor:pointer;}
.sumbar .reset:hover{color:var(--fg-secondary);border-color:var(--fg-muted);}

/* filters */
.filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
.fchip{font-family:var(--mono);font-size:11px;color:var(--fg-muted);border:1px solid var(--border-soft);border-radius:14px;padding:4px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.fchip:hover{color:var(--fg-secondary);} .fchip.on{color:var(--accent-bright);background:var(--bg-sel);border-color:var(--accent-dim);}
.fchip .d{width:7px;height:7px;border-radius:50%;}
.filters .lab{font-family:var(--mono);font-size:10px;color:var(--fg-faint);text-transform:uppercase;letter-spacing:1px;margin-right:3px;}

/* board */
.board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:start;}
.col{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:13px;overflow:hidden;}
.colh{display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--border-soft);background:var(--bg-void);position:sticky;top:0;z-index:2;}
.colh .dot{width:9px;height:9px;border-radius:50%;flex:none;} .colh.open .dot{background:var(--fg-muted);} .colh.doing .dot{background:var(--progress);} .colh.done .dot{background:var(--success);}
.colh .t{font-size:14px;font-weight:700;} .colh .n{font-family:var(--mono);font-size:11px;color:var(--fg-muted);margin-left:auto;border:1px solid var(--border);border-radius:9px;padding:1px 9px;}
.colbody{padding:11px;display:flex;flex-direction:column;gap:9px;min-height:80px;}
.colbody.empty::after{content:attr(data-empty);display:block;text-align:center;color:var(--fg-faint);font-family:var(--mono);font-size:11px;padding:18px 0;}

/* card */
.card{background:var(--bg-void);border:1px solid var(--border-soft);border-radius:10px;padding:11px 12px;border-left:3px solid var(--border);cursor:default;}
.card.sev-high{border-left-color:var(--error);} .card.sev-mid{border-left-color:var(--gold);} .card.sev-low{border-left-color:var(--fg-muted);}
.card .r1{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.card .id{font-family:var(--mono);font-size:10px;font-weight:800;color:var(--accent);background:var(--bg-sel);border-radius:5px;padding:1px 7px;}
.card .cat{font-family:var(--mono);font-size:9px;color:var(--fg-faint);border:1px solid var(--border);border-radius:4px;padding:1px 6px;}
.card .sev{font-family:var(--mono);font-size:8.5px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:auto;border:1px solid;}
.sev.high{color:var(--error);border-color:color-mix(in srgb,var(--error) 45%,transparent);background:color-mix(in srgb,var(--error) 8%,transparent);}
.sev.mid{color:var(--gold-bright);border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:color-mix(in srgb,var(--gold) 7%,transparent);}
.sev.low{color:var(--fg-muted);border-color:var(--border);}
.card .tt{font-size:13px;font-weight:700;color:var(--fg-primary);line-height:1.4;}
.card .ds{font-size:11.5px;color:var(--fg-muted);line-height:1.5;margin-top:5px;text-wrap:pretty;}
.card .ds b{color:var(--fg-secondary);font-weight:600;}
.card .act{font-size:11.5px;color:var(--fg-secondary);line-height:1.5;margin-top:7px;padding-top:7px;border-top:1px dashed var(--border-soft);}
.card .act .k{color:var(--accent-bright);font-family:var(--mono);font-size:10px;font-weight:700;}
.card .meta{display:flex;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap;}
.card .where{font-family:var(--mono);font-size:9.5px;color:var(--fg-faint);}
.card .where b{color:var(--accent);}
.card .btns{display:flex;gap:5px;margin-left:auto;}
.cbtn{font-family:var(--mono);font-size:10px;border:1px solid var(--border);border-radius:5px;padding:2px 8px;cursor:pointer;color:var(--fg-muted);background:transparent;}
.cbtn:hover{color:var(--fg-primary);border-color:var(--fg-muted);}
.cbtn.fwd:hover{color:var(--success);border-color:color-mix(in srgb,var(--success) 45%,transparent);}
.cbtn.back:hover{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 45%,transparent);}
.card.is-done .tt{color:var(--fg-muted);text-decoration:line-through;text-decoration-color:var(--fg-faint);}
.card.is-done{opacity:.72;}

.note{font-family:var(--mono);font-size:11px;color:var(--fg-faint);margin-top:18px;line-height:1.7;text-align:center;}
.note .a{color:var(--accent);}
@media(max-width:1080px){.board{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="pwrap"><div id="root"></div></div>
<script type="text/babel">
const {useState,useEffect} = React;
const t = window.t || ((en,zh)=>en);
const LS='viden-review-board-v1';

// id, cat(A-E), sev(high/mid/low), title, desc, action, where, defaultStatus
const ITEMS=[
  // A — cross-track contradictions
  ['1','A','high',t('Language not unified','语言不统一'),t('TUI partly English+i18n; all of GUI & Core + T0/T1/T3/T4/T5 still Chinese. Mixed-language product, and filenames are Chinese while UI is English.','TUI 部分英文+i18n;GUI 全部、Core 全部、T0/T1/T3/T4/T5 仍中文。两种语言并存,且文件名中文 UI 英文。'),t('Roll out i18n (English-first) to all product UI; decide Core docs policy; normalize filenames.','把 i18n 英文优先铺到全部产品 UI;定 Core 文档语言策略;统一文件名。'),t('all tracks','全轨'),'done'],
  ['2','A','high',t('Core brand TUI ⟂ TUI track','Core 品牌 TUI ⟂ TUI 轨'),t('Core “Logo & TUI” uses old chrome/Chinese, diverged from the TUI track\u2019s current language (2-line chrome, box-drawing, reverse focus, HUD).','Core 的 Logo & TUI 仍旧 chrome/中文,与 TUI 轨现行语言分叉。'),t('Redo Core brand TUI frame to match T0/T1; keep only logo + one sample frame.','按 T0/T1 重做 Core 品牌 TUI 帧;只留 logo + 一帧示意。'),t('Core · Logo&TUI','Core · Logo&TUI'),'done'],
  ['3','A','high',t('Backend model inconsistent','后端模型不一致'),t('TUI has built-in/ACP/tmux 3 backends; GUI (D1v2/D4) only says “agent”, no tmux, no 3-backend story.','TUI 有内置/ACP/tmux 三后端;GUI 只讲 agent,无 tmux、无三后端。'),t('Add 3-backend concept to D1v2 & D4 (backend badge, tmux bridge).','D1v2/D4 加三后端(后端徽标、tmux 桥接)。'),'GUI · D1v2·D4','done'],
  ['4','A','high',t('Permission prompt only in TUI','权限提示只在 TUI'),t('T3 defines permission (pre-exec) ≠ gate (post-output) with 4 prompt types; GUI has no permission UI at all — D2 only has gates.','T3 定义权限(执行前)≠ 闸(产出后)+ 四类;GUI 完全没有权限界面。'),t('Add a GUI permission prompt (modal/inline) mirroring T3\u2019s 4 types.','GUI 加权限提示(模态/内联),对齐 T3 四类。'),'GUI','done'],
  ['5','A','mid',t('Decision Center naming drift','决策中心命名漂移'),t('“行为Diff评审 v2” / “决策中心” / ⌃G Decision Center / “routing foyer” — one thing, 3–4 names.','同一物三四个叫法。'),t('Pin one external name (Decision Center); update all references.','钉一个对外名(决策中心);全量更新。'),t('D2 · D7 · TUI','D2 · D7 · TUI'),'done'],
  // B — within-track contradictions
  ['6','B','high',t('Status bar self-contradiction','状态栏自相矛盾'),t('T1d now scrolls the gate ⏸ in the marquee; but T8/T4/T1 say actionable (gates/errors) must be PINNED, never rotated. T1d violates its own rule.','T1d 把闸 ⏸ 放进滚动;但 T8/T4/T1 规定闸/错误必须钉住、绝不轮播。T1d 违反自定规则。'),t('Decide: pin gate count separately + scroll only ambient; OR amend the HUD rule. Reconcile T1d vs T1/T4/T8.','定:闸计数单独钉住、只滚环境信号;或改 HUD 原则。让 T1d 与 T1/T4/T8 一致。'),'TUI · T1d↔T1/T4/T8','done'],
  ['7','B','mid',t('Two status-bar designs','状态栏两套设计'),t('T1 pins lane·backend·session-windows; T1d pins only project, scrolls the rest. Two different status bars.','T1 钉 lane·后端·会话窗口;T1d 只钉 proj 其余全滚。两套。'),t('Unify into one status-bar spec across all TUI screens.','统一成一套状态栏规范。'),'TUI · T1↔T1d','done'],
  ['8','B','mid',t('D2 chart colors hardcoded','D2 图表硬编码色'),t('Review R2 logged it: decision-center charts don\u2019t use tokens / don\u2019t theme-switch. Conflicts with T4 “color = state, global tokens”.','决策中心图表没走 token、不随主题切;与 T4 冲突。仍未落实。'),t('Refactor D2 chart colors to Aurora tokens.','D2 图表色改用 Aurora token。'),'GUI · D2','done'],
  // C — design holes
  ['9','C','high',t('Empty / error states missing','空态/错误态缺失'),t('Only D12 (merge conflict) & D9 (reconnect) exist. Missing: empty cockpit (no lanes), ACP/SSH disconnect, agent crash/loop, budget at 100%, empty gate queue.','仅 D12/D9 有。缺:无 lane 空驾驶舱、连接中断、agent 崩溃/死循环、预算 100%、空闸队列。'),t('Design a states set: empty / connecting / disconnected / crashed / exhausted.','设计状态集:空/连接中/断开/崩溃/耗尽。'),t('all tracks','全轨'),'done'],
  ['10','C','high',t('Team join / identity missing','团队加入/身份缺失'),t('V1.5 is team, but no member invite / identity / permission matrix. D7 only routes ownership — who can approve field gates, edit viden.toml, how a new member joins?','V1.5 团队版,但无邀请/身份/权限矩阵。D7 只路由 ownership。'),t('Design member identity + permission matrix + join/onboard flow.','设计成员身份 + 权限矩阵 + 加入流程。'),'GUI · D7+','done'],
  ['11','C','mid',t('No audit / timeline UI','审计/时间线无界面'),t('Plan repeatedly cites git-native audit / team timeline as a compliance selling point — but there\u2019s no timeline screen.','方案多次提审计流/时间线作合规卖点,却无界面。'),t('Design the team timeline / audit-trail view.','设计团队时间线 / 审计流界面。'),'GUI','done'],
  ['12','C','mid',t('Post-merge rollback','合并后回滚'),t('D12 solves “can\u2019t merge”; nothing for “merged but broken” — revert main, undo a merge.','D12 解决合不进;没解决合进去但是坏的——回滚 main。'),t('Add a bad-merge / revert flow (likely D12 sibling).','加坏合入/回滚流程(D12 兄弟稿)。'),'GUI · D12+','done'],
  ['13','C','mid',t('Away-from-desk recall','离开终端怎么拉回'),t('Pip/inbox are in-app; IM only in V2. When the human is away, gate notification is empty.','Pip/收件箱都在应用内;V2 才有 IM。人不在时通知是空的。'),t('Define an away/notification fallback (even minimal email/webhook in V1.5).','定离开态通知兜底(V1.5 至少 email/webhook)。'),'Core · V1.5','done'],
  ['14','C','low',t('Contract / policy conflict','契约/闸策略冲突'),t('Two lanes editing the same contract, or viden.toml gate rules clashing — no handling flow.','两 lane 同改契约、或 viden.toml 规则打架,无处理流。'),t('Define contract-merge & policy-conflict handling.','定契约合并与策略冲突处理。'),'Core','open'],
  // D — product blind spots
  ['15','D','high',t('Single-user 10x not proven','单人版 10x 没立住'),t('V1 is solo. Why not just use codex/Claude Code directly? The incremental value of gates+evidence for ONE person isn\u2019t made — affects cold start.','V1 单人。为何不直接用 codex/Claude Code?闸+证据对单人的增量价值没讲透——影响冷启动。'),t('Articulate solo value prop; consider a solo-first hook in the plan.','讲清单人价值;方案加单人优先抓手。'),'Core · plan','open'],
  ['16','D','high',t('Market has moved','市场已变'),t('Plan benchmarks Zed/WorkBuddy/Cursor, but Charm Crush / OpenCode / Claude Code teams / Devin already target “multi-agent + review”. Differentiation needs refresh.','对标过时;Crush/OpenCode/Claude Code 团队版/Devin 已抢位。'),t('Refresh competitive analysis & sharpen the wedge.','更新竞品分析,磨利差异点。'),'Core · plan','open'],
  ['17','D','mid',t('Deploy / data governance','部署/数据治理'),t('Built-in mentions local/privacy, but no self-host vs cloud, no data-egress governance for code+evidence to 3rd-party model vendors — key for enterprise.','无自托管 vs 云、无代码+证据出境治理——企业合规关键。'),t('Add a deployment & data-governance section to the plan.','方案加部署与数据治理章节。'),'Core · plan','open'],
  ['18','D','mid',t('Pricing / packaging','定价/打包'),t('No business model. Per lane? per token? per seat? Affects budget/quota UI.','无商业模式;按 lane/token/席位?影响预算界面。'),t('Decide pricing model; reflect in budget/quota surfaces.','定定价;反映到预算界面。'),'Core · plan','open'],
  ['19','D','mid',t('Runaway-agent backstop','agent 失控兜底'),t('Budget asks exist, but loop/burn/wrong-real-action kill-switch & liability model are thin (T3 has e-stop, product-level guard weak).','预算问询有了,但死循环/烧钱/误操作实机的硬 kill-switch 与责任模型薄。'),t('Strengthen kill-switch + responsibility model at product level.','强化 kill-switch + 责任模型。'),'TUI/Core · T3','open'],
  // E — consistency cleanup
  ['20','E','low',t('Filename / title CN-EN mix','文件名/标题中英混用'),t('Mixed CN/EN across files & titles.','文件名标题中英混用。'),t('Define a naming convention; apply.','定命名规范并执行。'),t('all','全部'),'open'],
  ['21','E','low',t('gate-type ↔ label map','gate type↔标签映射'),t('No persisted map between viden.toml gate types (replay-regression) and UI labels (回放回归闸).','viden.toml 类型与 UI 标签无映射表。'),t('Sink a gate-type → label mapping table.','沉淀 gate type → 标签映射表。'),'Core','done'],
  ['22','E','low',t('“Mode / Domain Pack” terms','模式/领域包用词'),t('Mode / Domain Pack / MuseGameWorkshop external-vs-internal boundary (Q5 decided, UI not unified).','四词对外/对内边界未在界面统一执行。'),t('Apply Q5 naming consistently across UI.','按 Q5 在界面统一执行。'),'all','open'],
  ['23','E','low',t('reduced-motion coverage','reduced-motion 覆盖'),t('Is reduced-motion covered on all GUI motion (Pip etc.)? TUI already covered.','GUI 动效(Pip 等)是否都覆盖 reduced-motion?TUI 已覆盖。'),t('Audit reduced-motion on GUI animations.','审 GUI 动效的 reduced-motion。'),'GUI · Pip','open'],
];

const CATS={A:t('Cross-track contradiction','三轨矛盾'),B:t('Within-track contradiction','单轨矛盾'),C:t('Design hole','设计漏洞'),D:t('Product blind spot','产品忽略点'),E:t('Consistency cleanup','一致性收尾')};
const CATCOLOR={A:'var(--error)',B:'var(--gold)',C:'var(--accent)',D:'var(--builtin)',E:'var(--fg-muted)'};
const COLS=[['open',t('Open','待办'),'open'],['doing',t('In progress','进行中'),'doing'],['done',t('Resolved','已解决'),'done']];
const SEVLABEL={high:t('HIGH','高'),mid:t('MID','中'),low:t('LOW','低')};

function App(){
  const [status,setStatus]=useState(()=>{
    try{return JSON.parse(localStorage.getItem(LS))||{};}catch(e){return {};}
  });
  const [fcat,setFcat]=useState('all');
  const [fsev,setFsev]=useState('all');
  useEffect(()=>{localStorage.setItem(LS,JSON.stringify(status));},[status]);

  const stOf=(id,def)=>status[id]||def;
  const move=(id,def,dir)=>{
    const order=['open','doing','done'];
    const cur=order.indexOf(stOf(id,def));
    const next=Math.max(0,Math.min(2,cur+dir));
    setStatus(s=>({...s,[id]:order[next]}));
  };
  const reset=()=>{ if(confirm(t('Reset all statuses?','重置全部状态?'))) setStatus({}); };

  const visible=ITEMS.filter(it=>(fcat==='all'||it[1]===fcat)&&(fsev==='all'||it[2]===fsev));
  const counts={open:0,doing:0,done:0,high:0};
  ITEMS.forEach(it=>{counts[stOf(it[0],it[7])]++; if(it[2]==='high'&&stOf(it[0],it[7])!=='done')counts.high++;});
  const total=ITEMS.length;
  const pctDone=Math.round(counts.done/total*100), pctDoing=Math.round(counts.doing/total*100);

  return (
    <React.Fragment>
      <div className="pkicker">viden · review · kanban</div>
      <h1 className="ph1">{t('Design Review Board','设计审查看板')} <span className="ac">{t('23 items · TUI · GUI · Core','23 条 · TUI · GUI · Core')}</span></h1>
      <p className="plead">{t('Final-review board across all three tracks: contradictions, design holes, product blind spots, cleanup. Click ','三轨终审看板:矛盾 / 漏洞 / 忽略点 / 收尾。点 ')}<b>→</b>{t(' to advance a card (Open → In progress → Resolved), ',' 推进卡片(待办→进行中→已解决),')}<b>←</b>{t(' to move back. Status persists locally. EN/中 top-right.',' 回退。状态本地保存。右上 EN/中。')}</p>

      <div className="sumbar">
        <div className="stat open"><span className="big">{counts.open}</span><span className="lab">{t('Open','待办')}</span></div>
        <div className="stat doing"><span className="big">{counts.doing}</span><span className="lab">{t('In progress','进行中')}</span></div>
        <div className="stat done"><span className="big">{counts.done}</span><span className="lab">{t('Resolved','已解决')}</span></div>
        <div className="stat crit"><span className="big">{counts.high}</span><span className="lab">{t('High open','高危未结')}</span></div>
        <div className="prog"><i className="pd" style={{width:pctDone+'%'}}></i><i className="pp" style={{width:pctDoing+'%'}}></i></div>
        <span className="reset" onClick={reset}>{t('reset','重置')}</span>
      </div>

      <div className="filters">
        <span className="lab">{t('cat','类')}</span>
        <span className={"fchip "+(fcat==='all'?'on':'')} onClick={()=>setFcat('all')}>{t('all','全部')}</span>
        {Object.keys(CATS).map(c=>(
          <span key={c} className={"fchip "+(fcat===c?'on':'')} onClick={()=>setFcat(c)}><span className="d" style={{background:CATCOLOR[c]}}></span>{c} · {CATS[c]}</span>
        ))}
        <span className="lab" style={{marginLeft:'10px'}}>{t('sev','级')}</span>
        {['all','high','mid','low'].map(s=>(
          <span key={s} className={"fchip "+(fsev===s?'on':'')} onClick={()=>setFsev(s)}>{s==='all'?t('all','全部'):SEVLABEL[s]}</span>
        ))}
      </div>

      <div className="board">
        {COLS.map(col=>{
          const items=visible.filter(it=>stOf(it[0],it[7])===col[0]);
          return (
            <div className="col" key={col[0]}>
              <div className={"colh "+col[2]}><span className="dot"></span><span className="t">{col[1]}</span><span className="n">{items.length}</span></div>
              <div className={"colbody"+(items.length?'':' empty')} data-empty={t('— none —','— 空 —')}>
                {items.map(it=>{
                  const [id,cat,sev,title,desc,action,where,def]=it;
                  const cur=stOf(id,def);
                  return (
                    <div key={id} className={"card sev-"+sev+(cur==='done'?' is-done':'')}>
                      <div className="r1">
                        <span className="id">{id}</span>
                        <span className="cat" style={{color:CATCOLOR[cat]}}>{cat}</span>
                        <span className={"sev "+sev}>{SEVLABEL[sev]}</span>
                      </div>
                      <div className="tt">{title}</div>
                      <div className="ds">{desc}</div>
                      <div className="act"><span className="k">{t('FIX','建议')}</span> {action}</div>
                      <div className="meta">
                        <span className="where">{where.split('·').map((w,i)=>i===0?<b key={i}>{w}</b>:' · '+w)}</span>
                        <span className="btns">
                          {cur!=='open' && <span className="cbtn back" onClick={()=>move(id,def,-1)}>←</span>}
                          {cur!=='done' && <span className="cbtn fwd" onClick={()=>move(id,def,1)}>{t('advance →','推进 →')}</span>}
                          {cur==='done' && <span className="cbtn" style={{color:'var(--success)'}}>✓</span>}
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      <div className="note">{t('Suggested order: clear A (cross-track) + 6/9/10 (status-bar contradiction, empty/error states, team identity) first — the “spotted at a glance” hard problems. ','建议顺序:先清 A(三轨矛盾)+ 6/9/10(状态栏矛盾、空错态、团队身份)—— 一眼可见的硬伤。')}<span className="a">{t('Click cards to track as we fix.','边修边点卡片跟踪。')}</span></div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
