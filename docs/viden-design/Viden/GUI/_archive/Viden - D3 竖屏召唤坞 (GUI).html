<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-density="regular">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>viden Desktop · 竖屏召唤坞</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../tokens.css">
<style>
/* Token 单一真源 → ../tokens.css。本页只用 var(--*)。 */
*{box-sizing:border-box;}
/* 弱视觉细滚动条（主题化 · 透明轨道 + 弱色拇指，悬停略增强）*/
*{scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
*::-webkit-scrollbar{width:9px;height:9px;}
*::-webkit-scrollbar-track{background:transparent;}
*::-webkit-scrollbar-thumb{background:var(--border-soft);border-radius:6px;border:2px solid transparent;background-clip:padding-box;}
*::-webkit-scrollbar-thumb:hover{background:var(--border);}
*::-webkit-scrollbar-corner{background:transparent;}
body{margin:0;background:var(--page-bg);color:var(--fg-primary);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
kbd{font-family:var(--mono);font-size:9.5px;background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:3px;padding:1px 4px;color:var(--fg-muted);}

/* ---- page intro ---- */
.pwrap{max-width:1010px;margin:0 auto;padding:28px 26px 70px;}
.pkicker{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.pkicker::before{content:"";width:26px;height:2px;background:var(--accent);}
.ph1{font-size:34px;line-height:1.14;margin:0 0 12px;letter-spacing:-.8px;font-weight:700;}
.ph1 .ac{color:var(--accent);}
.plead{font-size:15.5px;color:var(--fg-secondary);max-width:880px;margin:0 0 22px;line-height:1.6;}
.plead b{color:var(--fg-primary);font-weight:600;}
.plead .g{color:var(--gold);font-weight:600;}

/* ============ DESKTOP WINDOW ============ */
.win{background:var(--bg-base);border:1px solid var(--win-edge);border-radius:var(--r-xl);overflow:hidden;
  box-shadow:var(--shadow-win);
  height:1236px;display:flex;flex-direction:column;position:relative;user-select:none;}
.titlebar{height:46px;flex:none;display:flex;align-items:center;gap:13px;padding:0 14px;background:var(--bg-void);border-bottom:1px solid var(--border-soft);}
.tl{display:flex;gap:8px;}
.tl i{width:12px;height:12px;border-radius:50%;display:block;}
.tl .a{background:var(--error);}.tl .b{background:var(--warning);}.tl .c{background:var(--success);}
.wm{font-family:var(--mono);font-weight:700;font-size:13.5px;letter-spacing:.3px;}
.wm .r{color:var(--gold);}.wm .c{color:var(--accent);}
.projsel{font-family:var(--mono);font-size:11.5px;color:var(--fg-secondary);background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:7px;padding:4px 9px;display:flex;align-items:center;gap:6px;cursor:pointer;}
.projsel .br{color:var(--gold);}
.crumb{font-family:var(--mono);font-size:11.5px;color:var(--fg-muted);display:flex;align-items:center;gap:7px;}
.crumb b{color:var(--fg-secondary);font-weight:600;}
.crumb .dots{color:var(--fg-faint);cursor:pointer;letter-spacing:1px;}
.tbspacer{flex:1;}
.tbchrome{display:flex;align-items:center;gap:5px;}
.segwrap{display:flex;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:8px;padding:2px;gap:1px;}
.segbtn{width:30px;height:24px;display:grid;place-items:center;border-radius:6px;cursor:pointer;color:var(--fg-muted);}
.segbtn:hover{color:var(--fg-secondary);}
.segbtn.on{background:var(--bg-sel);color:var(--accent-bright);box-shadow:inset 0 0 0 1px var(--accent-dim);}
.tbtbtn{width:30px;height:26px;display:grid;place-items:center;border-radius:7px;cursor:pointer;color:var(--fg-muted);}
.tbtbtn:hover{color:var(--fg-secondary);background:var(--bg-panel);}
.tbtbtn.on{background:var(--bg-sel);color:var(--accent-bright);box-shadow:inset 0 0 0 1px var(--accent-dim);}
svg{display:block;}

/* ============ BODY: work area + dock ============ */
.winbody{flex:1;display:flex;flex-direction:column;min-height:0;}
.winbody.right{flex-direction:row;}
.work{flex:1;min-height:0;display:grid;grid-template-columns:var(--leftw,210px) 1fr;}

/* ----- left nav actions ----- */
.navtop{padding:9px 9px 4px;display:flex;flex-direction:column;gap:2px;}
.navbtn{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:12.5px;color:var(--fg-secondary);cursor:pointer;}
.navbtn:hover{background:var(--bg-elev);color:var(--fg-primary);}
.navbtn .ni{color:var(--fg-muted);display:grid;place-items:center;width:16px;}
.navbtn .k{margin-left:auto;}
/* ----- left lanes sidebar ----- */
.side{background:var(--bg-panel);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;min-height:0;}
.sidesec{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--fg-faint);padding:13px 13px 6px;}
.sidehead{display:flex;align-items:center;padding:11px 12px 7px;}
.sidehead h3{font-size:12.5px;margin:0;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:7px;}
.sidehead h3 .ct{color:var(--fg-faint);font-family:var(--mono);font-size:11px;font-weight:600;}
.sidehead .new{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--accent);cursor:pointer;display:flex;gap:5px;align-items:center;}
.lanes{padding:0 7px;overflow-y:auto;}
.lane{padding:8px 8px;border-radius:8px;cursor:pointer;margin-bottom:2px;border:1px solid transparent;}
.lane:hover{background:var(--bg-elev);}
.lane.on{background:var(--bg-sel);border-color:var(--accent-dim);}
.lane .l1{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--fg-secondary);}
.lane.on .l1{color:var(--fg-primary);}
.lane .lid{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--accent);flex:none;}
.lane .dot{width:7px;height:7px;border-radius:50%;flex:none;}
.lane .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lane .l2{font-family:var(--mono);font-size:10px;color:var(--fg-faint);margin-top:3px;display:flex;align-items:center;gap:6px;padding-left:14px;}
.lane .l2 .br{color:var(--gold);}
.sidefoot{margin-top:auto;padding:9px 13px;border-top:1px solid var(--border-soft);font-family:var(--mono);font-size:10px;color:var(--fg-faint);line-height:1.6;}
.sidefoot .ac{color:var(--accent);}

/* ----- center chat ----- */
.center{display:flex;flex-direction:column;min-height:0;background:var(--bg-base);}
.coscroll{flex:1;overflow-y:auto;padding:20px 30px 14px;}
.coinner{max-width:760px;margin:0 auto;}
.msg{margin-bottom:18px;}
.msg .who{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px;color:var(--fg-muted);display:flex;align-items:center;gap:7px;margin-bottom:7px;}
.msg .av{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--bg-void);}
.msg.user{display:flex;flex-direction:column;align-items:flex-end;}
.msg.user .av{background:var(--accent);}
.msg.bot .av{background:var(--gold);}
.msg .body{font-size:14px;line-height:1.62;color:var(--fg-primary);}
.msg.user .body{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:11px 11px 4px 11px;padding:10px 14px;max-width:78%;color:var(--fg-secondary);}
.msg .body code{font-family:var(--mono);font-size:12.5px;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:4px;padding:1px 5px;color:var(--accent-bright);}
.msg .body ul{margin:9px 0 0;padding-left:6px;list-style:none;}
.msg .body li{position:relative;padding-left:18px;margin-bottom:6px;font-size:13.5px;color:var(--fg-secondary);line-height:1.5;}
.msg .body li::before{content:"·";position:absolute;left:5px;color:var(--accent);font-weight:700;}
.msg .body li b{color:var(--fg-primary);font-weight:600;}
.cmds{margin:9px 0 0;display:flex;flex-direction:column;gap:5px;}
.cmdpill{font-family:var(--mono);font-size:12px;color:var(--fg-secondary);background:var(--bg-void);border:1px solid var(--border-soft);border-radius:6px;padding:4px 10px;width:fit-content;}
.cmdpill .ok{color:var(--success);}

/* "Edited N files" diff card — borrowed from Codex */
.editcard{border:1px solid var(--border-soft);border-radius:12px;overflow:hidden;margin:14px 0 4px;background:var(--bg-panel);}
.echead{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border-soft);}
.echead .ic{width:30px;height:30px;border-radius:8px;background:var(--bg-elev);border:1px solid var(--border-soft);display:grid;place-items:center;color:var(--accent);flex:none;}
.echead .tt{font-size:13.5px;font-weight:600;}
.echead .st{font-family:var(--mono);font-size:11px;margin-top:2px;}
.echead .st .p{color:var(--success);}.echead .st .m{color:var(--error);}
.echead .acts{margin-left:auto;display:flex;gap:8px;}
.ecbtn{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--fg-secondary);background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:7px;padding:5px 11px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.ecbtn:hover{border-color:var(--border);color:var(--fg-primary);}
.ecbtn.go{color:var(--accent-bright);border-color:var(--accent-dim);background:var(--bg-sel);}
.ecrow{display:flex;align-items:center;gap:10px;padding:9px 16px;font-family:var(--mono);font-size:12.5px;border-bottom:1px solid var(--border-soft);cursor:pointer;}
.ecrow:last-child{border-bottom:none;}
.ecrow:hover{background:var(--bg-elev);}
.ecrow .fn{color:var(--fg-secondary);}
.ecrow .fn b{color:var(--fg-primary);font-weight:600;}
.ecrow .pm{margin-left:auto;display:flex;gap:9px;}
.ecrow .pm .p{color:var(--success);}.ecrow .pm .m{color:var(--error);}

.worked{font-family:var(--mono);font-size:11.5px;color:var(--fg-muted);display:flex;align-items:center;gap:7px;margin:4px 0 14px;cursor:pointer;}
.worked::after{content:"›";color:var(--fg-faint);}

/* composer */
.composer{flex:none;padding:12px 30px 16px;}
.cinner{max-width:760px;margin:0 auto;}
.cbox{background:var(--bg-panel);border:1px solid var(--border);border-radius:13px;padding:11px 13px 9px;box-shadow:var(--shadow-sm);}
.cbox:focus-within{border-color:var(--border-active);}
.ctext{font-size:13.5px;color:var(--fg-muted);min-height:22px;padding:2px 2px 8px;}
.crow{display:flex;align-items:center;gap:7px;}
.cadd{width:28px;height:28px;border-radius:8px;border:1px solid var(--border-soft);background:var(--bg-elev);display:grid;place-items:center;color:var(--fg-secondary);cursor:pointer;font-size:16px;line-height:1;}
.cadd:hover{color:var(--accent-bright);border-color:var(--accent-dim);}
.cpill{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--fg-secondary);background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:7px;padding:5px 9px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.cpill .lbl{color:var(--fg-faint);letter-spacing:.5px;}
.cpill .perm{color:var(--warning);}
.cpill .mode{color:var(--gold);}
.cspace{flex:1;}
.cmic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--fg-muted);cursor:pointer;}
.cmic:hover{color:var(--fg-secondary);}
.csend{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--bg-void);display:grid;place-items:center;cursor:pointer;}
.csend:hover{background:var(--accent-bright);}

/* ============ SUMMON DOCK ============ */
.dock{flex:none;background:var(--term-chrome);border-top:1px solid var(--term-edge);display:flex;flex-direction:column;min-height:0;position:relative;}
.winbody.right .dock{border-top:none;border-left:1px solid var(--term-edge);}
.dockgrip{position:absolute;top:-3px;left:0;right:0;height:6px;cursor:ns-resize;z-index:5;}
.winbody.right .dockgrip{top:0;bottom:0;left:-3px;right:auto;width:6px;height:auto;cursor:ew-resize;}
.docktabs{height:38px;flex:none;display:flex;align-items:stretch;padding:0 8px;gap:3px;background:var(--term-bar);border-bottom:1px solid var(--term-edge);}
.dt{display:flex;align-items:center;gap:7px;padding:0 11px;font-family:var(--mono);font-size:11.5px;color:var(--fg-muted);cursor:pointer;border-radius:7px 7px 0 0;position:relative;margin-bottom:-1px;border:1px solid transparent;border-bottom:none;align-self:flex-end;height:30px;}
.dt:hover{color:var(--fg-secondary);background:color-mix(in srgb,var(--bg-elev) 50%,transparent);}
.dt.on{background:var(--term-screen);color:var(--accent-bright);border-color:var(--term-edge);}
.dt.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);}
.dt .tic{display:grid;place-items:center;opacity:.85;}
.dt.host{color:var(--fg-secondary);cursor:default;}
.dt.host .hdot{width:6px;height:6px;border-radius:50%;background:var(--success);}
.dt .x{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;font-size:11px;color:var(--fg-faint);margin-left:1px;}
.dt .x:hover{background:var(--bg-elev);color:var(--error);}
.dtaddwrap{align-self:center;position:relative;margin-left:2px;}
.dtadd{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--fg-muted);cursor:pointer;font-size:15px;line-height:1;}
.dtadd:hover,.dtadd.open{background:var(--bg-elev);color:var(--accent-bright);}
.docktabs .right{margin-left:auto;display:flex;align-items:center;gap:4px;}
.dockmini{align-self:center;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--fg-muted);cursor:pointer;}
.dockmini:hover{color:var(--fg-secondary);background:var(--bg-elev);}

/* summon menu */
.summon{position:absolute;z-index:40;top:calc(100% + 6px);left:0;background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);padding:5px;width:236px;}
.summon::before{content:"";position:absolute;top:-5px;left:8px;width:9px;height:9px;background:var(--bg-elev);border-left:1px solid var(--border);border-top:1px solid var(--border);transform:rotate(45deg);}
.summon .mh{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--fg-faint);padding:7px 9px 4px;}
.smrow{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:7px;cursor:pointer;}
.smrow:hover{background:var(--bg-sel);}
.smrow .si{width:24px;height:24px;border-radius:6px;background:var(--bg-panel);border:1px solid var(--border-soft);display:grid;place-items:center;color:var(--accent);flex:none;}
.smrow .sn{font-size:12.5px;font-weight:500;color:var(--fg-primary);}
.smrow .sd{font-size:11px;color:var(--fg-muted);margin-top:1px;}
.smrow .sk{margin-left:auto;}
.smrow.dis{opacity:.4;cursor:default;}
.smrow.dis:hover{background:none;}
.veil{position:fixed;inset:0;z-index:30;}

/* dock body */
.dockbody{flex:1;min-height:0;background:var(--term-screen);overflow:hidden;display:flex;}
.dockempty{flex:1;display:grid;place-items:center;color:var(--fg-faint);font-family:var(--mono);font-size:12px;}

/* terminal tool */
.term{flex:1;display:flex;flex-direction:column;min-height:0;font-family:var(--mono);}
.termbody{flex:1;overflow-y:auto;padding:12px 16px;font-size:12.5px;line-height:1.65;}
.termbody .p{color:var(--accent-bright);}
.termbody .path{color:var(--gold);}
.termbody .br{color:var(--builtin);}
.termbody .dim{color:var(--fg-muted);}
.termbody .ok{color:var(--success);}
.termbody .err{color:var(--error);}
.termbody .warn{color:var(--warning);}
.curs{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px;animation:bl 1.1s step-end infinite;}
@keyframes bl{50%{opacity:0;}}

/* files tool */
.filespane{flex:1;display:flex;min-height:0;}
.fileview{flex:1;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--term-edge);}
.fvtab{height:30px;flex:none;display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid var(--term-edge);font-family:var(--mono);font-size:11.5px;color:var(--fg-secondary);}
.fvtab .pm{margin-left:auto;display:flex;gap:8px;}
.fvtab .pm .p{color:var(--success);}.fvtab .pm .m{color:var(--error);}
.fvbody{flex:1;overflow:auto;padding:10px 0;font-family:var(--mono);font-size:12px;line-height:1.62;}
.cl{display:flex;padding:0 16px;white-space:pre;}
.cl .ln{width:34px;flex:none;text-align:right;padding-right:14px;color:var(--fg-faint);user-select:none;}
.cl.add{background:color-mix(in srgb,var(--success) 11%,transparent);}
.cl.add .ln{color:var(--success);}
.cl.del{background:color-mix(in srgb,var(--error) 11%,transparent);}
.cl.del .ln{color:var(--error);}
.cl .kw{color:var(--builtin);}.cl .fn2{color:var(--accent-bright);}.cl .str{color:var(--gold);}.cl .cm{color:var(--fg-faint);}
.fvempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--fg-faint);gap:6px;}
.fvempty .t{font-size:13px;color:var(--fg-muted);}
.fvempty .s{font-size:11.5px;font-family:var(--mono);}
.ftree{width:262px;flex:none;display:flex;flex-direction:column;min-height:0;}
.ftfilter{flex:none;padding:8px 10px;border-bottom:1px solid var(--term-edge);}
.ftfilter .inp{display:flex;align-items:center;gap:7px;background:var(--bg-void);border:1px solid var(--border-soft);border-radius:7px;padding:5px 9px;font-family:var(--mono);font-size:11.5px;color:var(--fg-muted);}
.ftbody{flex:1;overflow-y:auto;padding:5px 5px;font-family:var(--mono);font-size:12px;}
.frow{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--fg-secondary);}
.frow:hover{background:var(--bg-elev);}
.frow.on{background:var(--bg-sel);color:var(--accent-bright);}
.frow .ar{color:var(--fg-faint);width:9px;font-size:9px;}
.frow .fi{color:var(--fg-muted);}
.frow.dir{color:var(--fg-primary);font-weight:600;}
.frow .g{font-weight:700;width:11px;text-align:center;flex:none;}
.frow .g.m{color:var(--gold);}.frow .g.a{color:var(--success);}
.frow .pm{margin-left:auto;font-size:9.5px;color:var(--fg-faint);}

/* review tool */
.review{flex:1;display:flex;flex-direction:column;min-height:0;}
.rvhead{height:32px;flex:none;display:flex;align-items:center;gap:11px;padding:0 16px;border-bottom:1px solid var(--term-edge);font-family:var(--mono);font-size:11.5px;color:var(--fg-secondary);}
.rvhead .ct{color:var(--fg-faint);}
.rvhead .acts{margin-left:auto;display:flex;gap:7px;}
.rvbody{flex:1;overflow-y:auto;padding:0;}
.rvfile{border-bottom:1px solid var(--term-edge);}
.rvfh{display:flex;align-items:center;gap:9px;padding:8px 16px;font-family:var(--mono);font-size:12px;color:var(--fg-secondary);position:sticky;top:0;background:var(--term-bar);cursor:pointer;}
.rvfh .g{font-weight:700;}.rvfh .g.m{color:var(--gold);}.rvfh .g.a{color:var(--success);}
.rvfh .pm{margin-left:auto;display:flex;gap:8px;font-size:11px;}
.rvfh .pm .p{color:var(--success);}.rvfh .pm .m{color:var(--error);}
.rvhunk{font-family:var(--mono);font-size:12px;line-height:1.6;padding:6px 0;}
.hl{display:flex;padding:0 16px;white-space:pre;}
.hl .ln{width:30px;flex:none;text-align:right;padding-right:12px;color:var(--fg-faint);}
.hl.h{color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);}
.hl.a{background:color-mix(in srgb,var(--success) 11%,transparent);color:var(--fg-primary);}
.hl.d{background:color-mix(in srgb,var(--error) 11%,transparent);color:var(--fg-secondary);}

/* browser tool */
.browser{flex:1;display:flex;flex-direction:column;min-height:0;}
.bnav{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--term-edge);}
.bbtn{width:22px;height:22px;display:grid;place-items:center;color:var(--fg-muted);border-radius:5px;cursor:pointer;}
.bbtn:hover{background:var(--bg-elev);color:var(--fg-secondary);}
.burl{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg-void);border:1px solid var(--border-soft);border-radius:7px;padding:5px 11px;font-family:var(--mono);font-size:11.5px;color:var(--fg-secondary);}
.burl .lk{color:var(--success);}
.burl .host{color:var(--fg-primary);}
.bview{flex:1;min-height:0;background:var(--bg-void);display:grid;place-items:center;overflow:hidden;}
.appshot{width:88%;max-width:620px;border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow-lg);background:var(--bg-base);}
.appshot .ash{height:30px;display:flex;align-items:center;gap:8px;padding:0 11px;background:var(--bg-void);border-bottom:1px solid var(--border-soft);font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);}
.appshot .asb{padding:18px;display:flex;gap:14px;}
.appshot .canvas{flex:1;height:150px;border:1px solid var(--border-soft);border-radius:8px;background:repeating-linear-gradient(45deg,var(--bg-panel),var(--bg-panel) 9px,var(--bg-elev) 9px,var(--bg-elev) 18px);display:grid;place-items:center;color:var(--fg-muted);font-family:var(--mono);font-size:11px;}
.appshot .insp{width:120px;display:flex;flex-direction:column;gap:7px;}
.appshot .ib{height:22px;border-radius:5px;background:var(--bg-panel);border:1px solid var(--border-soft);}
.appshot .ib.ac{border-color:var(--accent-dim);background:var(--bg-sel);}

/* side chat tool */
.sidechat{flex:1;display:flex;flex-direction:column;min-height:0;}
.scbody{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:11px;}
.scmsg{max-width:82%;font-size:12.5px;line-height:1.55;padding:8px 11px;border-radius:10px;}
.scmsg.u{align-self:flex-end;background:var(--bg-sel);color:var(--fg-primary);border:1px solid var(--accent-dim);border-radius:10px 10px 3px 10px;}
.scmsg.b{align-self:flex-start;background:var(--bg-panel);color:var(--fg-secondary);border:1px solid var(--border-soft);border-radius:10px 10px 10px 3px;}
.scmsg .who{font-family:var(--mono);font-size:9px;letter-spacing:.8px;color:var(--fg-faint);margin-bottom:4px;}
.scmsg code{font-family:var(--mono);font-size:11.5px;color:var(--accent-bright);}
.scfoot{flex:none;padding:9px 12px;border-top:1px solid var(--term-edge);}
.scinp{display:flex;align-items:center;gap:8px;background:var(--bg-void);border:1px solid var(--border-soft);border-radius:9px;padding:7px 11px;font-size:12px;color:var(--fg-muted);}
.scinp .s{margin-left:auto;color:var(--accent);}
.scnote{font-family:var(--mono);font-size:10px;color:var(--fg-faint);padding:6px 12px 0;display:flex;align-items:center;gap:6px;}
.scnote .ac{color:var(--builtin);}

/* collapsed dock state */
.dock.collapsed .dockbody{display:none;}

/* mode helper note under window */
.note{font-family:var(--mono);font-size:11.5px;color:var(--fg-muted);margin-top:14px;line-height:1.6;display:flex;flex-wrap:wrap;gap:6px 18px;}
.note b{color:var(--accent);}
.note .k{color:var(--gold);}

/* ---------- SUMMON DOCK ---------- */
function Dock({tabs,setTabs,active,setActive,menuOpen,setMenuOpen,collapsed,setCollapsed,height,onGrip}){
  const order=['terminal','files','review','browser','sidechat'];
  const openTool=(k)=>{
    setMenuOpen(false);
    if(!tabs.includes(k)) setTabs([...tabs,k]);
    setActive(k); setCollapsed(false);
  };
  const closeTab=(e,k)=>{
    e.stopPropagation();
    const nt=tabs.filter(t=>t!==k);
    setTabs(nt);
    if(active===k) setActive(nt.length?nt[nt.length-1]:null);
  };
  React.useEffect(()=>{window.__openTool=openTool;window.__openSummon=()=>setMenuOpen(true);});
  const Render = active?TOOLRENDER[active]:null;
  return (
    <div className={"dock"+(collapsed?' collapsed':'')} style={{height:collapsed?38:height}}>
      <div className="dockgrip" onMouseDown={onGrip}></div>
      <div className="docktabs">
        <div className="dt host" title="主机终端会话 · 不可关闭"><span className="hdot"></span>wiki@viden</div>
        {tabs.map(k=>(
          <div key={k} className={"dt "+(active===k?'on':'')} onClick={()=>{setActive(k);setCollapsed(false);}}>
            <span className="tic">{TOOLDEF[k].icon}</span>{TOOLDEF[k].label}
            <span className="x" onClick={(e)=>closeTab(e,k)}>✕</span>
          </div>
        ))}
        <div className="dtaddwrap">
          <div className={"dtadd"+(menuOpen?' open':'')} onClick={(e)=>{e.stopPropagation();setMenuOpen(!menuOpen);}} title="召唤工具坞">+</div>
          {menuOpen && <>
          <div className="veil" onClick={()=>setMenuOpen(false)}></div>
          <div className="summon" onClick={e=>e.stopPropagation()}>
            <div className="mh">召唤工具坞</div>
            {order.map(k=>{
              const on=tabs.includes(k);
              return (
                <div key={k} className="smrow" onClick={()=>openTool(k)}>
                  <span className="si">{TOOLDEF[k].icon}</span>
                  <div><div className="sn">{TOOLDEF[k].label}{on&&<span style={{color:'var(--fg-faint)',fontSize:'10px',marginLeft:6}}>已开</span>}</div><div className="sd">{TOOLDEF[k].desc}</div></div>
                  <kbd className="sk">{TOOLDEF[k].kbd}</kbd>
                </div>
              );
            })}
          </div>
          </>}
        </div>
        <div className="right">
          <span className="dockmini" title={collapsed?'展开坞':'收起坞'} onClick={()=>setCollapsed(!collapsed)}>{collapsed?'▴':'▾'}</span>
        </div>
      </div>
      {!collapsed && <div className="dockbody">
        {Render? <Render/> : <div className="dockempty">坞内无工具 · 点 <b style={{color:'var(--accent)',margin:'0 4px'}}>+</b> 召唤 Terminal / Files / Review / Browser / Side chat</div>}
      </div>}
    </div>
  );
}

/* ---------- WINDOW ---------- */
function Win(){
  const [active,setActive]=useState(0);
  const [tabs,setTabs]=useState(['terminal','files']);
  const [aTool,setATool]=useState('terminal');
  const [menuOpen,setMenuOpen]=useState(false);
  const [collapsed,setCollapsed]=useState(false);
  const [dockH,setDockH]=useState(548);
  const layout='rows';
  const grip=(e)=>{
    e.preventDefault();
    const sy=e.clientY, sh=dockH;
    const mv=(ev)=>{const d=ev.clientY-sy;setDockH(Math.max(160,Math.min(820,sh-d)));};
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  };
  return (
    <div className="win">
      <div className="titlebar">
        <div className="tl"><i className="a"></i><i className="b"></i><i className="c"></i></div>
        <div className="wm"><span style={{color:'var(--accent)'}}>[</span><span style={{color:'var(--accent-bright)'}}>◉</span><span style={{color:'var(--accent)'}}>]</span> <span className="r">v</span><span className="c">iden</span></div>
        <div className="projsel">viden <span className="br">⎇ main</span> ▾</div>
        <div className="crumb"><b>L1 · config-loader</b><span className="dots">···</span></div>
        <div className="tbspacer"></div>
        <div className="tbchrome">
          <div className="tbtbtn" title="任务列表">{I.list}</div>
          <div className={"tbtbtn "+(!collapsed?'on':'')} title="切换召唤坞" onClick={()=>setCollapsed(!collapsed)}>{I.panel}</div>
          <div className="tbtbtn" title="全屏">{I.full}</div>
        </div>
      </div>
      <div className="winbody">
        <div className="work"><Sidebar active={active} setActive={setActive}/><Chat/></div>
        <Dock tabs={tabs} setTabs={setTabs} active={aTool} setActive={setATool} menuOpen={menuOpen} setMenuOpen={setMenuOpen} collapsed={collapsed} setCollapsed={setCollapsed} height={dockH} onGrip={grip}/>
      </div>
    </div>
  );
}

function App(){
  return (
    <div className="pwrap">
      <div className="pkicker">viden desktop · gui · D3</div>
      <h1 className="ph1">竖屏 <span className="ac">召唤坞</span> · portrait summon dock</h1>
      <p className="plead">竖向窗口:左侧导航 + 对话流占上半屏,<b>召唤坞占下半屏</b>。点坞条 <b className="g">+</b> 拉出 Terminal / Files / Review / Browser / Side chat,每个工具进驻一个可关闭标签;Files 坞内<b>左预览 · 右文件树</b>。坞可<b>收起</b>或拖上缘<b>调高度</b>,主转录里的 <b>"Edited N files"</b> diff 卡点 Review 即直达坞内审阅。</p>
      <Win/>
      <div className="note">
        <span>坞条 <b>+</b> = 召唤工具</span>
        <span>标签 <b>✕</b> = 关闭工具</span>
        <span>拖坞<span className="k">上缘</span> = 调高度</span>
        <span>标题栏 <b>▢</b> = 收起 / 展开坞</span>
        <span>主转录 <b>Review</b> = 直达坞内 diff</span>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
