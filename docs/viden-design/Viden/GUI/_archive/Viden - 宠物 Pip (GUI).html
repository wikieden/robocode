<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viden · Companion Pip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="../i18n.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../tokens.css">
<style>
/* Token 单一真源 → ../tokens.css;本页只用 var(--*)。默认 :root = dark 皮肤。 */
*{box-sizing:border-box;}
/* 弱视觉细滚动条（主题化 · 透明轨道 + 弱色拇指，悬停略增强）*/
*{scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
*::-webkit-scrollbar{width:9px;height:9px;}
*::-webkit-scrollbar-track{background:transparent;}
*::-webkit-scrollbar-thumb{background:var(--border-soft);border-radius:6px;border:2px solid transparent;background-clip:padding-box;}
*::-webkit-scrollbar-thumb:hover{background:var(--border);}
*::-webkit-scrollbar-corner{background:transparent;}
body{margin:0;background:var(--page-bg);color:var(--fg-primary);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
.pwrap{max-width:1180px;margin:0 auto;padding:26px 24px 80px;}
.pkicker{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.pkicker::before{content:"";width:24px;height:2px;background:var(--accent);}
.ph1{font-size:27px;margin:0 0 8px;letter-spacing:-.6px;}
.ph1 .ac{color:var(--accent);}
.plead{font-size:13.5px;color:var(--fg-secondary);margin:0 0 18px;max-width:940px;line-height:1.65;text-wrap:pretty;}
.plead b{color:var(--fg-primary);font-weight:600;}

/* ── stage: a mock app top edge with the pet pinned at very top ── */
.stage{position:relative;background:var(--bg-void);border:1px solid var(--term-edge);border-radius:12px;overflow:hidden;height:430px;box-shadow:0 22px 56px -30px rgba(0,0,0,.8);}
.appbar{height:46px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--term-chrome);}
.appbar .lg{font-family:var(--mono);font-weight:800;font-size:13px;}
.appbar .lg .br{color:var(--accent);}.appbar .lg .eye{color:var(--accent-bright);}.appbar .lg .v{color:var(--gold);}.appbar .lg .i{color:var(--accent);}
.appbar .path{font-family:var(--mono);font-size:11px;color:var(--fg-muted);}
.appbar .sp{flex:1;}
.appbar .dim{font-family:var(--mono);font-size:10px;color:var(--fg-faint);}
.backwall{position:absolute;inset:46px 0 0 0;padding:16px;opacity:.28;filter:blur(.5px);pointer-events:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start;}
.bw{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:9px;height:74px;padding:9px 11px;}
.bw .a{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:700;}
.bw .b{font-family:var(--mono);font-size:9px;color:var(--fg-muted);margin-top:6px;}

/* the pet, pinned top-center, overlapping the very top edge */
.petdock{position:absolute;top:7px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:flex-start;gap:11px;}
.pet{width:50px;height:44px;position:relative;cursor:pointer;flex:none;animation:bob 3.4s ease-in-out infinite;transform-origin:bottom center;}
.pet.alert{animation:perk 1.1s ease-in-out infinite;}
.pet.idle{animation:bob 5s ease-in-out infinite;}
.pet.happy{animation:hop .6s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
@keyframes perk{0%,100%{transform:translateY(0) rotate(0);}30%{transform:translateY(-5px) rotate(-3deg);}60%{transform:translateY(-1px) rotate(2deg);}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1);}40%{transform:translateY(-7px) scale(1.04,.96);}}
/* body */
.pet .body{position:absolute;left:5px;bottom:0;width:40px;height:34px;border-radius:13px 13px 15px 15px;background:radial-gradient(120% 120% at 50% 25%, #14384a, #0a1f2c 80%);border:1.5px solid var(--accent-dim);box-shadow:inset 0 4px 10px color-mix(in srgb,var(--accent-bright) 8%,transparent);}
.pet.alert .body{border-color:color-mix(in srgb,var(--gold) 55%,transparent);box-shadow:inset 0 4px 10px color-mix(in srgb,var(--gold-bright) 12%,transparent);}
.pet.happy .body{border-color:color-mix(in srgb,var(--success) 55%,transparent);}
/* antenna + status bulb */
.pet .ant{position:absolute;left:50%;top:-1px;width:1.5px;height:9px;background:var(--accent-dim);transform:translateX(-50%);}
.pet .bulb{position:absolute;left:50%;top:-7px;width:8px;height:8px;border-radius:50%;transform:translateX(-50%);background:var(--accent);box-shadow:0 0 8px var(--accent);}
.pet.alert .bulb{background:var(--gold-bright);box-shadow:0 0 10px var(--gold);animation:blink 1s steps(1) infinite;}
.pet.idle .bulb{background:var(--fg-faint);box-shadow:none;}
.pet.happy .bulb{background:var(--success);box-shadow:0 0 10px var(--success);}
@keyframes blink{50%{opacity:.35;}}
/* the big [◉] eye */
.pet .eye{position:absolute;left:50%;top:13px;transform:translateX(-50%);width:19px;height:19px;border-radius:50%;background:color-mix(in srgb,var(--accent) 22%,var(--term-screen));border:2px solid var(--accent-bright);display:grid;place-items:center;overflow:hidden;}
.pet.alert .eye{border-color:var(--gold-bright);}
.pet.happy .eye{border-color:var(--success);}
.pet .pupil{width:8px;height:8px;border-radius:50%;background:var(--accent-bright);box-shadow:0 0 5px var(--accent-bright);}
.pet.working .pupil{animation:scan 2.6s ease-in-out infinite;}
.pet.alert .pupil{background:var(--gold-bright);box-shadow:0 0 6px var(--gold-bright);transform:translate(4px,-2px);}
.pet.happy .pupil{background:var(--success);box-shadow:0 0 6px var(--success);}
@keyframes scan{0%,100%{transform:translateX(-4px);}50%{transform:translateX(4px);}}
/* idle: eye becomes a sleepy line */
.pet.idle .eye{height:5px;border-radius:3px;top:20px;background:transparent;border:0;border-bottom:2.5px solid var(--fg-muted);width:16px;}
.pet.idle .pupil{display:none;}
/* happy: eye becomes ^ */
.pet.happy .eye{background:transparent;border:0;height:14px;}
.pet.happy .eye::before{content:"^";color:var(--success);font-family:var(--mono);font-weight:700;font-size:15px;line-height:1;}
.pet.happy .pupil{display:none;}
/* count badge */
.pet .pbadge{position:absolute;right:-5px;top:-4px;background:var(--error);color:#fff;font-family:var(--mono);font-size:9.5px;font-weight:800;border-radius:9px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px;z-index:3;box-shadow:0 0 0 2px var(--bg-void);}
/* zzz for idle */
.zzz{position:absolute;right:-3px;top:-6px;font-family:var(--mono);font-size:11px;color:var(--fg-muted);animation:floatz 2.6s ease-in-out infinite;}
@keyframes floatz{0%{opacity:0;transform:translateY(4px);}40%{opacity:.7;}100%{opacity:0;transform:translateY(-8px);}}
/* sparkles for happy */
.spark{position:absolute;font-size:10px;color:var(--gold-bright);animation:spk .9s ease-out infinite;}
.spark.s1{left:-8px;top:2px;} .spark.s2{right:-7px;top:8px;animation-delay:.3s;}
@keyframes spk{0%{opacity:0;transform:scale(.4);}40%{opacity:1;}100%{opacity:0;transform:scale(1.2) translateY(-4px);}}

/* speech bubble */
.bubble{background:var(--bg-elev);border:1px solid var(--accent-dim);border-radius:11px;padding:10px 12px;min-width:230px;box-shadow:0 16px 40px rgba(0,0,0,.5);position:relative;margin-top:3px;}
.bubble.alertb{border-color:color-mix(in srgb,var(--gold) 45%,transparent);}
.bubble::before{content:"";position:absolute;left:-6px;top:14px;width:11px;height:11px;background:var(--bg-elev);border-left:1px solid var(--accent-dim);border-bottom:1px solid var(--accent-dim);transform:rotate(45deg);}
.bubble.alertb::before{border-color:color-mix(in srgb,var(--gold) 45%,transparent);}
.bubble .bt{font-size:12px;font-weight:700;color:var(--gold-bright);display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.bubble .bt.work{color:var(--accent-bright);}
.qrow{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;cursor:pointer;}
.qrow:hover{background:var(--bg-sel);}
.qrow .ic{font-family:var(--mono);font-size:11px;width:14px;text-align:center;flex:none;}
.qrow .tx{font-size:11.5px;color:var(--fg-secondary);} .qrow .tx b{color:var(--fg-primary);}
.qrow .go{margin-left:auto;font-family:var(--mono);font-size:8.5px;color:var(--fg-faint);}
.qrow:hover .go{color:var(--accent-bright);}
.bubble .ball{margin-top:7px;padding-top:8px;border-top:1px solid var(--border-soft);text-align:center;font-size:11px;color:var(--accent-bright);cursor:pointer;font-family:var(--mono);}
.bubble .ball:hover{color:#fff;}
.bubble .worktxt{font-size:11.5px;color:var(--fg-secondary);line-height:1.6;}
.bubble .worktxt b{color:var(--fg-primary);} .bubble .worktxt .run{color:var(--progress);}

/* controls */
.controls{display:flex;align-items:center;gap:10px;margin:16px 0 4px;flex-wrap:wrap;}
.seg{display:flex;gap:3px;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:9px;padding:3px;}
.seg button{font-family:var(--mono);font-size:11.5px;color:var(--fg-muted);border:0;background:transparent;border-radius:6px;padding:5px 13px;cursor:pointer;display:flex;align-items:center;gap:7px;}
.seg button.on{background:var(--bg-sel);color:var(--accent-bright);}
.seg button .d{width:7px;height:7px;border-radius:50%;}
.controls .auto{font-family:var(--mono);font-size:11px;color:var(--fg-muted);cursor:pointer;border:1px solid var(--border);border-radius:7px;padding:5px 11px;}
.controls .auto.on{color:var(--accent-bright);border-color:var(--accent-dim);}
.controls .hint{font-family:var(--mono);font-size:10.5px;color:var(--fg-faint);}

/* state legend + behavior */
.sech{display:flex;align-items:baseline;gap:11px;margin:32px 0 13px;}
.sech .no{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700;}
.sech h2{font-size:17px;margin:0;}
.sech .en{font-family:var(--mono);font-size:10px;color:var(--fg-faint);letter-spacing:1px;text-transform:uppercase;}
.sech .sp{flex:1;height:1px;background:var(--border-soft);align-self:center;}
.states{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.scard{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:11px;padding:14px;border-top:2px solid;}
.scard .h{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
.scard .h .d{width:8px;height:8px;border-radius:50%;}
.scard .en{font-family:var(--mono);font-size:9px;color:var(--fg-faint);}
.scard p{font-size:12px;color:var(--fg-secondary);line-height:1.55;margin:8px 0 0;}
.scard p b{color:var(--fg-primary);}
.rules{display:flex;flex-direction:column;gap:9px;}
.rule{display:flex;gap:12px;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:10px;padding:11px 15px;}
.rule .ic{font-family:var(--mono);font-size:13px;color:var(--accent);flex:none;width:18px;text-align:center;}
.rule .tx{font-size:13px;color:var(--fg-secondary);line-height:1.55;} .rule .tx b{color:var(--fg-primary);} .rule .tx code{font-family:var(--mono);font-size:12px;color:var(--accent-bright);}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--bg-elev);border:1px solid var(--accent-dim);color:var(--fg-primary);font-size:12.5px;border-radius:9px;padding:9px 16px;box-shadow:0 12px 34px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center;white-space:nowrap;z-index:50;font-family:var(--mono);}
.toast .m{color:var(--fg-muted);font-size:10px;}
@media(max-width:820px){.states{grid-template-columns:1fr 1fr;}.backwall{grid-template-columns:1fr 1fr;}}
@media (prefers-reduced-motion: reduce){.pet,.pet *,.zzz,.spark{animation:none !important;}}
</style>
</head>
<body>
<div class="pwrap">
  <div id="root"></div>
</div>

<script type="text/babel">
const {useState,useEffect} = React;
const t = window.t || ((en,zh)=>en);

const NEEDS=[
  {ic:'⏸',icc:'var(--gold-bright)',lane:'L2',t:t('hitstun · replay-regression gate','受击硬直 · 回放回归闸'),sub:t('awaiting you · evidence attached','等你批 · 证据已附')},
  {ic:'⏸',icc:'var(--gold-bright)',lane:'L4',t:t('level variants · gallery gate','关卡变体 · 画廊闸'),sub:t('20 keep/kill to review','20 keep/kill 待评')},
  {ic:'?',icc:'var(--warning)',lane:'L1',t:t('contract confirm · feel params v1.1','契约确认 · 手感参数 v1.1'),sub:t('subscribers to ack','订阅方待 ack')},
];
const STATES=[
  {k:'working',nm:t('Focused','专注'),en:'WORKING',col:'var(--accent)',d:t('A lane is running, no one waiting on you. Pip quietly watches the work, eyes scanning side to side, gently bobbing. Status light blue.','有 lane 在跑、无人等你。Pip 安静盯着活,眼珠左右扫,微微起伏。状态灯蓝。')},
  {k:'alert',nm:t('Needs you','求关注'),en:'NEEDS YOU',col:'var(--gold)',d:t('A gate / ask / permission awaits you. Pip peeks at you, pops a bubble naming which lanes, light turns gold + count badge.','有闸 / 问询 / 权限等你。Pip 探头看你、冒气泡点名哪些 lane,灯转金 + 角标计数。')},
  {k:'idle',nm:t('Dozing','打盹'),en:'IDLE',col:'var(--fg-muted)',d:t('Nothing running, nothing to do. Pip half-closes its eyes, dozes with zzz, light off. Never fidgets when idle.','无运行、无待办。Pip 半闭眼打盹冒 zzz,灯灭。绝不在空闲态躁动。')},
  {k:'happy',nm:t('Celebrate','庆祝'),en:'CLEARED',col:'var(--success)',d:t('Just cleared the queue / merged successfully. Pip hops, eyes turn ^, sparkles, returns to the matching state after 2s.','刚清空队列 / 合入成功。Pip 蹦一下、眼变 ^、冒星星,2 秒后回到对应态。')},
];

function Pet({state,count,onClick}){
  return (
    <div className={"pet "+state} onClick={onClick} title={t('click to expand/collapse','点我展开/收起')}>
      <span className="ant"></span><span className="bulb"></span>
      {state==='idle' && <span className="zzz">z</span>}
      {state==='happy' && <React.Fragment><span className="spark s1">✦</span><span className="spark s2">✦</span></React.Fragment>}
      <span className="body"></span>
      <span className="eye"><span className="pupil"></span></span>
      {state==='alert' && count>0 && <span className="pbadge">{count}</span>}
    </div>
  );
}

function App(){
  const [state,setState]=useState('alert');
  const [auto,setAuto]=useState(true);
  const [open,setOpen]=useState(true);
  const [toast,setToast]=useState(null);
  const flash=(m)=>{setToast(m);setTimeout(()=>setToast(null),2400);};

  useEffect(()=>{
    if(!auto)return;
    const seq=['working','alert','alert','idle','happy'];let i=0;
    const id=setInterval(()=>{i=(i+1)%seq.length;setState(seq[i]);},2600);
    return()=>clearInterval(id);
  },[auto]);

  const showBubble = open && (state==='alert' || state==='working');
  return (
    <React.Fragment>
      <div className="pkicker">viden · GUI · companion</div>
      <h1 className="ph1">{t('Companion Pip','宠物 Pip')} <span className="ac">always-on-top companion</span></h1>
      <p className="plead">{t('An always-on-top little pet (built from the brand ','一只常驻最上的小宠物(用品牌 ')}<b>[◉]</b>{t(' eye) turns the whole fleet’s status into a living presence: ',' 眼做成),把整支 fleet 的状态变成一个有生命的存在:')}<b>{t('while agents work it quietly watches (small motions); when a lane / session awaits your reply it peeks out + pops a bubble','agent 在干活时它安静地盯着活(微动),有 lane / 会话等你回复时它探头 + 冒气泡')}</b>{t(' naming who and how many. Click a lane in the bubble to jump there. Live demo below — switch states or click the pet to see it react.','点名是谁、几条。点气泡里的 lane 直接跳过去。下面是实时 demo —— 切状态或点宠物看反应。')}</p>
      <div className="controls">
        <div className="seg">
          {STATES.map(s=>(
            <button key={s.k} className={state===s.k?'on':''} onClick={()=>{setAuto(false);setState(s.k);setOpen(true);}}>
              <span className="d" style={{background:s.col}}></span>{s.nm}
            </button>
          ))}
        </div>
        <span className={"auto "+(auto?'on':'')} onClick={()=>setAuto(a=>!a)}>{auto?t('⏸ stop auto','⏸ 停止自动'):t('▶ auto demo','▶ 自动演示')}</span>
        <span className="hint">{t('click the pet to expand/collapse the bubble','点宠物可展开/收起气泡')}</span>
      </div>

      <div className="stage">
        <div className="appbar">
          <span className="lg"><span className="br">[</span><span className="eye">◉</span><span className="br">]</span> <span className="v">v</span><span className="i">iden</span></span>
          <span className="path">~/dev/boss-rush:main</span>
          <span className="sp"></span>
          <span className="dim">{t('cockpit · 6 lanes','驾驶舱 · 6 lanes')}</span>
        </div>
        <div className="backwall">
          <div className="bw"><div className="a">L1 {t('Design','策划')}</div><div className="b">⏸ {t('contract gate','契约闸')}</div></div>
          <div className="bw"><div className="a">L2 Gameplay</div><div className="b">⏸ {t('replay gate','回放闸')}</div></div>
          <div className="bw"><div className="a">L3 Gameplay</div><div className="b">▶ run · 38s</div></div>
          <div className="bw"><div className="a">L4 {t('Content gen','内容生成')}</div><div className="b">⏸ {t('gallery gate','画廊闸')}</div></div>
          <div className="bw"><div className="a">L5 {t('Training','训练')}</div><div className="b">▶ run · gpu-01</div></div>
          <div className="bw"><div className="a">L6 {t('Render','渲染')}</div><div className="b">○ {t('offline','离线')}</div></div>
        </div>

        <div className="petdock">
          <Pet state={state} count={NEEDS.length} onClick={()=>setOpen(o=>!o)}/>
          {showBubble && (state==='alert'
            ? <div className="bubble alertb">
                <div className="bt">⏸ {t('3 awaiting your reply','3 条等你回复')}</div>
                {NEEDS.map((n,i)=>(
                  <div key={i} className="qrow" onClick={()=>flash(t(`jump to ${n.lane} · ${n.t}`,`跳到 ${n.lane} · ${n.t}`))}>
                    <span className="ic" style={{color:n.icc}}>{n.ic}</span>
                    <span className="tx"><b>{n.lane}</b> {n.t}<br/><span style={{color:'var(--fg-muted)',fontSize:'10.5px'}}>{n.sub}</span></span>
                    <span className="go">{t('jump ↵','跳转 ↵')}</span>
                  </div>
                ))}
                <div className="ball" onClick={()=>flash(t('Open Decision Center (D2)','打开决策中心(D2)'))}>{t('All to Decision Center →','全部进决策中心 →')}</div>
              </div>
            : <div className="bubble">
                <div className="bt work">▶ {t('3 lanes running','3 lane 在跑')}</div>
                <div className="worktxt"><b>L3</b> {t('dash-cancel','冲刺取消')} · <span className="run">{t('editing','编辑中')}</span><br/><b>L5</b> {t('training warmup','训练 warmup')} · <span className="run">gpu-01</span><br/><b>L2</b> {t('replay re-run','回放重演')} 168/240f<br/><span style={{color:'var(--fg-faint)',fontSize:'10.5px'}}>{t('none need you — go do other things','都不需要你 —— 安心忙别的')}</span></div>
              </div>)}
        </div>
      </div>

      <div className="sech"><span className="no">01</span><h2>{t('Four states','四种状态')}</h2><span className="en">fleet mood</span><span className="sp"></span></div>
      <div className="states">
        {STATES.map(s=>(
          <div key={s.k} className="scard" style={{borderTopColor:s.col}}>
            <div className="h"><span className="d" style={{background:s.col}}></span>{s.nm} <span className="en">{s.en}</span></div>
            <p>{s.d}</p>
          </div>
        ))}
      </div>

      <div className="sech"><span className="no">02</span><h2>{t('Behavior rules','行为规则')}</h2><span className="en">{t('never steals the show','不喧宾夺主')}</span><span className="sp"></span></div>
      <div className="rules">
        <div className="rule"><span className="ic">◉</span><span className="tx">{t('One aggregate, not one per lane','一只聚合,不是每 lane 一只')}: {t('Pip is the whole fleet’s mood meter; many to-dos use a count badge + bubble list, no spam.','Pip 是整支 fleet 的情绪计;多条待办用角标计数 + 气泡列表,不刷屏。')}</span></div>
        <div className="rule"><span className="ic">⏸</span><span className="tx">{t('Read-only, non-intrusive','只读不打扰')}: {t('only peeks + bubbles when something awaits a reply, never pops a modal or steals focus; working = small motions, idle = dozing. Naming “who’s waiting” is its only proactive act.','有待回复才探头 + 冒气泡,绝不弹模态、不抢焦点;working 只微动,idle 打盹。点名「谁等你」是它唯一主动行为。')}</span></div>
        <div className="rule"><span className="ic">↵</span><span className="tx">{t('Click to jump','点击即跳')}: {t('click a lane in the bubble → jump to that session; click “All” → Decision Center (D2); click the pet → expand / collapse.','点气泡里的 lane → 跳该会话;点「全部」→ 决策中心(D2);点宠物 → 展开 / 收起。')}</span></div>
        <div className="rule"><span className="ic">◷</span><span className="tx">{t('Gentle escalation','升级温和')}: {t('long no reply → light brightens + occasional soft peek (no sound); at night / daemon mode Pip sleeps, backlog waits till morning, no nagging.','久未回复 → 灯更亮 + 偶尔轻探头(不发声);夜间 / daemon 模式 Pip 睡觉,积压留到早上,不扰。')}</span></div>
        <div className="rule"><span className="ic">◑</span><span className="tx">{t('Respects reduced-motion','尊重 reduced-motion')}: {t('system reduces motion → static pet expression + count badge, no info lost. Can be set to a pure badge in settings.','系统减弱动效 → 宠物静态表情 + 角标计数,信息不丢。可在设置里关成纯 badge。')}</span></div>
        <div className="rule"><span className="ic">▦</span><span className="tx">{t('Same source as the monitor','与监视器同源')}: {t('Pip is the minimal mood version of the D10 monitor — expand the monitor for the full lane card wall; a little pet is enough day-to-day.','Pip 是 D10 监视器的极简情绪版 —— 想看全 lane 卡片墙就展开监视器,平时一只小宠物足够。')}</span></div>
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
