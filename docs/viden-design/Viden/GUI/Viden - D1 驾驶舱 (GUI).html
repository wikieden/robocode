                  <span className="act2">{s.act}</span>

function Approval({onClose}){
  const [perm,setPerm]=useState('ask');
  return (
    <div className="scrim center" onClick={onClose}>
      <div className="appmodal" onClick={e=>e.stopPropagation()}>
        <div className="amhead"><span className="badge">APPROVAL</span><span className="ttl">write_file · <span className="pa">src/config.rs</span></span><span className="x" onClick={onClose}>✕</span></div>
        <div className="ambody">
          <div className="amlabel">Permission for this tool</div>
          <div className="permseg">
            <button className={"allow "+(perm==='allow'?'on':'')} onClick={()=>setPerm('allow')}>Allow always</button>
            <button className={"ask "+(perm==='ask'?'on':'')} onClick={()=>setPerm('ask')}>Ask each time</button>
            <button className={"deny "+(perm==='deny'?'on':'')} onClick={()=>setPerm('deny')}>Deny</button>
          </div>
          <div className="amlabel">Diff preview · src/config.rs</div>
          <div className="amdiff">
            <div className="diffline dh">@@ src/config.rs  lines 40–46 @@</div>
            <div className="diffline dc">  pub fn load_config(path: &amp;Path) -&gt; Result&lt;Config&gt; {'{'}</div>
            <div className="diffline dd">- &nbsp;&nbsp;let raw = fs::read_to_string(path).unwrap();</div>
            <div className="diffline da">+ &nbsp;&nbsp;let raw = fs::read_to_string(path)?;</div>
            <div className="diffline da">+ &nbsp;&nbsp;if raw.trim().is_empty() {'{'} return Err(ConfigError::Empty); {'}'}</div>
          </div>
          <div className="amacts">
            <button className="abtn approve" onClick={onClose}>Approve <span className="ky">Y / ⏎</span></button>
            <button className="abtn deny" onClick={onClose}>Deny <span className="ky">N / esc</span></button>
            <button className="abtn diff">Open in review <span className="ky">D</span></button>
          </div>
        </div>
      </div>
    </div>
  );
}

          </div>
        </div>
        <span className="sb-right">{view==='chat'?'⏸ 1 gate waiting · y/n':view==='review'?'2/4 staged':'supervising 4'}</span>
        {sbCfg && <div className="sbcfg" onClick={e=>e.stopPropagation()}>
          <div className="mhead">状态项 · 勾选进入滚动播报</div>
          {SB_DEFS.map(d=>(
            <div key={d[0]} className={"crow "+(sbOn[d[0]]?'':'off')} onClick={()=>setSbOn({...sbOn,[d[0]]:!sbOn[d[0]]})}>
              <span className="bx">{sbOn[d[0]]?'[×]':'[ ]'}</span>{d[1]}
            </div>
          ))}
          <div className="mfoot">顺序可拖拽 · 存入工作区配置</div>
        </div>}
      </div>
      {view==='approval' && <Approval onClose={()=>setView('chat')}/>}
      {view==='palette' && <Palette onClose={()=>setView('chat')}/>}
      {projPick && <ProjectPicker pos={projPick} curId={curLane.proj} setActive={setActive} close={()=>setProjPick(null)}/>}
    </div>
  );
}

function App(){
  const [view,setView]=useState('chat');
  const [railOpen,setRailOpen]=useState(true);
  const [termOpen,setTermOpen]=useState(false);
  const [active,setActive]=useState(0);
  const sideOpen=true;
  const SCHEMES=[['dark','Aurora','#34bdd9'],['amber','Amber','#e09a3e'],['phosphor','Phosphor','#41d97a'],['ice','Ice','#5b8def'],['mono','Mono','#9aa4ad'],['light','Light','#0c87a4']];
  const [scheme,setScheme]=useState(()=>{try{return localStorage.getItem('rc-scheme')||'dark';}catch(e){return 'dark';}});
  React.useEffect(()=>{
    document.documentElement.setAttribute('data-theme',scheme);
    try{localStorage.setItem('rc-scheme',scheme);}catch(e){}
  },[scheme]);
  const states=[
    ['chat','对话 + 标签','01',null],
    ['lanes','Lane 监控 + Subagent','02','NEW'],
    ['worktrees','并行 Worktree','03',null],
    ['review','Diff 审阅 + 提交','04',null],
    ['approval','审批弹出','05',null],
    ['palette','命令面板 ⌘K','06',null],
    ['evidence','证据区','07',null],
    ['diagnostics','诊断','08','NEW'],
  ];
  const hints={
    chat:'桌面原生:左侧线程边栏(并行会话可切换) + 中部多标签 + 可一键收起的上下文右栏。底部可唤出集成终端。转录区保持等宽。',
    lanes:'thread = lane,同一层级:左侧统一 Lanes 边栏选中哪条,这里就监控哪条。主区 = 选中 lane 的 subagent 层级树(orchestrator → planner / editor / test-runner / reviewer)+ 选中节点的实时输出、证据链接与 steer / retry 操作。',
    worktrees:'桌面相对 TUI 的最大增量:每个委派 lane 跑在隔离 git worktree,卡片显示分支 / ahead·behind / diff 统计 / 实时进度,主分支零污染。',
    review:'原生 Diff 审阅:文件树 + 行级 diff + 暂存/提交/推送,直接消化代理产出的补丁 —— TUI 里做不到的桌面级 Git 工作流。',
    approval:'权限闸门:allow / ask / deny + diff 预览,背景模糊压暗,默认焦点 Approve,Y/N 直达 —— 与 TUI 审批语义一致。',
    palette:'命令面板 ⌘K:委派任务 / 跳转 worktree / 切换权限,模糊搜索 + 键盘优先,延续 TUI 的 selector-first 血统。',
    evidence:'证据区:所有 lane 的测试结果 / diff / 审批记录 / 会话 checkpoint / 截图,按时间线可筛选;右侧详情带完整报告、输出尾巴、关联证据链接与 resume 命令 —— 「证据留痕便于恢复」的主场。',
    diagnostics:'诊断聚合:cargo / clippy / LSP / 测试失败按文件分组,每条带 lane 归属;右侧代码切片 + 上下文,可一键「Delegate fix → lane」把修复委派出去。',
  };
  return (
    <div className="pwrap">
      <div className="pkicker">交付物 B · 桌面概念稿(Tauri 类壳)· v2</div>
      <h1>不是把 TUI 装进窗口,而是<span className="ac">桌面原生的驾驶舱</span></h1>
      <p className="plead">同一套 Aurora token 与「驾驶舱 / 监督与审批」隐喻,但充分利用桌面的能力:<b>并行线程边栏</b>、<b>多标签</b>、<b>隔离 git worktree 看板</b>、<b>原生 diff 审阅 + 提交/推送</b>、<b>集成终端 dock</b>、<b>命令面板 ⌘K</b>、<b>线程弹出独立窗口</b>。转录区保留等宽终端质感,桌面层(导航/面板/按钮)用现代 UI,密度对标 <b>Linear / Zed / Codex 桌面版</b>。</p>

      <div className="dna">
        <div className="dnachip"><span className="dnaswatch" style={{background:'var(--accent)'}}></span>青 · 品牌 / 焦点</div>
        <div className="dnachip"><span className="dnaswatch" style={{background:'var(--gold)'}}></span>金 · 字标 / 工作模式</div>
        <div className="dnachip"><span className="dnaswatch" style={{background:'var(--progress)'}}></span>蓝 · 进行中</div>
        <div className="dnachip"><span className="dnaswatch" style={{background:'var(--warning)'}}></span>金黄 · 待审批</div>
        <div className="dnachip"><span className="dnaswatch" style={{background:'var(--success)'}}></span>绿 · 成功 / 已暂存</div>
        <div className="dnachip" style={{borderColor:'var(--border)'}}><span style={{fontFamily:'var(--mono)',color:'var(--fg-secondary)'}}>转录/终端/diff = 等宽 · 框架 = Inter</span></div>
      </div>

      <div style={{display:'flex',alignItems:'flex-start',gap:18,flexWrap:'wrap',justifyContent:'space-between'}}>
        <div className="switcher">
          {states.map(([k,label,idx,tag])=>(
            <button key={k} className={"swbtn "+(view===k?'on':'')} onClick={()=>setView(k)}>
              <span className="nidx">{idx}</span>{label}{tag && <span className="ntag">{tag}</span>}
            </button>
          ))}
        </div>
        <div className="schemerow" style={{paddingTop:10}}>
          <span className="lbl2">SCHEME</span>
          {SCHEMES.map(([k,label,sw])=>(
            <button key={k} className={"scbtn "+(scheme===k?'on':'')} onClick={()=>setScheme(k)}>
              <span className="dot2" style={{background:sw}}></span>{label}
            </button>
          ))}
        </div>
      </div>
      <div className="swhint">▸ {hints[view]} &nbsp;<span style={{color:'var(--fg-faint)'}}>试试窗口右上角的 ⌘ / 终端 / 面板 按钮,以及左侧 activity rail 切换视图。</span></div>

      <Win view={view} setView={setView} railOpen={railOpen} setRailOpen={setRailOpen} termOpen={termOpen} setTermOpen={setTermOpen} active={active} setActive={setActive} sideOpen={sideOpen}/>

      <AspectModes/>

      <div className="annos">
        <div className="anno"><div className="num">01 · 对话</div><h4>线程 + 标签</h4><p>左侧并行线程边栏可切换会话,中部多标签,右侧上下文栏一键收起。集成终端可从底部唤出。</p></div>
        <div className="anno"><div className="num">02 <span className="new">本轮新增</span></div><h4>Lane 监控 + Subagent 树</h4><p>thread = lane 同一层级:统一边栏选 lane,主区看 subagent 层级树、节点输出流、证据 chips、steer / retry / skip 操作。</p></div>
        <div className="anno"><div className="num">03 · 桌面增量</div><h4>Worktree 看板</h4><p>每个委派代理跑在隔离 git worktree:分支、ahead/behind、diff 统计、实时进度一览,主分支零污染。</p></div>
        <div className="anno"><div className="num">04 · 桌面增量</div><h4>Diff 审阅</h4><p>文件树 + 行级 diff + 暂存/提交/推送,直接消化代理补丁,走完整 Git 工作流。</p></div>
        <div className="anno"><div className="num">05 · 审批</div><h4>权限闸门</h4><p>阻断式弹层,allow/ask/deny + diff,背景压暗,默认焦点 Approve,键盘 Y/N 直达。</p></div>
        <div className="anno"><div className="num">06 · 键盘优先</div><h4>命令面板 ⌘K</h4><p>委派 / 跳转 worktree / 切换权限,模糊搜索、键盘优先 —— 延续 TUI 的 selector-first。</p></div>
        <div className="anno"><div className="num">07 <span className="new">本轮新增</span></div><h4>证据区 Evidence</h4><p>全 lane 事件时间线(测试/diff/审批/会话/截图)+ 详情报告与关联链接,resume 命令一键复制,支撑「可恢复」承诺。</p></div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
