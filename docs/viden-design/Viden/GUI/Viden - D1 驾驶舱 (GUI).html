<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>viden Desktop · 驾驶舱概念稿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../tokens.css">
<style>
/* 设计 Token 单一真源 → ../tokens.css(含 6 套皮肤 data-theme + border-active)。本页只用 var(--*)。 */
*{box-sizing:border-box;}
body{margin:0;background:var(--page-bg);color:var(--fg-primary);font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:background .25s;}

/* ---- page intro ---- */
.pwrap{max-width:1500px;margin:0 auto;padding:30px 26px 90px;}
.pkicker{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.pkicker::before{content:"";width:26px;height:2px;background:var(--accent);}
.ph1{font-size:38px;line-height:1.12;margin:0 0 14px;letter-spacing:-1px;font-weight:700;}
.ph1 .ac{color:var(--accent);}
.plead{font-size:16.5px;color:var(--fg-secondary);max-width:880px;margin:0 0 22px;line-height:1.6;}
.plead b{color:var(--fg-primary);font-weight:600;}
.brandtag{font-family:var(--mono);font-weight:700;}
.brandtag .r{color:var(--gold);}.brandtag .c{color:var(--accent);}

.dna{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:26px;}
.dnachip{display:flex;align-items:center;gap:8px;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:8px;padding:8px 13px;font-size:12.5px;color:var(--fg-secondary);}
.dnachip b{color:var(--fg-primary);font-weight:600;}
.dnaswatch{width:12px;height:12px;border-radius:4px;flex:none;}

.switcher{display:inline-flex;background:var(--bg-panel);border:1px solid var(--border);border-radius:11px;padding:5px;gap:3px;margin-bottom:8px;flex-wrap:wrap;}
.swbtn{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--fg-muted);background:none;border:none;cursor:pointer;padding:9px 15px;border-radius:8px;display:flex;align-items:center;gap:8px;transition:all .15s;}
.swbtn .nidx{font-family:var(--mono);font-size:10.5px;opacity:.6;}
.swbtn:hover{color:var(--fg-secondary);}
.swbtn.on{background:var(--bg-sel);color:var(--accent-bright);box-shadow:inset 0 0 0 1px var(--accent-dim);}
.swbtn.on .nidx{opacity:1;color:var(--accent);}
.swbtn .ntag{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.5px;padding:1px 5px;border-radius:4px;background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success);}
.swhint{font-size:12.5px;color:var(--fg-muted);margin:6px 0 18px;font-family:var(--mono);max-width:980px;line-height:1.5;}
.swhint .new{color:var(--success);font-weight:700;}
/* scheme chips */
.schemerow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.schemerow .lbl2{font-family:var(--mono);font-size:11px;color:var(--fg-muted);letter-spacing:1px;margin-right:3px;}
.scbtn{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--fg-muted);background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:16px;padding:5px 12px;cursor:pointer;}
.scbtn .dot2{width:9px;height:9px;border-radius:50%;}
.scbtn:hover{color:var(--fg-secondary);}
.scbtn.on{color:var(--accent-bright);background:var(--bg-sel);border-color:var(--accent-dim);}

/* ============ DESKTOP WINDOW ============ */
.win{background:var(--bg-base);border:1px solid var(--win-edge);border-radius:13px;overflow:hidden;
  box-shadow:0 40px 120px -40px rgba(0,0,0,.85),0 0 0 1px rgba(0,0,0,.4);
  height:880px;display:flex;flex-direction:column;position:relative;}
/* titlebar */
.titlebar{height:46px;flex:none;display:flex;align-items:center;gap:13px;padding:0 14px;background:var(--bg-void);border-bottom:1px solid var(--border-soft);}
.tl{display:flex;gap:8px;}
.tl i{width:12px;height:12px;border-radius:50%;display:block;}
.tl .a{background:var(--error);}.tl .b{background:var(--warning);}.tl .c{background:var(--success);}
.tbtitle{display:flex;align-items:center;gap:9px;}
.tbtitle .wm{font-family:var(--mono);font-weight:700;font-size:13.5px;}
.tbtitle .wm .r{color:var(--gold);}.tbtitle .wm .c{color:var(--accent);}
.projsel{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--fg-secondary);background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:7px;padding:4px 10px;cursor:pointer;font-family:var(--mono);}
.projsel .br{color:var(--accent);}
.gitops{display:flex;align-items:center;gap:3px;margin-left:4px;}
.gitchip{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11.5px;color:var(--fg-secondary);padding:4px 9px;border-radius:7px;cursor:pointer;}
.gitchip:hover{background:var(--bg-panel);}
.gitchip .up{color:var(--success);}.gitchip .down{color:var(--warning);}
.tbtools{margin-left:auto;display:flex;align-items:center;gap:4px;}
.tbtbtn{width:32px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--fg-muted);cursor:pointer;border:1px solid transparent;}
.tbtbtn:hover{color:var(--accent);background:var(--bg-panel);}
.tbtbtn.on{color:var(--accent-bright);background:var(--bg-sel);border-color:var(--accent-dim);}
.tbtbtn.ghost{border:1px dashed var(--border-soft);color:var(--fg-faint);}
.tbtbtn.ghost:hover{color:var(--fg-muted);background:transparent;border-color:var(--border);}
.tbdiv{width:1px;height:18px;background:var(--border-soft);margin:0 5px;flex:none;}
.tbpill{display:flex;align-items:center;gap:6px;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:7px;padding:5px 9px;font-size:11.5px;color:var(--fg-secondary);font-family:var(--mono);margin-left:6px;cursor:pointer;position:relative;}
.tbpill:hover{border-color:var(--accent-dim);}
.tbpill.open{border-color:var(--accent-dim);background:var(--bg-sel);}
.tbpill .caret{color:var(--fg-faint);font-size:9px;margin-left:1px;}
/* titlebar dropdown */
.tbmenu{position:absolute;top:calc(100% + 7px);right:0;width:264px;background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;box-shadow:0 24px 60px -18px rgba(0,0,0,.85);z-index:60;overflow:hidden;cursor:default;transform-origin:top right;animation:tbpop .15s cubic-bezier(.2,.9,.3,1.2);}
@keyframes tbpop{from{opacity:0;transform:translateY(-6px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes tbpopup{from{opacity:0;transform:translateY(6px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
.tbmenu .mhead{font-family:var(--mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--fg-muted);padding:10px 13px 6px;}
.tbmenu .mrow{display:flex;align-items:center;gap:9px;padding:8px 13px;font-family:var(--mono);font-size:12px;color:var(--fg-secondary);cursor:pointer;}
.tbmenu .mrow:hover{background:var(--bg-panel);}
.tbmenu .mrow.on{background:var(--bg-sel);box-shadow:inset 3px 0 0 var(--accent);color:var(--accent-bright);}
.tbmenu .mrow .dot3{width:7px;height:7px;border-radius:50%;flex:none;}
.tbmenu .mrow .nm3{font-weight:600;color:var(--fg-primary);flex:none;}
.tbmenu .mrow.on .nm3{color:var(--accent-bright);}
.tbmenu .mrow .meta3{margin-left:auto;font-size:10.5px;color:var(--fg-muted);flex:none;}
.tbmenu .mrow .ck3{color:var(--accent-bright);flex:none;width:10px;}
.tbmenu .mdesc{font-size:10.5px;color:var(--fg-muted);padding-left:16px;line-height:1.45;margin-top:1px;}
.tbmenu .mfoot{border-top:1px solid var(--border-soft);padding:8px 13px;font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);display:flex;align-items:center;gap:6px;}
.tbmenu .mfoot .lk{color:var(--accent);cursor:pointer;}
.tbmenu .msep{border-top:1px solid var(--border-soft);margin-top:4px;}
.tbmenu .permrow{display:block;padding:8px 13px;cursor:pointer;}
.tbmenu .permrow:hover{background:var(--bg-panel);}
.tbmenu .permrow.on{background:var(--bg-sel);box-shadow:inset 3px 0 0 var(--accent);}
.tbmenu .permrow .pr1{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;}
.tbmenu .permrow .pr1 .ic4{width:13px;text-align:center;flex:none;}
.tbmenu .permrow .pr1 .nm4{font-weight:600;color:var(--fg-primary);}
.tbmenu .permrow.on .pr1 .nm4{color:var(--accent-bright);}
.tbmenu .permrow .pr1 .ky4{margin-left:auto;font-size:10px;color:var(--fg-faint);border:1px solid var(--border-soft);border-radius:4px;padding:0 5px;}
.tbmenu .permrow .pr2{font-size:10.5px;color:var(--fg-muted);padding-left:21px;line-height:1.45;margin-top:2px;font-family:var(--mono);}
.menuveil{position:fixed;inset:0;z-index:55;}
.tbpill .lbl{color:var(--fg-muted);font-size:10px;letter-spacing:.4px;}
.tbpill b{color:var(--fg-primary);font-weight:600;}
.tbpill .dot{width:7px;height:7px;border-radius:50%;}

/* main grid */
.winbody{flex:1;display:grid;min-height:0;transition:grid-template-columns .2s ease;position:relative;}
/* edge-hover auto-reveal sidebars (focus mode) */
.edgewrap{position:absolute;top:0;bottom:0;z-index:30;}
.edgewrap.l{left:0;width:12px;}
.edgewrap.r{right:0;width:12px;}
.edgehint{position:absolute;top:50%;transform:translateY(-50%);width:4px;height:54px;border-radius:3px;background:var(--accent-dim);opacity:.6;transition:opacity .15s,background .15s;}
.edgewrap.l .edgehint{left:3px;}
.edgewrap.r .edgehint{right:3px;}
.edgewrap:hover .edgehint{opacity:1;background:var(--accent);}
.floatpanel{position:absolute;top:8px;bottom:8px;width:236px;border-radius:11px;overflow:hidden;
  box-shadow:0 30px 80px -24px rgba(0,0,0,.9),0 0 0 1px var(--border);
  transition:transform .2s ease,opacity .2s ease;will-change:transform;}
.edgewrap.l .floatpanel{left:8px;transform:translateX(-115%);opacity:0;}
.edgewrap.r .floatpanel{right:8px;transform:translateX(115%);opacity:0;}
.edgewrap:hover .floatpanel{transform:translateX(0);opacity:1;}
.floatpanel .side,.floatpanel .rail{height:100%;border:none;}
.peekcap{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:10px;color:var(--fg-faint);}
/* activity rail */
.act{background:var(--bg-void);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:5px;}
.actbtn{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--fg-muted);cursor:pointer;border:1px solid transparent;position:relative;transition:all .15s;}
.actbtn:hover{color:var(--fg-secondary);background:var(--bg-panel);}
.actbtn.on{color:var(--accent-bright);background:var(--bg-sel);border-color:var(--accent-dim);}
.actbtn.on::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--accent);}
.actbtn .badge{position:absolute;top:-2px;right:-2px;min-width:15px;height:15px;border-radius:8px;color:var(--term-screen);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;font-family:var(--mono);}
.actspacer{flex:1;}

/* thread sidebar */
.side{background:var(--bg-panel);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;overflow:hidden;min-width:0;}
/* left panel segmented toggle */
.lsegrow{flex:none;display:flex;align-items:stretch;gap:7px;margin:10px 13px 6px;}
.lseg{flex:1;display:flex;gap:3px;padding:3px;background:var(--bg-void);border:1px solid var(--border-soft);border-radius:9px;}
.lseg .sg{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;font-weight:700;color:var(--fg-muted);padding:5px 6px;border-radius:6px;cursor:pointer;}
.lseg .sg:hover{color:var(--fg-secondary);}
.lseg .sg.on{color:var(--accent-bright);background:var(--bg-sel);}
.lseg .sg .c{font-size:9.5px;color:var(--fg-faint);font-weight:600;}
.lseg .sg.on .c{color:var(--accent);}
.lsegadd{flex:none;width:34px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--fg-muted);background:var(--bg-void);border:1px solid var(--border-soft);border-radius:9px;cursor:pointer;}
.lsegadd:hover{color:var(--accent-bright);border-color:var(--accent-dim);background:var(--bg-sel);}
.lsegadd{position:relative;}
.addmenu{position:absolute;top:calc(100% + 7px);right:0;width:268px;background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;box-shadow:0 24px 60px -18px rgba(0,0,0,.85);z-index:60;overflow:hidden;cursor:default;padding:5px;animation:tbpop .15s cubic-bezier(.2,.9,.3,1.2);transform-origin:top right;}
.addmenu.fixed{position:fixed;top:auto;right:auto;}
.addmenu .amh{font-family:var(--mono);font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--fg-faint);padding:7px 9px 4px;}
.addmenu .amrow{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;}
.addmenu .amrow:hover{background:var(--bg-sel);}
.addmenu .amrow .ai{width:20px;text-align:center;font-size:13px;flex:none;}
.addmenu .amrow .at{display:flex;flex-direction:column;min-width:0;flex:1;}
.addmenu .amrow .at .n{font-size:12px;color:var(--fg-primary);font-weight:600;}
.addmenu .amrow .at .s{font-family:var(--mono);font-size:9.5px;color:var(--fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.addmenu .amrow .vb{font-family:var(--mono);font-size:8.5px;font-weight:700;border:1px solid;border-radius:4px;padding:1px 4px;flex:none;}
.addmenu .amsep{height:1px;background:var(--border-soft);margin:4px 6px;}
.addmenu .amfoot{display:flex;align-items:center;gap:6px;padding:7px 9px 5px;font-family:var(--mono);font-size:10px;color:var(--fg-faint);cursor:pointer;}
.addmenu .amfoot:hover{color:var(--accent);}
/* workspace explorer */
.wsroot{flex:none;display:flex;align-items:center;gap:8px;padding:9px 13px 7px;}
.wsroot .ic{color:var(--gold);font-size:13px;}
.wsroot .nm{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--fg-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.wsroot .tag{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--fg-faint);border:1px solid var(--border-soft);border-radius:4px;padding:1px 5px;}
.wstree{overflow-y:auto;flex:1;padding:0 8px 6px;}
.wsscroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.wsproj .wsroot{cursor:pointer;border-radius:6px;}
.wsproj .wsroot:hover{background:var(--bg-base);}
.wsproj .wstree{flex:none;overflow:visible;}
.wsaddproj{margin:4px 13px 2px;font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);cursor:pointer;padding:5px 8px;border:1px dashed var(--border-soft);border-radius:7px;}
.wsaddproj:hover{color:var(--accent);border-color:var(--accent-dim);}
.wsrow{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;padding:3px 6px;border-radius:5px;color:var(--fg-secondary);white-space:nowrap;cursor:pointer;}
.wsrow:hover{background:var(--bg-base);}
.wsrow.dir{color:var(--fg-muted);font-weight:600;}
.wsrow .tw{color:var(--fg-faint);width:9px;flex:none;}
.wsrow .ico{flex:none;opacity:.85;}
.wsrow.dir .ico{color:var(--accent);}
.wsrow .bdg{margin-left:auto;font-size:9px;padding:0 4px;border-radius:4px;border:1px solid;flex:none;}
.wsrow .bdg.m{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent);}
.wsrow .bdg.a{color:var(--success);border-color:color-mix(in srgb,var(--success) 40%,transparent);}
.sidehead{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 13px 8px;}
.sidehead h3{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--accent);font-weight:700;}
.sidenew{font-family:var(--mono);font-size:11px;color:var(--fg-secondary);border:1px solid var(--border-soft);border-radius:6px;padding:3px 8px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.sidenew:hover{border-color:var(--accent-dim);color:var(--accent);}
.pinbtn{font-size:13px;cursor:pointer;color:var(--fg-muted);width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--border-soft);}
.pinbtn:hover{color:var(--accent);border-color:var(--accent-dim);}
.thread .tm .viab{border:1px solid;border-radius:4px;padding:0 4px;font-size:9px;font-weight:700;letter-spacing:.3px;}
/* left resize handle (pinned mode) */
.lresize{position:absolute;top:0;bottom:0;width:5px;z-index:24;cursor:col-resize;}
.lresize:hover,.lresize.drag{background:var(--accent-dim);}
.threadlist{flex:1;overflow-y:auto;padding:0 8px;}
.thread{padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:3px;border:1px solid transparent;}
.thread:hover{background:var(--bg-base);}
.thread.on{background:var(--bg-sel);border-color:var(--accent-dim);}
.thread .tt{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-primary);font-weight:500;}
.thread.on .tt{color:var(--accent-bright);}
.thread .st{width:7px;height:7px;border-radius:50%;flex:none;}
.thread .tm{font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);margin-top:3px;padding-left:15px;display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden;}
.thread .tm > span{overflow:hidden;text-overflow:ellipsis;}
.thread .tm .viab{flex:none;}
.thread .tm .br{color:var(--accent);flex:none;}
.thread .tt .twirl{font-size:9px;color:var(--fg-faint);width:11px;flex:none;transition:transform .12s;cursor:pointer;display:inline-block;}
.thread .tt .twirl.open{transform:rotate(90deg);color:var(--accent);}
.thsubs{margin:-1px 6px 5px 22px;padding:4px 0 4px 9px;border-left:1px solid var(--border-soft);display:flex;flex-direction:column;gap:1px;}
.thsub{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:5px;color:var(--fg-secondary);white-space:nowrap;cursor:pointer;}
.thsub:hover{background:var(--bg-base);}
.thsub .g{color:var(--fg-faint);flex:none;}
.thsub .ic{flex:none;}
.thsub .nm{overflow:hidden;text-overflow:ellipsis;}
.thsub .meta{margin-left:auto;color:var(--fg-faint);font-size:9.5px;flex:none;}
.sidesection{flex:none;padding:11px 13px 6px;border-top:1px solid var(--border-soft);margin-top:6px;display:flex;align-items:center;justify-content:space-between;}
.sidesection h3{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--fg-muted);font-weight:700;}
.wtmini{padding:0 8px 10px;overflow:hidden;}
.wtrow{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:7px;font-family:var(--mono);font-size:11px;cursor:pointer;}
.wtrow:hover{background:var(--bg-base);}
.wtrow .br{color:var(--accent);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wtrow .ab{color:var(--fg-muted);}
/* workspace · lane org (global lanes + per-project lanes) */
.wsglobal{padding-top:2px;}
.wsghd{display:flex;align-items:center;gap:8px;padding:9px 13px 4px;}
.wsghd .ic{color:var(--accent);font-size:11px;}
.wsghd .t{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--fg-primary);white-space:nowrap;flex:none;}
.wsghd .sub{font-family:var(--mono);font-size:9px;color:var(--fg-faint);}
.wsghd .ct{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--accent);border:1px solid var(--accent-dim);border-radius:4px;padding:1px 5px;}
.wsghadd{flex:none;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;color:var(--fg-muted);border:1px solid var(--border-soft);border-radius:5px;cursor:pointer;}
.wsghadd:hover{color:var(--accent-bright);border-color:var(--accent-dim);background:var(--bg-sel);}
.wsseclabel{font-family:var(--mono);font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--fg-muted);font-weight:700;padding:10px 13px 4px;border-top:1px solid var(--border-soft);margin-top:6px;}
.wsroot .lct{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--fg-muted);border:1px solid var(--border-soft);border-radius:4px;padding:1px 5px;flex:none;white-space:nowrap;}
.wsroot .lct.z{color:var(--fg-faint);}
.wslanes{margin:1px 8px 5px 8px;padding:3px 0;display:flex;flex-direction:column;gap:2px;}
.wslanes.glob{margin-left:8px;}
.wslane{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;border:1px solid transparent;}
.wslane .aico{flex:none;line-height:1;margin-top:1px;width:17px;height:17px;display:flex;align-items:center;justify-content:center;}
.wslane .aico svg{width:17px;height:17px;display:block;}
.wslane .lbody{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;}
.wslane:hover{background:var(--bg-base);}
.wslane.on{background:var(--bg-sel);box-shadow:inset 3px 0 0 var(--accent);}
.wslane.s-work{border-color:color-mix(in srgb,var(--progress) 60%,transparent);}
.wslane.s-done{border-color:color-mix(in srgb,var(--success) 55%,transparent);}
.wslane.s-stop{border-color:color-mix(in srgb,var(--error) 60%,transparent);}
.wslane.s-need{border-color:var(--gold);animation:lpulse 1.3s ease-in-out infinite;}
@keyframes lpulse{0%,100%{border-color:color-mix(in srgb,var(--gold) 35%,transparent);box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 40%,transparent);}50%{border-color:var(--gold-bright);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 0%,transparent);}}
.wslane.s-need.on{box-shadow:inset 3px 0 0 var(--accent);}
.wslane .r1{display:flex;align-items:center;gap:7px;min-width:0;}
.wslane .r2{display:flex;align-items:center;gap:7px;min-width:0;}
.wslane .st{width:7px;height:7px;border-radius:50%;flex:none;}
.wslane .lid{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--accent);flex:none;}
.wslane .nm{font-size:11.5px;color:var(--fg-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
.wslane.on .nm{color:var(--accent-bright);}
.wslane .pct{margin-left:auto;font-family:var(--mono);font-size:9.5px;flex:none;color:var(--fg-muted);}
.wslane .viab{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.3px;border:1px solid;border-radius:3px;padding:0 3px;flex:none;}
.wslane .cli{font-family:var(--mono);font-size:9.5px;color:var(--fg-secondary);flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wslane .br{font-family:var(--mono);font-size:9.5px;color:var(--fg-muted);flex:none;margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wsempty{font-family:var(--mono);font-size:10px;color:var(--fg-faint);padding:4px 6px;}
.wsempty .add{color:var(--fg-muted);cursor:pointer;}
.wsempty .add:hover{color:var(--accent);}

/* new-lane quick composer */
.nlveil{position:absolute;top:0;left:0;width:100%;height:100%;z-index:90;}
.nlpop{position:absolute;z-index:91;width:326px;background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;box-shadow:0 28px 70px -20px rgba(0,0,0,.88),0 0 0 1px rgba(0,0,0,.4);overflow:hidden;animation:tbpop .14s ease;}
.nlpop .nlhd{display:flex;align-items:center;gap:9px;padding:12px 13px 10px;border-bottom:1px solid var(--border-soft);}
.nlpop .nlhd .ti{font-size:13px;font-weight:600;color:var(--fg-primary);}
.nlpop .nlhd .sc{font-family:var(--mono);font-size:9.5px;color:var(--accent);border:1px solid var(--accent-dim);border-radius:5px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
.nlpop .nlhd .x{margin-left:auto;color:var(--fg-faint);cursor:pointer;font-size:12px;}
.nlpop .nlhd .x:hover{color:var(--fg-secondary);}
.nlpop .nlsec{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--fg-muted);font-weight:700;padding:11px 13px 5px;}
.nlagents{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 13px;}
.nlagent{display:flex;align-items:center;gap:7px;padding:7px 8px;border:1px solid var(--border-soft);border-radius:8px;cursor:pointer;min-width:0;}
.nlagent:hover{background:var(--bg-base);}
.nlagent.on{border-color:var(--accent);background:var(--bg-sel);box-shadow:inset 0 0 0 1px var(--accent-dim);}
.nlagent .lg{width:16px;height:16px;flex:none;display:flex;}
.nlagent .lg svg{width:16px;height:16px;}
.nlagent .nm{font-size:11px;color:var(--fg-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
.nlagent .vb{font-family:var(--mono);font-size:7.5px;font-weight:700;letter-spacing:.3px;border:1px solid;border-radius:3px;padding:0 3px;flex:none;}
.nltask{margin:0 13px;width:calc(100% - 26px);box-sizing:border-box;background:var(--bg-void);border:1px solid var(--border-soft);border-radius:8px;color:var(--fg-primary);font-family:var(--font-sans,inherit);font-size:12px;line-height:1.5;padding:8px 10px;resize:none;height:54px;outline:none;}
.nltask:focus{border-color:var(--accent-dim);}
.nltask::placeholder{color:var(--fg-faint);}
.nlmeta{display:flex;gap:8px;padding:9px 13px 4px;font-family:var(--mono);font-size:10px;}
.nlmeta .bw{color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nlmeta .tg{margin-left:auto;color:var(--fg-muted);cursor:pointer;flex:none;}
.nlmeta .tg:hover{color:var(--fg-secondary);}
.nlfoot{display:flex;align-items:center;padding:10px 13px 12px;}
.nlfoot .full{font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);cursor:pointer;}
.nlfoot .full:hover{color:var(--accent);}
.nlfoot .create{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--bg-void);background:var(--accent);border:none;border-radius:7px;padding:6px 12px;cursor:pointer;}
.nlfoot .create:hover{background:var(--accent-bright);}
.nlfoot .create .kbd{font-family:var(--mono);font-size:10px;opacity:.7;}

/* project picker */
.ppick{position:absolute;z-index:91;display:flex;flex-direction:column;width:272px;background:var(--bg-elev);border:1px solid var(--border);border-radius:11px;box-shadow:0 28px 70px -20px rgba(0,0,0,.88),0 0 0 1px rgba(0,0,0,.4);overflow:hidden;animation:tbpop .14s ease;}
.ppcol{padding:6px 8px 7px;display:flex;flex-direction:column;gap:2px;}
.ppcol.mid{border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);background:var(--bg-panel);}
.ppch{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--fg-muted);font-weight:700;padding:3px 6px 4px;display:flex;align-items:center;gap:6px;}
.ppch .ct{color:var(--accent);border:1px solid var(--accent-dim);border-radius:4px;padding:0 5px;font-size:8.5px;}
.ppadd{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;cursor:pointer;border:1px dashed var(--border-soft);}
.ppadd:hover{border-color:var(--accent-dim);background:var(--bg-base);}
.ppadd .i{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--accent);}
.ppadd .tx,.pprow .tx{display:flex;flex-direction:column;min-width:0;flex:1;}
.ppadd .n{font-size:11.5px;color:var(--fg-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ppadd .s{font-family:var(--mono);font-size:9px;color:var(--fg-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pprow{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:7px;cursor:pointer;border:1px solid transparent;}
.pprow:hover{background:var(--bg-base);}
.pprow.on{background:var(--bg-sel);border-color:var(--accent-dim);}
.pprow .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;}
.pprow.on .dot{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent);}
.pprow .n{font-size:11.5px;color:var(--fg-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pprow.on .n{color:var(--accent-bright);}
.pprow .s{font-family:var(--mono);font-size:9px;color:var(--fg-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pprow .lc{font-family:var(--mono);font-size:9px;color:var(--fg-muted);flex:none;}
.pprow .when{font-family:var(--mono);font-size:9px;color:var(--fg-faint);flex:none;}
.pprow.rec .n{color:var(--fg-secondary);}

/* center */
.center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-base);}
/* tab strip */
.tabstrip{flex:none;display:flex;align-items:stretch;background:var(--bg-void);border-bottom:1px solid var(--border-soft);height:38px;overflow:hidden;}
.tab{display:flex;align-items:center;gap:8px;padding:0 14px;font-size:12.5px;color:var(--fg-muted);border-right:1px solid var(--border-soft);cursor:pointer;white-space:nowrap;position:relative;}
.tab:hover{color:var(--fg-secondary);background:var(--bg-base);}
.tab.on{color:var(--fg-primary);background:var(--bg-base);}
.tab.on::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent);}
.tab .st{width:7px;height:7px;border-radius:50%;flex:none;}
.tab .x{color:var(--fg-faint);font-size:13px;}
.tab .x:hover{color:var(--error);}
.tabadd{display:flex;align-items:center;padding:0 12px;color:var(--fg-muted);cursor:pointer;font-size:16px;}
.tabadd:hover{color:var(--accent);}
.tabspacer{flex:1;border-right:none;}
.tabmeta{display:flex;align-items:center;gap:9px;padding:0 13px;font-family:var(--mono);font-size:11px;color:var(--fg-muted);}
/* lane context bar (a lane IS one session — no session tabs) */
.lanebar{align-items:center;gap:0;padding:0 0 0 16px;}
.lanehd{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--fg-primary);min-width:0;}
.lanehd .st{width:7px;height:7px;border-radius:50%;flex:none;}
.lanehd .lid{font-family:var(--mono);color:var(--accent);font-weight:700;letter-spacing:.3px;}
.lanehd .lnm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:40px;}
.lanehd .lbr{font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);background:var(--bg-base);border:1px solid var(--border-soft);border-radius:5px;padding:1px 7px;flex:0 4 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lanehd .lscope{font-family:var(--mono);font-size:10px;color:var(--fg-faint);flex:0 6 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lanehd .lscope b{color:var(--fg-muted);font-weight:600;}

.coscroll{flex:1;overflow:hidden;padding:16px 18px;position:relative;}

/* transcript */
.msg{margin-bottom:15px;font-family:var(--mono);font-size:12.5px;line-height:1.6;}
.msg .who{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-weight:700;letter-spacing:.5px;font-size:11px;}
.who .av{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;flex:none;}
.msg.user .who{color:var(--accent);}
.msg.user .av{background:var(--accent-dim);color:var(--accent-bright);}
.msg.bot .who{color:var(--gold);}
.msg.bot .av{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);}
.msg .body{color:var(--fg-primary);padding-left:26px;}
.msg.bot .body{color:var(--fg-secondary);}
.msg .body code{color:var(--accent);}
.tool{margin:0 0 15px 26px;border:1px solid var(--border-soft);border-radius:9px;overflow:hidden;background:var(--bg-panel);font-family:var(--mono);}
.tool .th{display:flex;align-items:center;gap:9px;padding:8px 12px;font-size:11.5px;background:var(--bg-void);border-bottom:1px solid var(--border-soft);}
.tool .th .nm{color:var(--accent);font-weight:600;}
.tool .th .pa{color:var(--fg-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tool .th .gate{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:600;flex:none;}
.tool .tb{padding:9px 12px;font-size:12px;}
.diffline{font-size:11.5px;line-height:1.55;white-space:pre;font-family:var(--mono);}
.da{color:var(--success);}.dd{color:var(--error);}.dc{color:var(--fg-muted);}.dh{color:var(--accent);}
.testrow{display:flex;gap:8px;font-size:12px;line-height:1.7;}
.testrow .k{color:var(--fg-muted);min-width:62px;}
.livebar{margin:0 0 15px 26px;border:1px solid var(--accent-dim);border-radius:9px;background:color-mix(in srgb,var(--accent) 7%,var(--bg-base));padding:10px 13px;font-family:var(--mono);}
.livebar .lh{display:flex;align-items:center;gap:8px;color:var(--accent-bright);font-weight:700;font-size:11px;letter-spacing:1px;}
.livebar .lm{color:var(--accent);font-weight:600;font-size:12.5px;margin-top:4px;}
.livebar .lm .pulse{color:var(--progress);}
.livebar .ls{color:var(--fg-muted);font-size:11.5px;margin-top:2px;}
.pulsedot{width:8px;height:8px;border-radius:50%;background:var(--progress);box-shadow:0 0 0 0 var(--progress);animation:pp 1.6s infinite;flex:none;}
@keyframes pp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--progress) 50%,transparent);}70%{box-shadow:0 0 0 7px color-mix(in srgb,var(--progress) 0%,transparent);}100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--progress) 0%,transparent);}}

/* composer */
.composer{flex:none;border-top:1px solid var(--border-soft);background:var(--bg-panel);padding:12px 16px;}
.cbox{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:9px;background:var(--bg-base);padding:11px 13px;}
.cbox .pr{color:var(--accent);font-family:var(--mono);}
.cbox .txt{color:var(--fg-muted);font-family:var(--mono);font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cbox .send{background:var(--accent);color:#04141a;border:none;border-radius:7px;padding:7px 14px;font-weight:700;font-size:12.5px;font-family:var(--mono);cursor:pointer;flex:none;}
.cmeta{display:flex;gap:10px;margin-top:9px;align-items:center;}
.cmeta .mpill{position:relative;}
.tbmenu.up{top:auto;bottom:calc(100% + 8px);right:auto;left:0;transform-origin:bottom left;animation:tbpopup .15s cubic-bezier(.2,.9,.3,1.2);}
.mpill{font-family:var(--mono);font-size:11.5px;border:1px solid var(--border-soft);border-radius:6px;padding:3px 9px;color:var(--gold);display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;}
.mpill.perm{color:var(--warning);}
.mpill.go{color:var(--accent);border-color:var(--accent-dim);}
.cmeta .hint{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--fg-faint);white-space:nowrap;}
kbd{font-family:var(--mono);font-size:10.5px;background:var(--bg-void);border:1px solid var(--border-soft);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--fg-secondary);}

/* right context rail */
.rail{background:var(--bg-panel);border-left:1px solid var(--border-soft);overflow:hidden;display:flex;flex-direction:column;min-width:0;}
/* tabbed dock (Codex-style multi-panel) */
.rail.dock{padding:0;}
.docktabs{flex:none;display:flex;align-items:center;gap:1px;background:var(--bg-void);border-bottom:1px solid var(--border-soft);padding:0 4px;height:32px;position:relative;}
.dtablist{display:flex;align-items:center;gap:1px;overflow-x:auto;min-width:0;flex:1;}
.dtablist::-webkit-scrollbar{display:none;}
.docktabs::-webkit-scrollbar{display:none;}
.dtab{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--fg-muted);padding:6px 8px 6px 10px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;}
.dtab .x{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:4px;font-size:11px;color:var(--fg-faint);opacity:0;}
.dtab:hover .x{opacity:1;}
.dtab .x:hover{background:var(--bg-sel);color:var(--fg-primary);}
.dtab:hover{color:var(--fg-secondary);}
.dtab.on{color:var(--accent-bright);border-bottom-color:var(--accent);}
.dtadd{position:relative;color:var(--fg-faint);cursor:pointer;padding:0 8px;font-size:14px;}
.dtaddmenu{position:absolute;top:calc(100% + 6px);right:0;width:228px;background:var(--bg-elev);border:1px solid var(--border);border-radius:9px;box-shadow:0 18px 44px -16px rgba(0,0,0,.8);z-index:60;padding:4px;animation:tbpop .14s ease;}
.dtaddmenu .amh,.sdsummon .amh{font-family:var(--mono);font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:var(--fg-faint);padding:6px 9px 3px;}
.dtaddmenu .ar,.sdsummon .ar{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11.5px;color:var(--fg-secondary);padding:6px 9px;border-radius:6px;cursor:pointer;}
.dtaddmenu .ar:hover,.sdsummon .ar:hover{background:var(--bg-sel);color:var(--accent-bright);}
.dtaddmenu .ar.open,.sdsummon .ar.open{opacity:.55;}
.dtaddmenu .ar .ti,.sdsummon .ar .ti{width:16px;text-align:center;flex:none;color:var(--accent);display:grid;place-items:center;}
.dtaddmenu .ar .tt2,.sdsummon .ar .tt2{flex:1;min-width:0;display:flex;flex-direction:column;}
.dtaddmenu .ar .tt2 .n,.sdsummon .ar .tt2 .n{color:var(--fg-primary);}
.dtaddmenu .ar .tt2 .s,.sdsummon .ar .tt2 .s{font-size:9px;color:var(--fg-faint);}
.dtaddmenu .ar .ak,.sdsummon .ar .ak{flex:none;}
.dtadd:hover{color:var(--accent);}
.dockbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:11px 13px;font-family:var(--mono);}
.dkh{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:700;display:flex;justify-content:space-between;margin-bottom:8px;white-space:nowrap;}
.dkh .ct{color:var(--fg-muted);letter-spacing:0;font-weight:600;}
.dkmeta{font-size:10px;color:var(--fg-muted);margin-top:4px;}
.dkbar{height:4px;border-radius:2px;background:var(--bg-void);overflow:hidden;border:1px solid var(--border-soft);}
.dkbar i{display:block;height:100%;background:var(--progress);}
.dkactrow{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.dkbtn{font-size:10.5px;font-weight:600;border:1px solid var(--border-soft);border-radius:6px;padding:4px 9px;color:var(--fg-secondary);cursor:pointer;}
.dkbtn.go{border-color:var(--accent-dim);color:var(--accent);}
/* files */
.ftree .fr{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:3px 4px;color:var(--fg-secondary);white-space:nowrap;overflow:hidden;border-radius:5px;cursor:pointer;}
.ftree .fr:hover{background:var(--bg-base);}
.ftree .fr.dir{color:var(--fg-muted);font-weight:600;}
.ftree .fr .g{width:12px;text-align:center;flex:none;font-weight:700;}
.ftree .fr.m .g{color:var(--gold);}.ftree .fr.a .g{color:var(--success);}
.ftree .fr .pm{margin-left:auto;font-size:9.5px;color:var(--fg-faint);}
/* subagents */
.subtree{font-size:11px;line-height:1.7;color:var(--fg-secondary);white-space:pre;overflow:hidden;background:var(--bg-base);border:1px solid var(--border-soft);border-radius:7px;padding:8px 10px;}
/* environment composite panel */
.envp{font-family:var(--font-sans,inherit);}
.envsec{padding:2px 0 12px;}
.envsec + .envsec{border-top:1px solid var(--border-soft);padding-top:13px;}
.envhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;cursor:pointer;user-select:none;}
.envhd .t{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--fg-muted);letter-spacing:.2px;}
.envhd .caret{font-size:10px;color:var(--fg-faint);transition:transform .15s ease;display:inline-block;}
.envhd.collapsed .caret{transform:rotate(-90deg);}
.envhd .acts{display:flex;align-items:center;gap:2px;}
.envhd .gear{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--fg-muted);cursor:pointer;}
.envhd .gear:hover{background:var(--bg-sel);color:var(--fg-primary);}
.envrow{display:flex;align-items:center;gap:11px;padding:6px 4px;border-radius:7px;color:var(--fg-primary);font-size:13.5px;cursor:pointer;}
.envrow:hover{background:var(--bg-base);}
.envrow .ei{width:20px;flex:none;display:grid;place-items:center;color:var(--fg-secondary);}
.envrow .el{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.envrow .cv{color:var(--fg-muted);flex:none;}
.envrow.muted{color:var(--fg-faint);cursor:default;}
.envrow.muted:hover{background:transparent;}
.envrow.muted .ei{color:var(--fg-faint);}
.envrow .stat{flex:none;font-family:var(--font-mono,monospace);font-size:12.5px;}
.envrow .stat .ad{color:var(--success);}
.envrow .stat .rm{color:var(--error);margin-left:5px;}
.envrow.sub.on{background:var(--bg-sel);box-shadow:inset 2px 0 0 var(--accent);}
/* context / mcp / todo */
.envctx{padding:2px 4px 0;font-family:var(--font-mono,monospace);}
.envctx .big{font-size:15px;color:var(--fg-primary);font-weight:600;}
.envctx .sub2{font-size:11px;color:var(--fg-muted);margin-top:2px;display:flex;gap:8px;}
.envctx .bar{height:4px;border-radius:2px;background:var(--bg-void);overflow:hidden;border:1px solid var(--border-soft);margin:7px 0 3px;}
.envctx .bar i{display:block;height:100%;background:var(--accent);}
.mcprow{display:flex;align-items:center;gap:9px;padding:4px 4px;font-size:12.5px;color:var(--fg-primary);}
.mcprow .dot{width:7px;height:7px;border-radius:50%;flex:none;}
.mcprow .st{margin-left:auto;font-family:var(--font-mono,monospace);font-size:10px;color:var(--fg-faint);}
.lspnote{padding:3px 4px;font-family:var(--font-mono,monospace);font-size:11px;color:var(--fg-muted);}
.todorow{display:flex;align-items:flex-start;gap:9px;padding:5px 4px;font-size:12.5px;color:var(--fg-secondary);line-height:1.45;}
.todorow .ck{flex:none;width:15px;height:15px;margin-top:1px;display:grid;place-items:center;border-radius:4px;border:1px solid var(--border);font-size:10px;}
.todorow.done{color:var(--fg-muted);}
.todorow.done .ck{color:var(--success);border-color:color-mix(in srgb,var(--success) 45%,transparent);}
.todorow.active{color:var(--gold-bright);}
.todorow.active .ck{color:var(--gold);border-color:var(--gold);}
.envfoot{margin-top:6px;padding:9px 4px 2px;border-top:1px solid var(--border-soft);font-family:var(--font-mono,monospace);font-size:10.5px;color:var(--fg-faint);line-height:1.7;}
.envfoot .br{color:var(--accent);}
.robo{width:22px;height:22px;flex:none;}
/* inspector / editor split pane */
.centerwrap{display:flex;min-width:0;min-height:0;overflow:hidden;}
.inspector{flex:none;max-width:56%;background:var(--bg-panel);border-left:1px solid var(--border-soft);display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.centerwrap > .center{flex:1;min-width:120px;}
.inshd{flex:none;height:34px;display:flex;align-items:center;gap:8px;padding:0 8px 0 11px;border-bottom:1px solid var(--border-soft);background:var(--bg-void);}
.inshd .nm{font-family:var(--mono);font-size:12px;color:var(--fg-primary);font-weight:600;display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;}
.inshd .nm .el{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.inshd .badge{font-family:var(--mono);font-size:9.5px;font-weight:700;border:1px solid;border-radius:4px;padding:0 5px;flex:none;}
.inshd .x{margin-left:auto;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--fg-muted);cursor:pointer;flex:none;}
.inshd .x:hover{background:var(--bg-sel);color:var(--fg-primary);}
.inssub{flex:none;display:flex;gap:3px;padding:5px 8px;border-bottom:1px solid var(--border-soft);background:var(--bg-base);}
.instab{font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);padding:3px 9px;border-radius:5px;cursor:pointer;}
.instab.on{color:var(--accent-bright);background:var(--bg-sel);}
.insbody{flex:1;overflow:auto;padding:11px 13px;font-family:var(--mono);}
.insbody .saout{background:var(--bg-base);border:1px solid var(--border-soft);border-radius:7px;padding:9px 11px;font-size:11.5px;line-height:1.65;}
.insbody .dkh{margin-top:11px;}
/* lanes tab */
.dklane{border:1px solid var(--border-soft);border-radius:7px;padding:7px 9px;margin-bottom:6px;background:var(--bg-base);}
.dklane .r1{display:flex;align-items:center;gap:7px;font-size:11px;white-space:nowrap;overflow:hidden;}
.dklane .r1 .lid{color:var(--accent);font-weight:700;}
.dklane .r1 .nm{color:var(--fg-primary);font-weight:600;}
.dklane .r1 .via{font-size:9px;font-weight:700;}
.dklane .r1 .st2{font-size:10px;}
.dklane .r2{font-size:9.5px;color:var(--fg-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* terminal */
.dktermtabs{display:flex;gap:3px;margin-bottom:7px;}
.dktermtabs .tt{font-size:10px;padding:2px 8px;border-radius:5px;color:var(--fg-muted);cursor:pointer;}
.dktermtabs .tt.on{background:var(--bg-sel);color:var(--accent);}
.dktermbody{background:var(--bg-void);border:1px solid var(--border-soft);border-radius:7px;padding:8px 10px;font-size:10.5px;line-height:1.6;overflow:hidden;}
.dktermbody div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dktermbody .gp{color:var(--success);}.dktermbody .cp{color:var(--accent);}.dktermbody .yp{color:var(--gold);}.dktermbody .rp{color:var(--error);}.dktermbody .dim{color:var(--fg-muted);}
.curs{display:inline-block;width:6px;height:12px;background:var(--accent-bright);vertical-align:-2px;animation:blink 1.1s steps(1) infinite;}
/* code / diff */
.codebody{font-size:10.5px;line-height:1.65;background:var(--bg-base);border:1px solid var(--border-soft);border-radius:7px;padding:7px 0;overflow:hidden;}
.codebody .cl{display:flex;white-space:nowrap;overflow:hidden;padding:0 8px;color:var(--fg-secondary);}
.codebody .cl .ln{width:24px;flex:none;color:var(--fg-faint);text-align:right;padding-right:8px;}
.codebody .cl .kw{color:var(--accent);}
.codebody .cl.add{background:color-mix(in srgb,var(--success) 9%,transparent);}.codebody .cl.del{background:color-mix(in srgb,var(--error) 9%,transparent);}
.codebody .cl.hk{background:var(--bg-void);color:var(--accent);}
.codebody .gp{color:var(--success);}.codebody .rp{color:var(--error);}
/* docs */
.docbody{font-size:11px;line-height:1.6;color:var(--fg-secondary);}
.docbody .h1{color:var(--accent);font-weight:700;margin-bottom:6px;}
.docbody .p{color:var(--fg-muted);margin-bottom:7px;}
.docbody .li{color:var(--fg-secondary);padding-left:4px;margin-bottom:3px;}
.rpanel{border-bottom:1px solid var(--border-soft);padding:13px 15px;}
.rpanel h3{margin:0 0 10px;font-size:10.5px;font-family:var(--mono);letter-spacing:.9px;text-transform:uppercase;color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;}
.rpanel h3 .ct{color:var(--fg-muted);font-weight:600;flex:none;}
.rkv{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-family:var(--mono);padding:2.5px 0;white-space:nowrap;align-items:baseline;}
.rkv .k{color:var(--fg-secondary);flex:none;}
.rkv .v{color:var(--fg-primary);flex:1;min-width:0;text-align:right;overflow:hidden;text-overflow:ellipsis;}
.rkv .v.dim{color:var(--fg-muted);}
.rtask{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;padding:4px 0;white-space:nowrap;}
.rtask .ic{font-size:11px;flex:none;}
.rtask .nm{color:var(--accent);flex:none;}
.rtask .ds{color:var(--fg-muted);overflow:hidden;text-overflow:ellipsis;}
.evid{font-family:var(--mono);font-size:11px;padding:6px 0;border-bottom:1px dashed var(--border-soft);}
.evid:last-child{border:none;}
.evid .et{display:flex;gap:7px;align-items:center;color:var(--fg-secondary);}
.evid .ed{color:var(--fg-muted);padding-left:18px;font-size:10.5px;margin-top:2px;}

/* ===== WORKTREE BOARD ===== */
.wtwrap{padding:16px 18px;overflow:hidden;height:100%;}
.wtbar{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
.wtbar h2{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px;}
.wtbar .sub{font-family:var(--mono);font-size:11.5px;color:var(--fg-muted);}
.wtbar .right{margin-left:auto;display:flex;gap:8px;}
.wtgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;}
.wtcard{border:1px solid var(--border-soft);border-radius:11px;background:var(--bg-panel);overflow:hidden;display:flex;flex-direction:column;}
.wtcard.live{border-color:var(--accent-dim);box-shadow:0 0 0 1px var(--accent-dim);}
.wtcard.attn{border-color:color-mix(in srgb,var(--warning) 55%,transparent);}
.wth{padding:11px 13px;border-bottom:1px solid var(--border-soft);background:var(--bg-void);}
.wth .top{display:flex;align-items:center;gap:8px;}
.wth .br{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.statechip{flex:none;font-family:var(--mono);font-size:10.5px;font-weight:600;display:flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.statechip.run{color:var(--progress);background:color-mix(in srgb,var(--progress) 12%,transparent);}
.statechip.wait{color:var(--warning);background:color-mix(in srgb,var(--warning) 12%,transparent);}
.statechip.done{color:var(--success);background:color-mix(in srgb,var(--success) 12%,transparent);}
.wth .agent{display:flex;align-items:center;gap:7px;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--fg-secondary);}
.wth .agent .lane{color:var(--accent);font-weight:700;flex:none;letter-spacing:.3px;}
.wth .agent .dot{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--bg-void);}
.wth .agent .sep{color:var(--fg-faint);}
.wth .agent .delta{display:flex;gap:7px;margin-left:auto;}
.wth .agent .up{color:var(--success);}.wth .agent .dn{color:var(--warning);}
.wtb{padding:11px 13px;flex:1;display:flex;flex-direction:column;gap:9px;min-height:0;}
.wttask{font-size:12px;color:var(--fg-secondary);line-height:1.5;}
.wttask b{color:var(--fg-primary);font-weight:600;}
.wtprog{display:flex;align-items:center;gap:9px;}
.wtprog .bar{flex:1;height:5px;border-radius:3px;background:var(--bg-void);overflow:hidden;border:1px solid var(--border-soft);}
.wtprog .bar i{display:block;height:100%;background:var(--progress);}
.wtprog .pct{font-family:var(--mono);font-size:11px;color:var(--progress);font-weight:600;}
.wtdiffstat{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;background:var(--bg-void);border:1px solid var(--border-soft);border-radius:7px;padding:7px 10px;}
.wtdiffstat .f{color:var(--fg-secondary);}
.wtdiffstat .pls{color:var(--success);}.wtdiffstat .mns{color:var(--error);}
.wtdiffstat .barbits{display:flex;gap:2px;margin-left:auto;}
.wtdiffstat .barbits i{width:5px;height:9px;border-radius:1px;}
.wtactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;}
.wtbtn{font-family:var(--mono);font-size:11px;font-weight:600;border-radius:6px;padding:5px 11px;border:1px solid var(--border-soft);background:var(--bg-base);color:var(--fg-secondary);cursor:pointer;}
.wtbtn.go{border-color:var(--accent-dim);color:var(--accent);}
.wtbtn.merge{border-color:color-mix(in srgb,var(--success) 50%,transparent);color:var(--success);}
.wtcard.add{border-style:dashed;align-items:center;justify-content:center;color:var(--fg-muted);cursor:pointer;min-height:220px;display:flex;font-family:var(--mono);font-size:12.5px;gap:8px;}
.wtcard.add:hover{color:var(--accent);border-color:var(--accent-dim);}

/* ===== DIFF REVIEW ===== */
.review{display:grid;grid-template-columns:236px 1fr;height:100%;min-height:0;}
.filetree{border-right:1px solid var(--border-soft);overflow:hidden;display:flex;flex-direction:column;background:var(--bg-panel);}
.fthead{flex:none;display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--border-soft);}
.fthead h3{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:700;}
.fthead .ct{font-family:var(--mono);font-size:11px;color:var(--fg-muted);}
.ftlist{overflow:hidden;padding:6px 6px;}
.ftrow{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;cursor:pointer;font-family:var(--mono);font-size:12px;}
.ftrow:hover{background:var(--bg-base);}
.ftrow.on{background:var(--bg-sel);box-shadow:inset 2px 0 0 var(--accent);}
.ftrow .stat{flex:none;width:14px;text-align:center;font-weight:700;}
.ftrow .stat.m{color:var(--gold);}.ftrow .stat.a{color:var(--success);}.ftrow .stat.d{color:var(--error);}
.ftrow .fn{color:var(--fg-secondary);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ftrow.on .fn{color:var(--fg-primary);}
.ftrow .pm{font-size:10px;color:var(--fg-muted);}
.ftrow .ck{flex:none;color:var(--success);}
.diffpane{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--bg-base);}
.dphead{flex:none;display:flex;align-items:center;gap:10px;padding:10px 15px;border-bottom:1px solid var(--border-soft);}
.dphead .fn{font-family:var(--mono);font-size:12.5px;color:var(--fg-primary);}
.dphead .seg{margin-left:auto;display:flex;border:1px solid var(--border-soft);border-radius:7px;overflow:hidden;}
.dphead .seg button{font-family:var(--mono);font-size:11px;padding:4px 11px;background:var(--bg-panel);color:var(--fg-muted);border:none;cursor:pointer;border-right:1px solid var(--border-soft);}
.dphead .seg button:last-child{border-right:none;}
.dphead .seg button.on{background:var(--bg-sel);color:var(--accent);}
.diffbody{flex:1;overflow:hidden;font-family:var(--mono);font-size:12px;line-height:1.65;padding:8px 0;}
.dl{display:flex;}
.dl .ln{width:46px;flex:none;text-align:right;padding-right:12px;color:var(--fg-faint);user-select:none;font-size:11px;}
.dl .tx{flex:1;white-space:pre;padding-right:16px;}
.dl.add{background:color-mix(in srgb,var(--success) 9%,transparent);}
.dl.add .tx{color:var(--success);}
.dl.add .ln{color:color-mix(in srgb,var(--success) 60%,transparent);}
.dl.del{background:color-mix(in srgb,var(--error) 9%,transparent);}
.dl.del .tx{color:var(--error);}
.dl.del .ln{color:color-mix(in srgb,var(--error) 50%,transparent);}
.dl.hunk{background:var(--bg-void);}
.dl.hunk .tx{color:var(--accent);}
.dl .tx.ctx{color:var(--fg-secondary);}
.commitbar{flex:none;border-top:1px solid var(--border-soft);background:var(--bg-panel);padding:11px 15px;display:flex;align-items:center;gap:11px;}
.commitbar .msg-in{flex:1;background:var(--bg-base);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-family:var(--mono);font-size:12px;color:var(--fg-secondary);}
.commitbar .msg-in .ph{color:var(--fg-muted);}
.cbtn{font-family:var(--mono);font-size:12px;font-weight:700;border-radius:8px;padding:9px 15px;border:1px solid var(--border);background:var(--bg-base);color:var(--fg-secondary);cursor:pointer;white-space:nowrap;}
.cbtn.commit{background:var(--success);border-color:var(--success);color:#04140a;}
.cbtn.push{border-color:var(--accent-dim);color:var(--accent);}

/* ===== TERMINAL DOCK ===== */
.termdock{flex:none;border-top:1px solid var(--border);background:var(--bg-void);height:152px;display:flex;flex-direction:column;overflow:hidden;}
.termhead{flex:none;display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--border-soft);}
.termhead .tabs{display:flex;gap:3px;}
.termtab{font-family:var(--mono);font-size:11px;padding:3px 10px;border-radius:6px;color:var(--fg-muted);cursor:pointer;}
.termtab.on{background:var(--bg-sel);color:var(--accent);}
.termhead .right{margin-left:auto;display:flex;gap:9px;font-family:var(--mono);font-size:11px;color:var(--fg-muted);}
.termhead .x{cursor:pointer;}.termhead .x:hover{color:var(--accent);}
.termbody{flex:1;overflow:hidden;padding:8px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.55;}
.termbody .gp{color:var(--success);}.termbody .cp{color:var(--accent);}.termbody .yp{color:var(--gold);}.termbody .dim{color:var(--fg-muted);}.termbody .rp{color:var(--error);}
.termbody .cur{display:inline-block;width:7px;height:13px;background:var(--accent-bright);vertical-align:-2px;animation:blink 1.1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}

/* ============ SUMMON DOCK (D2 风格 · 命名隔离 sd-) ============ */
.sdock{flex:none;background:var(--term-chrome);border-top:1px solid var(--term-edge);display:flex;flex-direction:column;min-height:0;position:relative;}
.sdgrip{position:absolute;top:-3px;left:0;right:0;height:6px;cursor:ns-resize;z-index:5;}
.sdtabs{height:38px;flex:none;display:flex;align-items:stretch;padding:0 8px;gap:3px;background:var(--term-bar);border-bottom:1px solid var(--term-edge);}
.sdtab{display:flex;align-items:center;gap:7px;padding:0 11px;font-family:var(--mono);font-size:11.5px;color:var(--fg-muted);cursor:pointer;border-radius:7px 7px 0 0;position:relative;margin-bottom:-1px;border:1px solid transparent;border-bottom:none;align-self:flex-end;height:30px;}
.sdtab:hover{color:var(--fg-secondary);background:color-mix(in srgb,var(--bg-elev) 50%,transparent);}
.sdtab.on{background:var(--term-screen);color:var(--accent-bright);border-color:var(--term-edge);}
.sdtab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);}
.sdtab .tic{display:grid;place-items:center;opacity:.85;}
.sdtab.host{color:var(--fg-secondary);cursor:default;}
.sdtab.host .hdot{width:6px;height:6px;border-radius:50%;background:var(--success);}
.sdtab .x{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;font-size:11px;color:var(--fg-faint);margin-left:1px;}
.sdtab .x:hover{background:var(--bg-elev);color:var(--error);}
.sdaddwrap{align-self:center;position:relative;margin-left:2px;}
.sdadd{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--fg-muted);cursor:pointer;font-size:15px;line-height:1;}
.sdadd:hover,.sdadd.open{background:var(--bg-elev);color:var(--accent-bright);}
.sdtabs .sdright{margin-left:auto;display:flex;align-items:center;gap:4px;}
.sdmini{align-self:center;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--fg-muted);cursor:pointer;}
.sdmini:hover{color:var(--fg-secondary);background:var(--bg-elev);}
.sdsummon{position:absolute;z-index:40;top:calc(100% + 6px);left:0;background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);padding:5px;width:236px;}
.sdsummon::before{content:"";position:absolute;top:-5px;left:8px;width:9px;height:9px;background:var(--bg-elev);border-left:1px solid var(--border);border-top:1px solid var(--border);transform:rotate(45deg);}
.sdsummon .mh{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--fg-faint);padding:7px 9px 4px;}
.sdsmrow{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:7px;cursor:pointer;}
.sdsmrow:hover{background:var(--bg-sel);}
.sdsmrow .si{width:24px;height:24px;border-radius:6px;background:var(--bg-panel);border:1px solid var(--border-soft);display:grid;place-items:center;color:var(--accent);flex:none;}
.sdsmrow .sn{font-size:12.5px;font-weight:500;color:var(--fg-primary);}
.sdsmrow .sd{font-size:11px;color:var(--fg-muted);margin-top:1px;}
.sdsmrow .sk{margin-left:auto;}
.sdveil{position:fixed;inset:0;z-index:30;}
.sdbody{flex:1;min-height:0;background:var(--term-screen);overflow:hidden;display:flex;}
.sdock.collapsed .sdbody{display:none;}
.sdempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;color:var(--fg-faint);font-family:var(--mono);font-size:11px;}
.sdempty .eh{letter-spacing:.4px;}
.sdquick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.sdqbtn{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:8px;border:1px solid var(--border-soft);background:var(--bg-panel);color:var(--fg-secondary);font-family:var(--mono);font-size:11.5px;cursor:pointer;}
.sdqbtn:hover{border-color:var(--accent-dim);background:var(--bg-sel);color:var(--accent-bright);}
.sdqbtn .qi{display:grid;place-items:center;color:var(--accent);opacity:.9;}
.sdqbtn .qk{color:var(--fg-faint);font-size:10px;}
.sdterm{flex:1;display:flex;flex-direction:column;min-height:0;font-family:var(--mono);}
.sdtermb{flex:1;overflow-y:auto;padding:12px 16px;font-size:12.5px;line-height:1.65;}
.sdtermb .p{color:var(--accent-bright);}
.sdtermb .path{color:var(--gold);}
.sdtermb .br{color:var(--builtin);}
.sdtermb .dim{color:var(--fg-muted);}
.sdtermb .ok{color:var(--success);}
.sdcurs{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px;animation:bl 1.1s step-end infinite;}
@keyframes bl{50%{opacity:0;}}
.sdfiles{flex:1;display:flex;min-height:0;}
.sdfileview{flex:1;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--term-edge);}
.sdfvtab{height:30px;flex:none;display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid var(--term-edge);font-family:var(--mono);font-size:11.5px;color:var(--fg-secondary);}
.sdfvtab .pm{margin-left:auto;display:flex;gap:8px;}
.sdfvtab .pm .p{color:var(--success);}.sdfvtab .pm .m{color:var(--error);}
.sdfvbody{flex:1;overflow:auto;padding:10px 0;font-family:var(--mono);font-size:12px;line-height:1.62;}
.sdcl{display:flex;padding:0 16px;white-space:pre;}
.sdcl .ln{width:34px;flex:none;text-align:right;padding-right:14px;color:var(--fg-faint);user-select:none;}
.sdcl.add{background:color-mix(in srgb,var(--success) 11%,transparent);}
.sdcl.add .ln{color:var(--success);}
.sdcl.del{background:color-mix(in srgb,var(--error) 11%,transparent);}
.sdcl.del .ln{color:var(--error);}
.sdcl .kw{color:var(--builtin);}.sdcl .fn2{color:var(--accent-bright);}.sdcl .cm{color:var(--fg-faint);}
.sdftree{width:262px;flex:none;display:flex;flex-direction:column;min-height:0;}
.sdftfilter{flex:none;padding:8px 10px;border-bottom:1px solid var(--term-edge);}
.sdftfilter .inp{display:flex;align-items:center;gap:7px;background:var(--bg-void);border:1px solid var(--border-soft);border-radius:7px;padding:5px 9px;font-family:var(--mono);font-size:11.5px;color:var(--fg-muted);}
.sdftbody{flex:1;overflow-y:auto;padding:5px 5px;font-family:var(--mono);font-size:12px;}
.sdfrow{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--fg-secondary);}
.sdfrow:hover{background:var(--bg-elev);}
.sdfrow.on{background:var(--bg-sel);color:var(--accent-bright);}
.sdfrow .ar{color:var(--fg-faint);width:9px;font-size:9px;}
.sdfrow .fi{color:var(--fg-muted);}
.sdfrow.dir{color:var(--fg-primary);font-weight:600;}
.sdfrow .g{font-weight:700;width:11px;text-align:center;flex:none;}
.sdfrow .g.m{color:var(--gold);}.sdfrow .g.a{color:var(--success);}
.sdfrow .pm{margin-left:auto;font-size:9.5px;color:var(--fg-faint);}
.sdreview{flex:1;display:flex;flex-direction:column;min-height:0;}
.sdrvhead{height:32px;flex:none;display:flex;align-items:center;gap:11px;padding:0 16px;border-bottom:1px solid var(--term-edge);font-family:var(--mono);font-size:11.5px;color:var(--fg-secondary);}
.sdrvhead .ct{color:var(--fg-faint);}
.sdrvhead .acts{margin-left:auto;display:flex;gap:7px;}
.sdrvbody{flex:1;overflow-y:auto;padding:0;}
.sdrvfile{border-bottom:1px solid var(--term-edge);}
.sdrvfh{display:flex;align-items:center;gap:9px;padding:8px 16px;font-family:var(--mono);font-size:12px;color:var(--fg-secondary);position:sticky;top:0;background:var(--term-bar);cursor:pointer;}
.sdrvfh .g{font-weight:700;}.sdrvfh .g.m{color:var(--gold);}.sdrvfh .g.a{color:var(--success);}
.sdrvfh .pm{margin-left:auto;display:flex;gap:8px;font-size:11px;}
.sdrvfh .pm .p{color:var(--success);}.sdrvfh .pm .m{color:var(--error);}
.sdrvhunk{font-family:var(--mono);font-size:12px;line-height:1.6;padding:6px 0;}
.sdhl{display:flex;padding:0 16px;white-space:pre;}
.sdhl .ln{width:30px;flex:none;text-align:right;padding-right:12px;color:var(--fg-faint);}
.sdhl.h{color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);}
.sdhl.a{background:color-mix(in srgb,var(--success) 11%,transparent);color:var(--fg-primary);}
.sdhl.d{background:color-mix(in srgb,var(--error) 11%,transparent);color:var(--fg-secondary);}
.sdbrowser{flex:1;display:flex;flex-direction:column;min-height:0;}
.sdbnav{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--term-edge);}
.sdbbtn{width:22px;height:22px;display:grid;place-items:center;color:var(--fg-muted);border-radius:5px;cursor:pointer;}
.sdbbtn:hover{background:var(--bg-elev);color:var(--fg-secondary);}
.sdburl{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg-void);border:1px solid var(--border-soft);border-radius:7px;padding:5px 11px;font-family:var(--mono);font-size:11.5px;color:var(--fg-secondary);}
.sdburl .lk{color:var(--success);}
.sdburl .host{color:var(--fg-primary);}
.sdbview{flex:1;min-height:0;background:var(--bg-void);display:grid;place-items:center;overflow:hidden;}
.sdappshot{width:88%;max-width:620px;border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow-lg);background:var(--bg-base);}
.sdappshot .ash{height:30px;display:flex;align-items:center;gap:8px;padding:0 11px;background:var(--bg-void);border-bottom:1px solid var(--border-soft);font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);}
.sdappshot .asb{padding:18px;display:flex;gap:14px;}
.sdappshot .canvas{flex:1;height:150px;border:1px solid var(--border-soft);border-radius:8px;background:repeating-linear-gradient(45deg,var(--bg-panel),var(--bg-panel) 9px,var(--bg-elev) 9px,var(--bg-elev) 18px);display:grid;place-items:center;color:var(--fg-muted);font-family:var(--mono);font-size:11px;}
.sdappshot .insp{width:120px;display:flex;flex-direction:column;gap:7px;}
.sdappshot .ib{height:22px;border-radius:5px;background:var(--bg-panel);border:1px solid var(--border-soft);}
.sdappshot .ib.ac{border-color:var(--accent-dim);background:var(--bg-sel);}
.sdsidechat{flex:1;display:flex;flex-direction:column;min-height:0;}
.sdscbody{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:11px;}
.sdscmsg{max-width:82%;font-size:12.5px;line-height:1.55;padding:8px 11px;border-radius:10px;}
.sdscmsg.u{align-self:flex-end;background:var(--bg-sel);color:var(--fg-primary);border:1px solid var(--accent-dim);border-radius:10px 10px 3px 10px;}
.sdscmsg.b{align-self:flex-start;background:var(--bg-panel);color:var(--fg-secondary);border:1px solid var(--border-soft);border-radius:10px 10px 10px 3px;}
.sdscmsg .who{font-family:var(--mono);font-size:9px;letter-spacing:.8px;color:var(--fg-faint);margin-bottom:4px;}
.sdscmsg code{font-family:var(--mono);font-size:11.5px;color:var(--accent-bright);}
.sdscfoot{flex:none;padding:9px 12px;border-top:1px solid var(--term-edge);}
.sdscinp{display:flex;align-items:center;gap:8px;background:var(--bg-void);border:1px solid var(--border-soft);border-radius:9px;padding:7px 11px;font-size:12px;color:var(--fg-muted);}
.sdscinp .s{margin-left:auto;color:var(--accent);}
.sdscnote{font-family:var(--mono);font-size:10px;color:var(--fg-faint);padding:6px 12px 0;display:flex;align-items:center;gap:6px;}
.sdscnote .ac{color:var(--builtin);}
.navtop{padding:9px 9px 6px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--border-soft);}
.navbtn{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:12.5px;color:var(--fg-secondary);cursor:pointer;}
.navbtn:hover{background:var(--bg-base);color:var(--fg-primary);}
.navbtn .ni{color:var(--fg-muted);display:grid;place-items:center;width:16px;}
.navbtn .k{margin-left:auto;}

/* ===== STATUS BAR (ticker, matches TUI) ===== */
.statusbar{flex:none;height:28px;display:flex;align-items:center;gap:0;padding:0 12px;background:var(--bg-void);border-top:1px solid var(--border-soft);font-family:var(--mono);font-size:11px;color:var(--fg-secondary);overflow:hidden;}
.statusbar .ok{color:var(--success);}.statusbar .gd{color:var(--gold);}.statusbar .ac{color:var(--accent);}
.sb-gear2{color:var(--fg-muted);cursor:pointer;flex:none;padding-right:10px;border-right:1px solid var(--border-soft);}
.sb-gear2:hover{color:var(--accent);}
.sb-tickwrap{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);}
.sb-track2{display:inline-flex;white-space:nowrap;animation:sbticker 30s linear infinite;}
.sb-track2:hover{animation-play-state:paused;}
@keyframes sbticker{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.sb-it{padding:0 13px;flex:none;}
.sb-it .lbl{color:var(--fg-faint);}
.sb-it b{color:var(--fg-primary);font-weight:600;}
.sb-sep2{color:var(--fg-faint);flex:none;}
.sb-right{flex:none;color:var(--warning);padding-left:10px;border-left:1px solid var(--border-soft);}
/* statusbar config popover */
.sbcfg{position:absolute;left:10px;bottom:36px;width:218px;background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;box-shadow:0 -16px 50px -14px rgba(0,0,0,.85);z-index:70;overflow:hidden;font-family:var(--mono);}
.sbcfg .mhead{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--fg-muted);padding:10px 13px 6px;}
.sbcfg .crow{display:flex;align-items:center;gap:9px;padding:6px 13px;font-size:12px;color:var(--fg-secondary);cursor:pointer;}
.sbcfg .crow:hover{background:var(--bg-panel);}
.sbcfg .crow .bx{color:var(--accent);width:22px;flex:none;}
.sbcfg .crow.off{color:var(--fg-muted);}
.sbcfg .crow.off .bx{color:var(--fg-faint);}
.sbcfg .mfoot{border-top:1px solid var(--border-soft);padding:7px 13px;font-size:10.5px;color:var(--fg-faint);}

/* ===== OVERLAYS ===== */
.scrim{position:absolute;inset:0;background:rgba(4,8,13,.62);backdrop-filter:blur(3px);display:flex;justify-content:center;z-index:40;}
.scrim.center{align-items:center;}
.scrim.top{align-items:flex-start;padding-top:90px;}
/* approval */
.appmodal{width:580px;max-width:92%;background:var(--bg-elev);border:1px solid var(--warning);border-radius:13px;overflow:hidden;box-shadow:0 40px 100px -30px rgba(0,0,0,.9);align-self:center;}
.amhead{display:flex;align-items:center;gap:11px;padding:14px 17px;background:color-mix(in srgb,var(--warning) 11%,var(--bg-elev));border-bottom:1px solid color-mix(in srgb,var(--warning) 35%,transparent);}
.amhead .badge{background:var(--warning);color:var(--term-screen);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:1px;padding:2px 9px;border-radius:5px;}
.amhead .ttl{font-family:var(--mono);font-size:13.5px;color:var(--fg-primary);font-weight:600;}
.amhead .ttl .pa{color:var(--accent);}
.amhead .x{margin-left:auto;color:var(--fg-muted);cursor:pointer;font-size:18px;line-height:1;}
.ambody{padding:16px 17px;}
.permseg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px;}
.permseg button{flex:1;font-family:var(--mono);font-size:12px;font-weight:600;padding:8px;background:var(--bg-base);color:var(--fg-muted);border:none;cursor:pointer;border-right:1px solid var(--border-soft);}
.permseg button:last-child{border-right:none;}
.permseg button.on.allow{background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success);}
.permseg button.on.ask{background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning);}
.permseg button.on.deny{background:color-mix(in srgb,var(--error) 16%,transparent);color:var(--error);}
.amlabel{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--fg-muted);margin-bottom:7px;}
.amdiff{border:1px solid var(--border);border-radius:9px;background:var(--bg-base);padding:11px 13px;margin-bottom:16px;}
.amacts{display:flex;gap:10px;align-items:center;}
.abtn{font-family:var(--mono);font-size:13px;font-weight:700;border-radius:8px;padding:10px 20px;border:1px solid var(--border);background:var(--bg-base);color:var(--fg-secondary);cursor:pointer;display:flex;align-items:center;gap:8px;}
.abtn .ky{font-size:10.5px;opacity:.7;font-weight:600;}
.abtn.approve{background:var(--success);border-color:var(--success);color:#04140a;box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 22%,transparent);}
.abtn.deny{border-color:var(--error);color:var(--error);}
.abtn.diff{margin-left:auto;border-color:var(--accent-dim);color:var(--accent);}
/* command palette */
.palette{width:620px;max-width:92%;background:var(--bg-elev);border:1px solid var(--accent-dim);border-radius:13px;overflow:hidden;box-shadow:0 40px 100px -30px rgba(0,0,0,.9);}
.palin{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--border-soft);}
.palin .pr{color:var(--accent);font-family:var(--mono);font-size:16px;}
.palin .q{font-family:var(--mono);font-size:15px;color:var(--fg-primary);flex:1;}
.palin .q .cur{display:inline-block;width:8px;height:17px;background:var(--accent-bright);vertical-align:-3px;animation:blink 1.1s steps(1) infinite;}
.palin .esc{font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);}
.palsec{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--fg-muted);padding:10px 18px 5px;}
.palrow{display:flex;align-items:center;gap:12px;padding:9px 18px;cursor:pointer;font-family:var(--mono);}
.palrow.on{background:var(--bg-sel);box-shadow:inset 3px 0 0 var(--accent);}
.palrow .pic{width:18px;text-align:center;color:var(--accent);flex:none;}
.palrow .pl{font-size:13px;color:var(--fg-secondary);flex:1;}
.palrow.on .pl{color:var(--accent-bright);}
.palrow .pk{font-size:10.5px;color:var(--fg-muted);display:flex;gap:4px;}

/* ===== LANE MONITOR + SUBAGENTS ===== */
.lmwrap{display:grid;grid-template-columns:294px 1fr;height:100%;min-height:0;}
.lmlist{border-right:1px solid var(--border-soft);background:var(--bg-panel);display:flex;flex-direction:column;overflow:hidden;}
.lmhead{flex:none;display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--border-soft);}
.lmhead h3{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:700;}
.lmhead .ct{font-family:var(--mono);font-size:11px;color:var(--fg-muted);}
.lmrow{padding:10px 12px;border-bottom:1px solid var(--border-soft);cursor:pointer;position:relative;}
.lmrow:hover{background:var(--bg-base);}
.lmrow.on{background:var(--bg-sel);box-shadow:inset 3px 0 0 var(--accent);}
.lmrow .r1{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;white-space:nowrap;overflow:hidden;}
.lmrow .lid{color:var(--accent);font-weight:700;flex:none;}
.lmrow .ag{color:var(--fg-primary);font-weight:600;flex:none;}
.lmrow .ag .ic{color:var(--gold);}
.lmrow .r2{display:flex;align-items:center;gap:7px;margin-top:4px;font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);}
.lmrow .br{color:var(--accent-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lmrow.on .br{color:var(--accent);}
.lmrow .tail{margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lmrow .tail .cp{color:var(--accent);}
.lmrow .miniprog{margin-top:6px;display:flex;align-items:center;gap:7px;}
.lmrow .miniprog .bar{flex:1;height:3px;border-radius:2px;background:var(--bg-void);overflow:hidden;}
.lmrow .miniprog .bar i{display:block;height:100%;background:var(--progress);}
.lmrow .miniprog .pct{font-family:var(--mono);font-size:10px;color:var(--progress);}
/* detail */
.lmdetail{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-base);}
.lmdhead{flex:none;display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--border-soft);white-space:nowrap;overflow:hidden;}
.lmdhead .ttl{font-family:var(--mono);font-size:13px;color:var(--fg-primary);font-weight:600;}
.lmdhead .ttl .lid{color:var(--accent);}
.lmdhead .br{font-family:var(--mono);font-size:11.5px;color:var(--accent);}
.lmdhead .right{margin-left:auto;display:flex;gap:7px;}
.lmbody{flex:1;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);min-height:0;}
/* subagent tree */
.satree{border-right:1px solid var(--border-soft);overflow:hidden;padding:13px 15px;}
.satree h4{margin:0 0 4px;font-family:var(--mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);font-weight:700;display:flex;justify-content:space-between;}
.satree h4 .ct{color:var(--fg-muted);font-weight:600;}
.sahint{font-family:var(--mono);font-size:10.5px;color:var(--fg-faint);margin-bottom:10px;}
.sanode{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-family:var(--mono);font-size:12px;position:relative;white-space:nowrap;overflow:hidden;}
.sanode:hover{background:var(--bg-panel);}
.sanode.on{background:var(--bg-sel);box-shadow:inset 3px 0 0 var(--accent);}
.sanode .guide{color:var(--fg-faint);flex:none;white-space:pre;}
.sanode .sic{flex:none;width:14px;text-align:center;}
.sanode .nm{color:var(--fg-primary);font-weight:600;flex:none;}
.sanode.on .nm{color:var(--accent-bright);}
.sanode .act2{color:var(--fg-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.sanode .meta{flex:none;font-size:10.5px;color:var(--fg-muted);}
.sanode .meta .tok{color:var(--fg-faint);}
.sastats{margin-top:12px;border-top:1px solid var(--border-soft);padding-top:10px;display:flex;gap:16px;font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);flex-wrap:wrap;}
.sastats b{color:var(--fg-secondary);font-weight:600;}
/* subagent inspector */
.sains{display:flex;flex-direction:column;min-width:0;min-height:0;}
.sainshead{flex:none;display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--border-soft);font-family:var(--mono);font-size:11.5px;}
.sainshead .nm{color:var(--accent-bright);font-weight:700;}
.sainshead .pa{color:var(--fg-muted);}
.saout{flex:1;overflow:hidden;padding:10px 15px;font-family:var(--mono);font-size:11px;line-height:1.6;background:var(--bg-void);}
.saout > div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.saout .gp{color:var(--success);}.saout .cp{color:var(--accent);}.saout .yp{color:var(--gold);}.saout .dim{color:var(--fg-muted);}.saout .rp{color:var(--error);}

function LaneMonitor({active}){
  const lane=THREADS[active];
  const data=LANE_SUBAGENTS[lane.lid]||LANE_SUBAGENTS.L1;
  const subs=data.subs;
  const defId=(subs.find(s=>s.sel)||subs[0]).id;
  const [selId,setSelId]=useState(defId);
  React.useEffect(()=>{setSelId(defId);},[lane.lid]);
  const sel=subs.find(s=>s.id===selId)||subs[0];
  const depth=subs.some(s=>s.guide.includes('│'))?2:1;
  return (
    <div className="center">
      <div className="lmwrap" style={{gridTemplateColumns:'1fr'}}>
        <div className="lmdetail">
          <div className="lmdhead">
            <span className="ttl"><span className="lid">{lane.lid}</span> {lane.agent} · supervising</span>
            <span className="br">⎇ {lane.branch}</span>
            <span className={"statechip "+lane.state}>{lane.state==='run'&&<span className="pulsedot"></span>}{lane.sl}</span>
            <div className="right">
              <span className="mpill go">Attach</span><span className="mpill">Pause</span><span className="mpill" style={{color:'var(--error)',borderColor:'color-mix(in srgb,var(--error) 40%,transparent)'}}>Kill</span>
            </div>
          </div>
          <div className="lmbody">
            <div className="satree">
              <h4>Subagent tree <span className="ct">{subs.length} nodes · depth {depth}</span></h4>
              <div className="sahint">{lane.lid} orchestrator 派生的子代理层级 · 点击节点查看输出</div>
              {subs.map(s=>(
                <div key={s.id} className={"sanode "+(s.id===selId?'on':'')} onClick={()=>setSelId(s.id)}>
                  <span className="guide">{s.guide}</span>
                  <span className="sic" style={{color:s.col}}>{s.sic}</span>
