<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viden D13 · Fleet & Workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="i18n.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../tokens.css">
<style>
/* Token 单一真源 → ../tokens.css;本页只用 var(--*)。默认 :root = dark 皮肤。 */
*{box-sizing:border-box;}
body{margin:0;background:var(--page-bg);color:var(--fg-primary);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
.pwrap{max-width:1640px;margin:0 auto;padding:28px 24px 70px;}
.pkicker{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.pkicker::before{content:"";width:24px;height:2px;background:var(--accent);}
.ph1{font-size:28px;margin:0 0 8px;letter-spacing:-.6px;}
.ph1 .ac{color:var(--accent);}
.plead{font-size:14px;color:var(--fg-secondary);margin:0 0 20px;max-width:960px;line-height:1.6;text-wrap:pretty;}
.plead b{color:var(--fg-primary);font-weight:600;}

/* ===== window shell (D1 同源) ===== */
.frame{background:var(--bg-base);border:1px solid var(--border);border-radius:14px;overflow:hidden;height:912px;display:flex;flex-direction:column;min-width:1240px;box-shadow:0 24px 70px rgba(0,0,0,.5);}
.vbar{height:46px;flex:none;display:flex;align-items:center;gap:13px;padding:0 14px;background:var(--bg-void);border-bottom:1px solid var(--border-soft);}
.vbar .tl{display:flex;gap:8px;}
.vbar .tl i{width:12px;height:12px;border-radius:50%;display:block;}
.vbar .tl .a{background:var(--error);}.vbar .tl .b{background:var(--warning);}.vbar .tl .c{background:var(--success);}
.vbar .wm{font-family:var(--mono);font-weight:700;font-size:13.5px;letter-spacing:.3px;}
.vbar .wm .r{color:var(--gold);}.vbar .wm .c{color:var(--accent);}
.vbar .projsel{font-family:var(--mono);font-size:11.5px;color:var(--fg-secondary);background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:7px;padding:4px 10px;display:flex;align-items:center;gap:7px;cursor:pointer;}
.vbar .projsel .br{color:var(--accent);}
.vbar .sp{flex:1;}
.vbar .vtools{display:flex;align-items:center;gap:4px;}
.vbtn{width:30px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--fg-muted);cursor:pointer;border:1px solid transparent;}
.vbtn:hover{color:var(--accent);background:var(--bg-panel);}
.vbtn.on{color:var(--accent-bright);background:var(--bg-sel);border-color:var(--accent-dim);}
.vbody{flex:1;display:grid;grid-template-columns:52px 1fr 332px;min-height:0;}
.vrail{background:var(--bg-void);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;align-items:center;padding:9px 0;gap:5px;}
.vrailbtn{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--fg-muted);cursor:pointer;position:relative;}
.vrailbtn:hover{color:var(--fg-secondary);background:var(--bg-panel);}
.vrailbtn.on{color:var(--accent-bright);background:var(--bg-sel);box-shadow:inset 2px 0 0 var(--accent);}
.vrailbtn .bdg{position:absolute;top:3px;right:3px;min-width:14px;height:14px;border-radius:7px;background:var(--gold);color:#1a1206;font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 3px;}
.vrailsp{flex:1;}

/* ===== main ===== */
.wfmain{min-width:0;display:flex;flex-direction:column;background:var(--bg-base);}
/* stat strip */
.statbar{flex:none;display:flex;align-items:center;gap:16px;padding:11px 18px;border-bottom:1px solid var(--border-soft);background:var(--bg-void);}
.fleetpick{display:flex;align-items:center;gap:9px;}
.fleetpick .nm{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
.fleetpick .nm .bi{color:var(--gold-bright);}
.fleetpick .goal{font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);}
.statbar .sp{flex:1;}
.stats{display:flex;gap:18px;}
.stat{font-family:var(--mono);font-size:10px;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.6px;display:flex;flex-direction:column;gap:2px;}
.stat b{font-family:var(--sans);font-size:17px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--fg-primary);}
.stat.go b{color:var(--gold-bright);}
.stat.ac b{color:var(--accent-bright);}

/* pipeline */
.pipe{flex:1;display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:16px 18px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.phase{flex:none;width:228px;display:flex;flex-direction:column;min-height:0;}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.phead .pic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--bg-panel);border:1px solid var(--border-soft);color:var(--accent);flex:none;}
.phead .pt{font-size:12.5px;font-weight:700;}
.phead .pc{font-family:var(--mono);font-size:10px;color:var(--fg-muted);margin-left:auto;}
.pbar{height:3px;border-radius:2px;background:var(--bg-void);overflow:hidden;border:1px solid var(--border-soft);margin-bottom:11px;}
.pbar i{display:block;height:100%;background:var(--accent);}
.gnodes{display:flex;flex-direction:column;gap:9px;overflow-y:auto;min-height:0;padding-right:2px;}
.gnodes::-webkit-scrollbar{width:5px;}.gnodes::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.gnode{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:10px;padding:10px 11px;cursor:pointer;transition:border-color .12s,background .12s;}
.gnode:hover{border-color:var(--accent-dim);}
.gnode.on{border-color:var(--accent);background:var(--bg-sel);}
.gnode .r1{display:flex;align-items:center;gap:7px;}
.gnode .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;}
.gnode .role{font-size:12.5px;font-weight:600;color:var(--fg-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gnode .cnt{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent-bright);flex:none;}
.gnode .proj{font-family:var(--mono);font-size:9.5px;color:var(--fg-faint);margin-top:5px;}
.gnode .seg{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:8px;background:var(--bg-void);}
.gnode .seg i{display:block;height:100%;}
.gnode .legend{display:flex;gap:9px;margin-top:7px;font-family:var(--mono);font-size:9px;color:var(--fg-muted);flex-wrap:wrap;}
.gnode .legend span{display:flex;align-items:center;gap:3px;}
.gnode .legend i{width:6px;height:6px;border-radius:50%;}
.gnode.orch{border-color:color-mix(in srgb,var(--gold) 42%,transparent);background:color-mix(in srgb,var(--gold) 8%,var(--bg-panel));}
.gnode.orch .role{color:var(--gold-bright);}
.gnode.orch .cnt{color:var(--gold-bright);}
/* flow connector */
.flowarrow{flex:none;width:30px;display:flex;align-items:center;justify-content:center;color:var(--border-active);opacity:.5;align-self:center;}

/* detail strip */
.detail{flex:none;border-top:1px solid var(--border-soft);background:var(--bg-void);max-height:228px;display:flex;flex-direction:column;}
.dethead{display:flex;align-items:center;gap:10px;padding:9px 18px;border-bottom:1px solid var(--border-soft);}
.dethead .t{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
.dethead .ct{font-family:var(--mono);font-size:10px;color:var(--fg-muted);}
.dethead .x{margin-left:auto;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--fg-muted);cursor:pointer;}
.dethead .x:hover{background:var(--bg-sel);color:var(--fg-primary);}
.detbody{overflow-y:auto;padding:8px 12px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(244px,1fr));gap:7px;}
.arow{display:flex;align-items:center;gap:9px;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:11px;}
.arow .dot{width:7px;height:7px;border-radius:50%;flex:none;}
.arow .id{color:var(--fg-secondary);}
.arow .ac2{color:var(--fg-muted);font-size:10px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;}
.detmore{grid-column:1/-1;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--fg-faint);padding:5px;}

/* ===== group channel ===== */
.channel{background:var(--bg-panel);border-left:1px solid var(--border-soft);display:flex;flex-direction:column;min-width:0;}
.chhead{flex:none;height:42px;display:flex;align-items:center;gap:8px;padding:0 13px;border-bottom:1px solid var(--border-soft);background:var(--bg-void);}
.chhead .t{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;}
.chhead .t .lv{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 16%,transparent);}
.chhead .ct{font-family:var(--mono);font-size:9.5px;color:var(--fg-faint);margin-left:auto;}
.chfeed{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:9px;}
.chfeed::-webkit-scrollbar{width:6px;}.chfeed::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.cmsg{display:flex;flex-direction:column;gap:3px;}
.cmsg .top{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;}
.cmsg .who{font-weight:700;}
.cmsg .who.orch{color:var(--gold-bright);}
.cmsg .who.agent{color:var(--accent-bright);}
.cmsg .who.gate{color:var(--warning);}
.cmsg .tm{color:var(--fg-faint);margin-left:auto;}
.cmsg .body{font-size:12px;color:var(--fg-secondary);line-height:1.5;padding-left:2px;}
.cmsg .body .mono{font-family:var(--mono);font-size:11px;}
.cmsg .body .at{color:var(--accent);}
.cmsg.broadcast{background:color-mix(in srgb,var(--gold) 7%,transparent);border:1px solid color-mix(in srgb,var(--gold) 22%,transparent);border-radius:9px;padding:8px 10px;}
.cmsg.gatey{background:color-mix(in srgb,var(--warning) 8%,transparent);border:1px solid color-mix(in srgb,var(--warning) 26%,transparent);border-radius:9px;padding:8px 10px;}
.chcompose{flex:none;border-top:1px solid var(--border-soft);padding:10px 12px;background:var(--bg-void);}
.chbox{display:flex;align-items:center;gap:8px;background:var(--bg-base);border:1px solid var(--border);border-radius:9px;padding:7px 10px;}
.chbox .pr{color:var(--gold);font-family:var(--mono);}
.chbox .tx{flex:1;font-family:var(--mono);font-size:11.5px;color:var(--fg-muted);}
.chbox .snd{background:var(--gold);color:#1a1206;border:none;border-radius:6px;width:26px;height:26px;font-weight:700;cursor:pointer;flex:none;}
.chmeta{display:flex;align-items:center;gap:8px;margin-top:8px;font-family:var(--mono);font-size:10px;color:var(--fg-faint);}
.chmeta .scope{color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:5px;padding:1px 7px;cursor:pointer;}
</style>
</head>
<body>
<div id="root"></div>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0a1019"/><g fill="none" stroke="#34bdd9" stroke-width="3"><circle cx="50" cy="30" r="7"/><circle cx="28" cy="68" r="6"/><circle cx="50" cy="68" r="6"/><circle cx="72" cy="68" r="6"/><path d="M50 37v12M50 49L30 62M50 49l20 13M50 49v13"/></g></svg></template>
<script type="text/babel">
const {useState} = React;

/* ===== fleet model ===== */
const FLEETS=[
  {id:'rel', name:'v0.2 release push', goal:'cut 0.2 across robocode + web + infra', total:1284, active:312, awaiting:6},
  {id:'migrate', name:'lane-protocol migration', goal:'roll 0.2 lane contract to all repos', total:418, active:96, awaiting:2},
  {id:'sweep', name:'repo-wide clippy sweep', goal:'fmt + clippy --fix, all crates', total:204, active:40, awaiting:0},
];

// status color helper
const C={run:'var(--progress)', done:'var(--success)', gate:'var(--gold)', idle:'var(--fg-faint)'};

const ROLEIC={
  orchestrator:'⛭', planner:'◉', editor:'⚙', test:'⚗', review:'◈', doc:'¶', integrate:'⎇',
};
function gIcon(role,col){
  return <span className="ic" style={{background:'color-mix(in srgb,'+col+' 16%,transparent)',color:col}}>{ROLEIC[role]||'●'}</span>;
}

// phases of the active fleet. each group: role, count, mix {run,done,gate,idle}, proj, tok, col
const PHASES=[
  {key:'orch', name:'Orchestrate', nameZh:'编排', ic:'⛭', groups:[
    {id:'orch0', role:'orchestrator', label:'main agent · built-in', count:1, proj:'workspace', tok:'48.6k', mix:{run:1,done:0,gate:0,idle:0}, col:'var(--gold)', orch:true},
  ]},
  {key:'plan', name:'Plan', nameZh:'规划', ic:'◉', groups:[
    {id:'plan-r', role:'planner', label:'planner', count:12, proj:'all projects', tok:'31.2k', mix:{run:3,done:9,gate:0,idle:0}, col:'var(--accent)'},
  ]},
  {key:'impl', name:'Implement', nameZh:'实现', ic:'⚙', groups:[
    {id:'ed-rc', role:'editor', label:'editor', count:210, proj:'robocode', tok:'402k', mix:{run:74,done:120,gate:6,idle:10}, col:'var(--progress)'},
    {id:'ed-web', role:'editor', label:'editor', count:164, proj:'viden-web', tok:'288k', mix:{run:51,done:104,gate:3,idle:6}, col:'var(--progress)'},
    {id:'ed-inf', role:'editor', label:'editor', count:112, proj:'infra', tok:'151k', mix:{run:30,done:74,gate:2,idle:6}, col:'var(--progress)'},
  ]},
  {key:'verify', name:'Verify', nameZh:'验证', ic:'⚗', groups:[
    {id:'test', role:'test', label:'test-runner', count:520, proj:'all projects', tok:'612k', mix:{run:188,done:300,gate:18,idle:14}, col:'var(--accent)'},
    {id:'bench', role:'test', label:'bench-runner', count:36, proj:'robocode', tok:'77k', mix:{run:12,done:22,gate:0,idle:2}, col:'var(--accent)'},
  ]},
  {key:'review', name:'Review', nameZh:'评审', ic:'◈', groups:[
    {id:'rev', role:'review', label:'reviewer', count:168, proj:'all projects', tok:'209k', mix:{run:40,done:118,gate:8,idle:2}, col:'var(--builtin)'},
    {id:'sec', role:'review', label:'sec-audit', count:30, proj:'infra', tok:'44k', mix:{run:8,done:20,gate:2,idle:0}, col:'var(--builtin)'},
  ]},
  {key:'integrate', name:'Integrate', nameZh:'集成', ic:'⎇', groups:[
    {id:'int', role:'integrate', label:'integrator', count:61, proj:'→ main', tok:'52k', mix:{run:14,done:40,gate:5,idle:2}, col:'var(--gold)'},
    {id:'doc', role:'doc', label:'doc-writer', count:6, proj:'docs', tok:'12k', mix:{run:2,done:4,gate:0,idle:0}, col:'var(--success)'},
  ]},
];

const SAMPLE_NAMES=['Dalton','McClintock','Schrodinger','Dewey','Pasteur','Curie','Bohr','Feynman','Hopper','Lovelace','Turing','Noether','Fermi','Planck'];
function sampleAgents(g){
  const states=[];
  const push=(n,s)=>{for(let i=0;i<n;i++)states.push(s);};
  push(g.mix.gate,'gate');push(g.mix.run,'run');push(g.mix.done,'done');push(g.mix.idle,'idle');
  return states.slice(0,8).map((s,i)=>({
    id:g.label+'#'+String(1000+i*37+ (g.id.length*7)).slice(-4),
    st:s,
    act:s==='gate'?'⏸ awaiting human':s==='run'?'running step':s==='done'?'✓ green':'queued',
    nm:SAMPLE_NAMES[(i+g.id.length)%SAMPLE_NAMES.length],
  }));
}

const CHANNEL=[
  {who:'orchestrator', cls:'orch', tm:'now', kind:'broadcast', body:<span><span className="at">@editors</span> implement 0.2 lane-contract across robocode·web·infra · fan-out 486 · deadline T-2h</span>},
  {who:'test-runner#0412', cls:'agent', tm:'2s', body:<span><span className="mono">config_tests</span> ✓ green · reporting to editor·robocode</span>},
  {who:'reviewer#0088', cls:'agent', tm:'9s', body:<span>diff <span className="mono">+142−31</span> approved · L7 viden-web</span>},
  {who:'integration gate', cls:'gate', tm:'14s', kind:'gate', body:<span>⚠ conflict on <span className="mono">main</span> · bounced to lane <span className="at">L3</span> · awaiting your call</span>},
  {who:'orchestrator', cls:'orch', tm:'31s', body:<span>rebalanced 40 test-runners robocode→viden-web (queue depth)</span>},
  {who:'editor#1207', cls:'agent', tm:'48s', body:<span>patched <span className="mono">src/config.rs:42</span> · spawned test-runner to verify</span>},
  {who:'planner#03', cls:'agent', tm:'1m', body:<span>plan accepted · 6 steps · handed to editor pool</span>},
  {who:'orchestrator', cls:'orch', tm:'1m', kind:'broadcast', body:<span><span className="at">@all</span> token budget 62% · throttling non-critical lanes to keep headroom</span>},
  {who:'sec-audit#12', cls:'agent', tm:'2m', body:<span>infra terraform plan clean · no drift</span>},
  {who:'doc-writer#02', cls:'agent', tm:'2m', body:<span>migration notes 3/5 sections streaming…</span>},
];

function VRAILICON(k){
  const m={
    chat:<path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"/>,
    lanes:<path d="M4 5h16M4 12h16M4 19h16"/>,
    fleet:<g><circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="19" r="2.2"/><circle cx="12" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/><path d="M12 7.4v4M12 11.4L5.6 16.8M12 11.4l6.4 5.4M12 11.4V17"/></g>,
    decide:<path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>,
    worktree:<g><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-6 1.5-6 7.5"/></g>,
  };
  return <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7">{m[k]}</svg>;
}
function VRail(){
  const order=[['chat','Conversation'],['lanes','Lanes'],['fleet','Fleet & Workflow'],['worktree','Worktrees'],['decide','Decision Center']];
  return (
    <div className="vrail">
      {order.map(([k,lbl])=>(
        <div key={k} className={"vrailbtn "+(k==='fleet'?'on':'')} title={lbl}>{VRAILICON(k)}{k==='fleet'&&<span className="bdg">6</span>}{k==='decide'&&<span className="bdg">6</span>}</div>
      ))}
      <div className="vrailsp"></div>
      <div className="vrailbtn" title="Settings"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
    </div>
  );
}

function GNode({g, on, onClick}){
  const tot=g.count;
  const seg=(k)=> (g.mix[k]/tot*100)+'%';
  return (
    <div className={"gnode "+(g.orch?'orch ':'')+(on?'on':'')} onClick={onClick}>
      <div className="r1">
        {gIcon(g.role,g.col)}
        <span className="role">{g.label}</span>
        <span className="cnt">×{g.count}</span>
      </div>
      <div className="proj">{g.proj} · {g.tok} tok</div>
      <div className="seg">
        <i style={{width:seg('gate'),background:C.gate}}></i>
        <i style={{width:seg('run'),background:C.run}}></i>
        <i style={{width:seg('done'),background:C.done}}></i>
        <i style={{width:seg('idle'),background:C.idle}}></i>
      </div>
      <div className="legend">
        {g.mix.run>0 && <span><i style={{background:C.run}}></i>{g.mix.run} {t('run','跑')}</span>}
        {g.mix.done>0 && <span><i style={{background:C.done}}></i>{g.mix.done} {t('done','完')}</span>}
        {g.mix.gate>0 && <span><i style={{background:C.gate}}></i>{g.mix.gate} {t('gate','闸')}</span>}
        {g.mix.idle>0 && <span><i style={{background:C.idle}}></i>{g.mix.idle} {t('idle','闲')}</span>}
      </div>
    </div>
  );
}

function App(){
  const [fleet,setFleet]=useState(0);
  const [sel,setSel]=useState(null); // selected group id
  const F=FLEETS[fleet];
  const selGroup = sel && PHASES.flatMap(p=>p.groups).find(g=>g.id===sel);
  const phaseCount=(p)=>p.groups.reduce((a,g)=>a+g.count,0);
  const phasePct=(p)=>{const tot=phaseCount(p);const done=p.groups.reduce((a,g)=>a+g.mix.done,0);return tot?Math.round(done/tot*100):0;};

  return (
    <div className="pwrap">
      <div className="pkicker">viden · D13 concept · draft 01</div>
      <h1 className="ph1">{t('Fleet & Workflow','Fleet 编排与 Workflow')} <span className="ac">{t('one main agent, a thousand hands','一个主脑,上千只手')}</span></h1>
      <p className="plead">{t('The workspace ','工作区有一个')}<b>{t('built-in main agent','内置主 Agent')}</b>{t(' plans a ','规划出一个 ')}<b>fleet</b>{t(' — many heterogeneous agents collaborating across projects. Each project is worked by agents shown as ','—— 一组异构 agent 跨项目协作。每个项目由若干 agent 负责,在界面里以 ')}<b>lane {t('sessions','会话')}</b>{t(' (a main conversation that spawns background subagents). A ','呈现(一条主对话,再派生后台 subagent)。一条 ')}<b>{t('group channel','群会话通道')}</b>{t(' syncs everyone and dispatches tasks — scaling to thousands. This panel visualizes the whole workflow as a pipeline of role groups; click any group to drill into individuals.','把所有人同步起来、分派任务 —— 支撑上千 agent。本面板把整个 workflow 画成角色群组的流水线,点任意群组下钻到个体。')}</p>

      <div className="frame" data-screen-label="Fleet & Workflow 总览">
        <div className="vbar">
          <div className="tl"><i className="a"></i><i className="b"></i><i className="c"></i></div>
          <span className="wm"><span style={{color:'var(--accent)'}}>[</span><span style={{color:'var(--accent-bright)'}}>◉</span><span style={{color:'var(--accent)'}}>]</span> <span className="r">v</span><span className="c">iden</span></span>
          <span className="projsel">{t('Robocode workspace','Robocode 工作区')} <span className="br">⎇ 18 {t('projects','项目')}</span> ▾</span>
          <span className="sp"></span>
          <div className="vtools">
            <div className="vbtn" title="Command palette ⌘K"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg></div>
            <div className="vbtn" title="Pop out"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7"><path d="M15 3h6v6M10 14L21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></div>
          </div>
        </div>

        <div className="vbody">
          <VRail/>

          <div className="wfmain">
            <div className="statbar">
              <div className="fleetpick">
                <span className="nm"><span className="bi">⛭</span>{F.name}</span>
                <span className="goal">· {F.goal}</span>
              </div>
              <span className="sp"></span>
              <div className="stats">
                <div className="stat">{t('agents','总 agent')}<b>{F.total.toLocaleString()}</b></div>
                <div className="stat ac">{t('active','活跃')}<b>{F.active}</b></div>
                <div className="stat go">{t('awaiting you','需你')}<b>{F.awaiting}</b></div>
                <div className="stat">{t('fleets','fleet')}<b>{FLEETS.length}</b></div>
              </div>
            </div>

            <div className="pipe">
              {PHASES.map((p,i)=>(
                <React.Fragment key={p.key}>
                  {i>0 && <div className="flowarrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>}
                  <div className="phase">
                    <div className="phead">
                      <span className="pic">{p.ic}</span>
                      <span className="pt">{t(p.name,p.nameZh)}</span>
                      <span className="pc">{phaseCount(p).toLocaleString()}</span>
                    </div>
                    <div className="pbar"><i style={{width:phasePct(p)+'%'}}></i></div>
                    <div className="gnodes">
                      {p.groups.map(g=>(
                        <GNode key={g.id} g={g} on={sel===g.id} onClick={()=>setSel(sel===g.id?null:g.id)}/>
                      ))}
                    </div>
                  </div>
                </React.Fragment>
              ))}
            </div>

            {selGroup && <div className="detail">
              <div className="dethead">
                <span className="t">{gIcon(selGroup.role,selGroup.col)} {selGroup.label} <span style={{color:'var(--accent-bright)'}}>×{selGroup.count}</span></span>
                <span className="ct">{selGroup.proj} · {selGroup.tok} tok · {selGroup.mix.gate} {t('at gate','在闸')} · {selGroup.mix.run} {t('running','运行中')}</span>
                <span className="x" onClick={()=>setSel(null)}>✕</span>
              </div>
              <div className="detbody">
                {sampleAgents(selGroup).map(a=>(
                  <div key={a.id} className="arow">
                    <span className="dot" style={{background:C[a.st]}}></span>
                    <span className="id">{a.id}</span>
                    <span className="ac2">{a.nm} · {a.act}</span>
                  </div>
                ))}
                <div className="detmore">+{(selGroup.count-8).toLocaleString()} {t('more agents in this group','个同组 agent')} · {t('click to expand','点击展开')}</div>
              </div>
            </div>}
          </div>

          <div className="channel">
            <div className="chhead">
              <span className="t"><span className="lv"></span>{t('Group channel','群会话通道')}</span>
              <span className="ct">{F.total.toLocaleString()} {t('subscribed','在线')}</span>
            </div>
            <div className="chfeed">
              {CHANNEL.map((m,i)=>(
                <div key={i} className={"cmsg "+(m.kind==='broadcast'?'broadcast':m.kind==='gate'?'gatey':'')}>
                  <div className="top">
                    <span className={"who "+m.cls}>{m.who}</span>
                    {m.kind==='broadcast' && <span style={{color:'var(--gold)',fontFamily:'var(--mono)',fontSize:9}}>⇶ {t('broadcast','广播')}</span>}
                    <span className="tm">{m.tm}</span>
                  </div>
                  <div className="body">{m.body}</div>
                </div>
              ))}
            </div>
            <div className="chcompose">
              <div className="chbox"><span className="pr">⛭</span><span className="tx">{t('dispatch to fleet…','向 fleet 分派…')}</span><button className="snd">↑</button></div>
              <div className="chmeta"><span className="scope">⇶ {t('scope: @all','范围: @all')}</span><span>{t('main agent dispatches · agents report back','主 agent 分派 · agent 回报')}</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
