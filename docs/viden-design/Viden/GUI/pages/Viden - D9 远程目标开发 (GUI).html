<style>
/* Token 单一真源 → ../tokens.css;本页只用 var(--*)。默认 :root = dark 皮肤。 */
*{box-sizing:border-box;}
body{margin:0;background:var(--page-bg);color:var(--fg-primary);font-family:var(--sans);-webkit-font-smoothing:antialiased;}

.pwrap{max-width:1560px;margin:0 auto;padding:28px 24px 70px;}
.pkicker{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.pkicker::before{content:"";width:24px;height:2px;background:var(--accent);}
.ph1{font-size:28px;margin:0 0 8px;letter-spacing:-.6px;}
.ph1 .ac{color:var(--accent);}
.plead{font-size:14px;color:var(--fg-secondary);margin:0 0 20px;max-width:900px;line-height:1.6;text-wrap:pretty;}
.plead b{color:var(--fg-primary);font-weight:600;}

/* frame */
/* 窗口壳/标题栏走 gui-kit；此处仅页面专属覆盖 */
.frame{height:920px;min-width:1180px;position:relative;}

/* lane tabs */
.lanetabs{flex:none;display:flex;align-items:stretch;background:var(--bg-void);border-bottom:1px solid var(--border-soft);height:42px;}
.ltab{display:flex;align-items:center;gap:9px;padding:0 16px;font-size:12.5px;color:var(--fg-muted);border-right:1px solid var(--border-soft);cursor:pointer;position:relative;}
.ltab:hover{color:var(--fg-secondary);background:var(--bg-base);}
.ltab.on{color:var(--fg-primary);background:var(--bg-base);}
.ltab.on::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent);}
.ltab .st{width:7px;height:7px;border-radius:50%;}
.ltab .pj{font-family:var(--mono);font-size:9.5px;color:var(--fg-faint);}
.ltab.on .pj{color:var(--fg-muted);}
.lanetabs .sp{flex:1;}
.lanetabs .meta{display:flex;align-items:center;padding:0 14px;font-family:var(--mono);font-size:10px;color:var(--fg-muted);gap:12px;}

/* target bar */
.tbar{flex:none;display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid var(--border);background:var(--bg-panel);flex-wrap:wrap;}
.tchip{font-family:var(--mono);font-size:10px;border:1px solid var(--border);border-radius:6px;padding:3px 9px;color:var(--fg-secondary);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.tchip b{color:var(--fg-primary);font-weight:600;}
.tchip .led{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 6px color-mix(in srgb,var(--success) 60%,transparent);}
.tchip .led.amber{background:var(--warning);box-shadow:0 0 6px color-mix(in srgb,var(--warning) 60%,transparent);animation:blink 1s infinite;}
@keyframes blink{50%{opacity:.35;}}
.tchip.warn{color:var(--gold-bright);border-color:color-mix(in srgb,var(--gold) 50%,transparent);background:color-mix(in srgb,var(--gold) 6%,transparent);}
.tchip.estop{color:var(--success);border-color:color-mix(in srgb,var(--success) 45%,transparent);}
.tbar .sp{flex:1;}
.tbtn{font-family:var(--mono);font-size:10px;border:1px solid var(--border);border-radius:6px;padding:3px 11px;color:var(--fg-muted);cursor:pointer;background:transparent;}
.tbtn:hover{color:var(--warning);border-color:var(--warning);}

/* disconnect banner */
.dcband{flex:none;display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--warning) 8%,transparent);border-bottom:1px solid color-mix(in srgb,var(--warning) 45%,transparent);padding:8px 16px;font-size:12px;color:var(--gold-bright);}
.dcband .mono{font-family:var(--mono);font-size:10px;color:var(--fg-muted);}
.dcband b{font-weight:700;}
.dcband .sp{flex:1;}
.dcband .re{font-family:var(--mono);font-size:10px;color:var(--warning);}

/* body grid */
.body3{flex:1;display:grid;grid-template-columns:1fr 420px;min-height:0;}
.sess{min-width:0;overflow:hidden auto;border-right:1px solid var(--border-soft);scrollbar-width:thin;scrollbar-color:var(--border) transparent;background:var(--bg-base);}
.ph{position:sticky;top:0;z-index:2;background:var(--bg-base);display:flex;align-items:center;gap:9px;padding:9px 16px;border-bottom:1px solid var(--border-soft);font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);}
.ph b{color:var(--fg-primary);font-weight:600;font-size:11px;}
.ph .sp{flex:1;}
.trans{padding:12px 16px;}
.msg{margin-bottom:calc(var(--msg-mb) - 3px);}
.msg .who{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:1px;color:var(--fg-muted);margin-bottom:4px;}
.msg .body{font-size:13px;color:var(--fg-secondary);line-height:1.65;background:var(--bg-void);border:1px solid var(--border-soft);border-radius:9px;padding:10px 13px;text-wrap:pretty;}
.msg.user .body{border-color:var(--border);color:var(--fg-primary);}
.msg .body code{font-family:var(--mono);font-size:11px;color:var(--accent-bright);}
.tool{font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);background:var(--bg-void);border:1px dashed var(--border);border-radius:8px;padding:7px 12px;margin-bottom:12px;line-height:1.8;}
.tool .nm{color:var(--accent);font-weight:600;}
.tool .rmt{font-size:8.5px;font-weight:700;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:4px;padding:0 4px;margin-left:5px;}
.tool .ok{color:var(--success);} .tool .wn{color:var(--warning);}
.qd{font-family:var(--mono);font-size:10px;color:var(--fg-faint);border:1px dashed var(--border);border-radius:8px;padding:6px 12px;margin-bottom:12px;}
.qd b{color:var(--warning);}

/* target dock */
.dock{min-width:0;overflow:hidden auto;background:var(--bg-panel);scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.dock .ph{background:var(--bg-panel);}
.dsec{padding:12px 14px 2px;}
.dsec .eh{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--fg-muted);display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.dsec .eh::after{content:"";flex:1;height:1px;background:var(--border-soft);}
.dsec .eh .src{font-weight:400;letter-spacing:0;text-transform:none;color:var(--fg-faint);}
.dsec .eh .live{width:6px;height:6px;border-radius:50%;background:var(--success);animation:blink 1.6s infinite;}
.chart{background:var(--bg-void);border:1px solid var(--border);border-radius:9px;padding:8px 10px 4px;}
.chart svg{display:block;width:100%;height:auto;}
.legend{display:flex;gap:14px;padding:6px 2px 2px;font-family:var(--mono);font-size:9px;color:var(--fg-muted);flex-wrap:wrap;}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;margin-right:4px;vertical-align:middle;}
.kv{width:100%;border-collapse:collapse;font-size:11px;background:var(--bg-void);border:1px solid var(--border);border-radius:9px;overflow:hidden;}
.kv td{padding:6px 11px;border-bottom:1px solid var(--border-soft);font-family:var(--mono);color:var(--fg-secondary);}
.kv tr:last-child td{border-bottom:none;}
.kv td b{color:var(--fg-primary);font-weight:600;}
.kv .up{color:var(--success);} .kv .wn{color:var(--warning);}
.gpus{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.gpu{background:var(--bg-void);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-family:var(--mono);}
.gpu .id{font-size:9px;color:var(--fg-muted);display:flex;justify-content:space-between;}
.gpu .id b{color:var(--fg-primary);}
.gpu .bar{height:5px;border-radius:3px;background:var(--bg-base);overflow:hidden;margin:6px 0 3px;}
.gpu .bar i{display:block;height:100%;background:var(--accent);}
.gpu .bar i.hot{background:var(--warning);}
.gpu .mem{font-size:8.5px;color:var(--fg-faint);}
.fwd{display:flex;align-items:center;gap:8px;background:var(--bg-void);border:1px solid var(--border);border-radius:8px;padding:7px 11px;margin-bottom:7px;font-family:var(--mono);font-size:10.5px;color:var(--fg-secondary);}
.fwd .led{width:6px;height:6px;border-radius:50%;background:var(--success);}
.fwd .led.off{background:var(--fg-faint);}
.fwd b{color:var(--accent-bright);font-weight:600;}
.fwd .open{margin-left:auto;color:var(--accent);cursor:pointer;font-size:9.5px;}
.stagegate{display:flex;align-items:center;background:var(--bg-void);border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-family:var(--mono);font-size:10px;}
.stg{display:flex;align-items:center;gap:6px;}
.stg .ic{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:9px;border:1.5px solid var(--border);color:var(--fg-muted);}
.stg.done .ic{border-color:var(--success);color:var(--success);}
.stg.cur .ic{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 8%,transparent);}
.stg.lock .ic{border-style:dashed;}
.stg .lb{color:var(--fg-secondary);} .stg.cur .lb{color:var(--gold-bright);font-weight:700;}
.stgarr{flex:1;height:0;border-top:1.5px dashed var(--border);margin:0 8px;min-width:10px;}

/* terminal */
.termdock{flex:none;border-top:1px solid var(--border);background:var(--bg-void);height:168px;display:flex;flex-direction:column;}
.termhead{flex:none;display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--border-soft);}
.termtab{font-family:var(--mono);font-size:10.5px;padding:3px 10px;border-radius:6px;color:var(--fg-muted);cursor:pointer;}
.termtab.on{background:var(--bg-sel);color:var(--accent);}
.termhead .right{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--fg-muted);display:flex;gap:12px;}
.termbody{flex:1;overflow:hidden;padding:8px 16px;font-family:var(--mono);font-size:11px;line-height:1.75;}
.termbody div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.termbody .cp{color:var(--accent);} .termbody .gp{color:var(--success);} .termbody .yp{color:var(--warning);} .termbody .dim{color:var(--fg-faint);}
.termbody .curs{display:inline-block;width:7px;height:13px;background:var(--accent);vertical-align:-2px;animation:blink 1.1s infinite;}
.frame.dc .termbody{opacity:.35;}
.frame.dc .dock .chart, .frame.dc .gpus, .frame.dc .kv{opacity:.55;}
</style>
</head>
<body>
<div class="pwrap">
  <div id="root"></div>
</div>

<script type="text/babel" src="../../tweaks-panel.jsx"></script>
<script type="text/babel" src="../gui-icons.jsx"></script>
<script type="text/babel" src="../gui-statusbar.jsx"></script>
<script type="text/babel" src="../gui-titlebar.jsx"></script>
<script type="text/babel">
const {useState,useEffect} = React;
const t = window.t || ((en,zh)=>en);

/* charts */
function pts(fn,n,x0,x1){const a=[];for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;a.push([x,fn(x)]);}return a;}
function path(p,W,H,xr,yr){const sx=x=>(x-xr[0])/(xr[1]-xr[0])*W;const sy=y=>H-(y-yr[0])/(yr[1]-yr[0])*H;return p.map((q,i)=>(i?'L':'M')+sx(q[0]).toFixed(1)+' '+sy(q[1]).toFixed(1)).join(' ');}
const Grid=({W,H})=>(<g stroke="var(--border-soft)" strokeWidth="1">{[1,2,3].map(i=><line key={'h'+i} x1="0" x2={W} y1={H*i/4} y2={H*i/4}/>)}{[1,2,3,4,5].map(i=><line key={'v'+i} y1="0" y2={H} x1={W*i/6} x2={W*i/6}/>)}</g>);

function TelemetryChart({phase}){
  const W=392,H=120,xr=[0,4],yr=[-30,50];
  const elbow=pts(x=>18+14*Math.sin((x+phase*0.13)*2.1)+2.2*Math.sin((x+phase*0.3)*9),120,0,4);
  const torque=pts(x=>-8+9*Math.sin((x+phase*0.13)*2.1+0.9)+1.5*Math.sin((x+phase*0.21)*13),120,0,4);
  return (
    <div className="chart">
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{height:H}}>
        <Grid W={W} H={H}/>
        <path d={path(elbow,W,H,xr,yr)} fill="none" stroke="var(--accent)" strokeWidth="1.8"/>
        <path d={path(torque,W,H,xr,yr)} fill="none" stroke="var(--gold)" strokeWidth="1.4"/>
      </svg>
      <div className="legend"><span><i style={{borderColor:'var(--accent)'}}></i>{t('elbow angle °','elbow 角度 °')}</span><span><i style={{borderColor:'var(--gold)'}}></i>{t('torque N·m','扭矩 N·m')}</span><span style={{marginLeft:'auto'}}>{t('1 kHz · 4s window','1 kHz · 滑窗 4s')}</span></div>
    </div>
  );
}
function LossSpark(){
  const W=392,H=96,xr=[0,12.4],yr=[1.6,3.4];
  const loss=pts(x=>1.84+1.4*Math.exp(-x*0.42)+0.05*Math.sin(x*7.3)+0.03*Math.sin(x*19),140,0.1,12.4);
  return (
    <div className="chart">
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{height:H}}>
        <Grid W={W} H={H}/>
        <path d={path(loss,W,H,xr,yr)} fill="none" stroke="var(--accent)" strokeWidth="1.8"/>
      </svg>
      <div className="legend"><span><i style={{borderColor:'var(--accent)'}}></i>train loss · 2.04</span><span style={{marginLeft:'auto'}}>step 12.4k / 30k</span></div>
    </div>
  );
}

/* ───────── lanes ───────── */
const LANES=[
  {
    id:'robot', proj:'arm-ctrl', lid:'L7', agent:'claude', st:'var(--warning)', name:t('Elbow jitter diagnosis','肘关节抖动诊断'),
    target:{host:'robot-01', addr:'192.168.8.21 · arm64 · viden 0.1.30 on-board', link:'28ms', sync:t('rsync push · 2s ago ✓','rsync 推送 · 2s 前 ✓'), extra:'lease',
      lease:t('lease arm-01 · 14:22 left','租约 arm-01 · 剩 14:22'), estop:'e-stop ARMED', stage:'bench'},
    session:'diagnose · S3', branch:'vd/pid-retune',
    transcript:(<div className="trans">
      <div className="msg user"><div className="who">YOU · 14:03</div><div className="body">{t('The new PID params still jitter slightly on the bench; find out what frequency it is and whether it needs more tuning.','PID 新参数在 bench 上还有轻微抖动，查一下是什么频率的，看看要不要再调。')}</div></div>
      <div className="tool"><span className="nm">ssh.exec</span><span className="rmt">@robot-01</span> ros2 topic hz /joint_states<br/><span className="ok">✓</span> {t('998.7 Hz · link stable','998.7 Hz · 链路稳定')}</div>
      <div className="tool"><span className="nm">telemetry.record</span><span className="rmt">@robot-01</span> elbow · 10s @ 1kHz<br/><span className="ok">✓</span> {t('pulled back docs/evidence/v0.6/elbow-jitter/raw.parquet (1.2 MB)','已回拉 docs/evidence/v0.6/elbow-jitter/raw.parquet（1.2 MB）')}</div>
      <div className="msg"><div className="who">L7 · CLAUDE · 14:06</div><div className="body">{t('FFT shows the residual jitter centered at ','FFT 看残留抖动集中在 ')}<code>6.8 Hz</code>{t(', amplitude 0.14° — not control-loop oscillation (that would be 20Hz+), more like gear/backlash excitation. Two directions: ① kd 1.8→1.6 to reduce derivative excitation; ② acceleration feedforward. Suggest trying ① first; the bench can verify directly.','，幅值 0.14°——不是控制环振荡（那会在 20Hz+），更像齿隙/背隙激励。两个方向：① kd 1.8→1.6 减小微分激励；② 加速度前馈补偿。建议先试 ①，台架可直接验。')}</div></div>
      <div className="tool"><span className="nm">spectrum.analyze</span> raw.parquet → fft.png<br/><span className="ok">✓</span> {t('peak 6.8Hz / 0.14° · attached to evidence','峰值 6.8Hz / 0.14° · 已挂入证据')}</div>
      <div className="msg"><div className="who">L7 · CLAUDE · 14:08</div><div className="body">{t('Drafted a patch (kd=1.6); bench validation plan: same step set + 10s steady-state recording, compare the 6.8Hz amplitude. ','已起草 patch（kd=1.6），bench 验证方案：同一组阶跃 + 10s 稳态记录，对比 6.8Hz 幅值。')}<b>{t('Needs the bench for 6 minutes','需要占用台架 6 分钟')}</b>{t(', within the current lease window — run it?','，在当前租约窗口内，跑吗？')}</div></div>
    </div>),
    queued:[t('telemetry.record elbow · validation set','telemetry.record elbow · 验证组'), 'ssh.exec ros2 launch bench_step.launch.py'],
    dock:(phase)=>(<React.Fragment>
      <div className="dsec"><div className="eh"><span className="live"></span>{t('Telemetry · elbow','遥测 · elbow')} <span className="src">{t('streamed back from robot-01','自 robot-01 流式回传')}</span></div><TelemetryChart phase={phase}/></div>
      <div className="dsec"><div className="eh">{t('Joint state','关节状态')}</div>
        <table className="kv"><tbody>
          <tr><td><b>elbow</b></td><td>23.4°</td><td>1.82 N·m</td><td className="wn">{t('jitter 6.8Hz · 0.14°','抖动 6.8Hz · 0.14°')}</td></tr>
          <tr><td><b>shoulder</b></td><td>−12.1°</td><td>3.10 N·m</td><td className="up">{t('normal','正常')}</td></tr>
          <tr><td><b>wrist</b></td><td>4.7°</td><td>0.36 N·m</td><td className="up">{t('normal','正常')}</td></tr>
        </tbody></table>
      </div>
      <div className="dsec"><div className="eh">{t('Staged gate position','分级闸位置')}</div>
        <div className="stagegate">
          <span className="stg done"><span className="ic">✓</span><span className="lb">sim</span></span>
          <span className="stgarr"></span>
          <span className="stg cur"><span className="ic">⏸</span><span className="lb">{t('bench · current','bench · 当前')}</span></span>
          <span className="stgarr"></span>
          <span className="stg lock"><span className="ic"><GuiIcon name="lock" className="" style={{width:'12px',height:'12px'}}/></span><span className="lb">field</span></span>
        </div>
      </div>
      <div className="dsec"><div className="eh">{t('Port forwarding','端口转发')}</div>
        <div className="fwd"><span className="led"></span><b>foxglove</b> robot-01:8765 → localhost:8765 <span className="open">{t('open ↗','打开 ↗')}</span></div>
        <div className="fwd"><span className="led off"></span><b>rviz-web</b> {t('not enabled','未启用')} <span className="open">{t('enable','启用')}</span></div>
      </div>
    </React.Fragment>),
    term:{tabs:['pty/02 @robot-01',t('zsh local','zsh 本地')],lines:[
      ['cp','robot-01:~/arm$ ros2 topic hz /joint_states'],
      ['gp','  average rate: 998.712'],
      ['cp','robot-01:~/arm$ viden telemetry record elbow --dur 10s'],
      ['gp','  ✓ saved → evidence/elbow-jitter/raw.parquet · synced back'],
      ['dim',t('  tmux session viden-L7 · session & processes persist on the board','  tmux session viden-L7 · 会话与进程在板上持久')],
    ]}
  },
  {
    id:'ml', proj:'spatial-lm', lid:'L5', agent:'builtin', st:'var(--progress)', name:t('Continue training to 30k','继续训练至 30k'),
    target:{host:'gpu-01', addr:t('10.2.0.14 · 8×A100 80G · remote worktree','10.2.0.14 · 8×A100 80G · 远程 worktree'), link:'4ms', sync:t('remote worktree · git ✓','远程 worktree · git ✓'), extra:'budget',
      lease:t('GPU slots 0–7 · lease until 20:00','GPU 槽位 0–7 · 租约至 20:00'), estop:null, stage:null},
    session:'train-30k · S1', branch:'vd/lr-warmup',
    transcript:(<div className="trans">
      <div className="msg user"><div className="who">YOU · 11:20</div><div className="body">{t('Once the eval gate passes, keep training to 30k steps, run a quick eval every 2k steps, and stop and call me if the curve looks off.','eval 闸过了就继续训到 30k 步，每 2k 步跑一次小 eval，曲线异常就停下来叫我。')}</div></div>
      <div className="tool"><span className="nm">ssh.exec</span><span className="rmt">@gpu-01</span> tmux new -s viden-L5 · torchrun --nproc 8 train.py --resume ckpt-12k<br/><span className="ok">✓</span> {t('Training running in the background on the target · PID 48211 · survives disconnect','训练已在目标机后台跑 · PID 48211 · 断线不中断')}</div>
      <div className="msg"><div className="who">{t('L5 · BUILT-IN AGENT · 11:24','L5 · 内置 AGENT · 11:24')}</div><div className="body">{t('Training resumed. Throughput ','已恢复训练。吞吐 ')}<code>41.2k tok/s</code>{t(', ETA 4h50m, next eval at 14k steps. I’ll watch the curve: divergence detection by classic rules (window slope + variance), only calling you on anomaly.','，ETA 4h50m，下次 eval 在 14k 步。我会盯曲线：发散检测用经典规则（窗口斜率 + 方差），异常才叫你。')}</div></div>
      <div className="tool"><span className="nm">watch.metrics</span><span className="rmt">@gpu-01</span> loss / grad-norm / lr · {t('every 60s','每 60s')}<br/><span className="ok">✓</span> {t('12.4k steps · loss 2.04 · grad-norm steady','12.4k 步 · loss 2.04 · grad-norm 平稳')}</div>
      <div className="tool"><span className="nm">eval.quick</span><span className="rmt">@gpu-01</span> step 12k · gsm8k-mini<br/><span className="ok">✓</span> {t('57.8 (baseline 54.7) · written to evidence/run-0612/','57.8（基线 54.7）· 已写入 evidence/run-0612/')}</div>
      <div className="msg"><div className="who">{t('L5 · BUILT-IN AGENT · 13:02','L5 · 内置 AGENT · 13:02')}</div><div className="body">{t('All normal. Reminder: this run’s GPU lease ends 20:00; at current ETA it finishes 16:10, plenty of margin.','一切正常。提醒：本 run 的 GPU 租约到 20:00，按当前 ETA 16:10 完成，余量充足。')}</div></div>
    </div>),
    queued:['eval.quick step 14k', 'ckpt.archive 14k → oss'],
    dock:(phase)=>(<React.Fragment>
      <div className="dsec"><div className="eh"><span className="live"></span>{t('Training · run-0612','训练 · run-0612')} <span className="src">{t('tmux viden-L5 · survives disconnect','tmux viden-L5 · 断线不中断')}</span></div><LossSpark/></div>
      <div className="dsec"><div className="eh">GPU · 8×A100 <span className="src">nvidia-smi · 30s</span></div>
        <div className="gpus">
          {[97,94,96,98,91,95,93,96].map((u,i)=>(
            <div className="gpu" key={i}><div className="id"><b>#{i}</b><span>{u}%</span></div><div className="bar"><i className={u>96?'hot':''} style={{width:u+'%'}}></i></div><div className="mem">71.8 / 80 GB</div></div>
          ))}
        </div>
      </div>
      <div className="dsec"><div className="eh">{t('Run metrics','运行指标')}</div>
        <table className="kv"><tbody>
          <tr><td><b>step</b></td><td>12,418 / 30,000</td><td className="up">41.4%</td></tr>
          <tr><td><b>{t('Throughput','吞吐')}</b></td><td>41.2k tok/s</td><td>ETA 16:10</td></tr>
          <tr><td><b>{t('Last eval','上次 eval')}</b></td><td>gsm8k-mini 57.8</td><td className="up">{t('+3.1 vs baseline','+3.1 vs 基线')}</td></tr>
          <tr><td><b>{t('Next action','下个动作')}</b></td><td>{t('14k-step eval + ckpt archive','14k 步 eval + ckpt 归档')}</td><td className="wn">{t('queued','排队中')}</td></tr>
        </tbody></table>
      </div>
      <div className="dsec"><div className="eh">{t('Port forwarding','端口转发')}</div>
        <div className="fwd"><span className="led"></span><b>tensorboard</b> gpu-01:6006 → localhost:6006 <span className="open">{t('open ↗','打开 ↗')}</span></div>
        <div className="fwd"><span className="led"></span><b>grafana</b> gpu-01:3000 → localhost:3000 <span className="open">{t('open ↗','打开 ↗')}</span></div>
      </div>
    </React.Fragment>),
    term:{tabs:['tmux viden-L5 @gpu-01',t('zsh local','zsh 本地')],lines:[
      ['cp','gpu-01:~/spatial-lm$ tail -f runs/0612/train.log'],
      ['dim','  step 12400 | loss 2.041 | lr 5.8e-4 | 41.3k tok/s'],
      ['dim','  step 12410 | loss 2.038 | lr 5.8e-4 | 41.2k tok/s'],
      ['gp','  [eval] step 12000 gsm8k-mini = 57.8  (+3.1)'],
      ['dim','  step 12418 | loss 2.044 | lr 5.8e-4 | 41.2k tok/s'],
    ]}
  },
];

function App(){
  const [tw,setTweak]=useTweaks(/*EDITMODE-BEGIN*/{
    "termFontSize": 11,
    "telemetryLive": true
  }/*EDITMODE-END*/);
  const [cur,setCur]=useState(0);
  const [dc,setDc]=useState(false);
  const [reSec,setReSec]=useState(8);
  const [phase,setPhase]=useState(0);
  const L=LANES[cur];
  useEffect(()=>{
    if(!tw.telemetryLive||dc) return;
    const iv=setInterval(()=>setPhase(p=>p+1),300);
    return ()=>clearInterval(iv);
  },[tw.telemetryLive,dc]);
  useEffect(()=>{
    if(!dc) return;
    setReSec(8);
    const iv=setInterval(()=>setReSec(s=>{if(s<=1){setDc(false);return 8;}return s-1;}),1000);
    return ()=>clearInterval(iv);
  },[dc]);
  return (
    <React.Fragment>
      <div className="pkicker">viden · D9 concept · draft 01</div>
      <h1 className="ph1">{t('Remote target development','远程目标开发模式')} <span className="ac">Remote Target</span></h1>
      <p className="plead">{t('Robot/ML development is all ','机器人/ML 开发都是')}<b>{t('remote into a target machine','远程连目标机')}</b>{t(': a lane binds a Target (SSH), the agent’s commands run on the target, and telemetry / GPU status streams back to the Target Dock on the right. Switch the two lanes at top; click ','：lane 绑定 Target（SSH），agent 的命令在目标上执行，遥测/GPU 状态实时回流右侧 Target Dock。顶部切换两条 lane；点目标条右侧')}<b>{t('Simulate disconnect','模拟断线')}</b>{t(' on the target bar to see the resilience design — ','看韧性设计——')}<b>{t('the session continues in the target’s tmux, commands queue, and it auto-reconnects','会话在目标机 tmux 里继续，命令排队，自动重连')}</b>{t('.','。')}</p>
    <div className={"frame "+(dc?'dc':'')} data-screen-label="远程目标开发">
      <GuiTitleBar/>
      <div className="lanetabs">
        {LANES.map((l,i)=>(
          <div key={l.id} className={"ltab "+(cur===i?'on':'')} onClick={()=>setCur(i)}>
            <span className="st" style={{background:l.st}}></span>{l.name}
            <span className="pj">{l.proj} · {l.lid}</span>
          </div>
        ))}
        <div className="ltab" style={{color:'var(--fg-faint)'}}>+</div>
        <span className="sp"></span>
        <div className="meta"><span>{t('Decision Center · 6','决策中心 · 6')}</span><span>⎇ {L.branch}</span></div>
      </div>

      <div className="tbar" data-screen-label="Target 状态条">
        <span className="tchip"><span className={"led "+(dc?'amber':'')}></span><b>{L.target.host}</b> · {L.target.addr}</span>
        <span className="tchip">{t('Link','链路')} {dc?t('— down','— 中断'):L.target.link}</span>
        <span className="tchip">{t('Sync','同步')} {L.target.sync}</span>
        <span className="tchip warn">{L.target.lease}</span>
        {L.target.estop && <span className="tchip estop">● {L.target.estop}</span>}
        {L.target.stage && <span className="tchip warn">{t('Gate','闸位')} {L.target.stage}</span>}
        <span className="sp"></span>
        <span className="tchip">{t('tmux persistent session','tmux 持久会话')}</span>
        <button className="tbtn" onClick={()=>setDc(d=>!d)}>{dc?t('Reconnect','恢复链路'):t('Simulate disconnect','模拟断线')}</button>
      </div>

      {dc && <div className="dcband">
        <b>{t('⚠ Link down','⚠ 链路中断')}</b>
        <span>{t('The agent session and the training/recording processes keep running inside ','agent 会话与训练/记录进程在 ')}<b>{L.target.host}</b>{t('’s tmux · unconfirmed commands are staged',' 的 tmux 内继续运行 · 未确认命令已暂存')}</span>
        <span className="mono">{t('command queue ','命令队列 ')}{L.queued.length}{t(': ','条：')}{L.queued.join(' · ')}</span>
        <span className="sp"></span>
        <span className="re">{t('auto-reconnect ','自动重连 ')}{reSec}s …</span>
      </div>}

      <div className="body3">
        <div className="sess">
          <div className="ph"><b>{t('Session window','会话窗口')}</b><span>{L.lid} · {L.session}</span><span className="sp"></span><span>{t('all commands run on ','所有命令在 ')}{L.target.host}<span style={{color:'var(--gold)'}}>{t(' @remote',' @远程')}</span></span></div>
          {L.transcript}
          {dc
            ? <div className="qd" style={{margin:'0 16px 14px'}}>{t('⏸ Link down · new commands ','⏸ 链路中断 · 新指令将')}<b>{t('queue','排队')}</b>{t(' and dispatch in order after reconnect; processes on the target are unaffected','，重连后按序下发；目标机上的进程不受影响')}</div>
            : <div className="qd" style={{margin:'0 16px 14px'}}>{t('● Link up · commands dispatch directly to ','● 链路正常 · 输入指令直接下发 ')}{L.target.host}</div>}
        </div>
        <div className="dock" data-screen-label={"Target Dock·"+L.id}>
          <div className="ph"><b>Target Dock</b><span>{L.target.host}</span><span className="sp"></span><span>{t('evidence auto-pulled','证据自动回拉')}</span></div>
          {L.dock(phase)}
          <div style={{height:14}}></div>
        </div>
      </div>

      <div className="termdock">
        <div className="termhead">
          {L.term.tabs.map((tb,i)=><span key={tb} className={"termtab "+(i===0?'on':'')}>{tb}</span>)}
          <span className="right"><span>{dc?t('buffering · resend on reconnect','缓冲中 · 重连后续传'):t('direct · ','直连 · ')+L.target.link}</span></span>
        </div>
        <div className="termbody" style={{fontSize:tw.termFontSize}}>
          {L.term.lines.map((ln,i)=><div key={i} className={ln[0]}>{ln[1]}</div>)}
          <div><span className="cp">{L.target.host}:~$</span> {!dc && <span className="curs"></span>}{dc && <span className="dim">{t(' [buffer] ',' [缓冲] ')}</span>}</div>
        </div>
      </div>

      <GuiStatusBar right={t('remote · gpu-01','\u8fdc\u7a0b \u00b7 gpu-01')}/>
      <TweaksPanel>
        <TweakSection label={t('Demo','演示')} />
        <TweakToggle label={t('Telemetry live refresh','遥测实时刷新')} value={tw.telemetryLive} onChange={v=>setTweak('telemetryLive',v)} />
        <TweakSection label={t('Terminal','终端')} />
        <TweakSlider label={t('Terminal font size','终端字号')} value={tw.termFontSize} min={10} max={14} step={0.5} unit="px" onChange={v=>setTweak('termFontSize',v)} />
      </TweaksPanel>
    </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
