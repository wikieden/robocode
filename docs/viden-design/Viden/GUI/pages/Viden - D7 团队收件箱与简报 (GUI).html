<!DOCTYPE html>
<html lang="en" data-mode="dark" data-skin="aurora">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viden D7·D8 · Team collaboration (Inbox · Briefing · Notice)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="../../i18n.js"></script>
<script src="../../chrome.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../gui-kit.css">
<style>
/* Token 单一真源 → ../tokens.css;本页只用 var(--*)。默认 :root = dark 皮肤。 */
*{box-sizing:border-box;}
body{margin:0;background:var(--page-bg);color:var(--fg-primary);font-family:var(--sans);-webkit-font-smoothing:antialiased;}

.pwrap{max-width:1560px;margin:0 auto;padding:28px 24px 70px;}
.pkicker{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.pkicker::before{content:"";width:24px;height:2px;background:var(--accent);}
.ph1{font-size:28px;margin:0 0 8px;letter-spacing:-.6px;}
.ph1 .ac{color:var(--accent);}
.plead{font-size:14px;color:var(--fg-secondary);margin:0 0 20px;max-width:920px;line-height:1.6;text-wrap:pretty;}
.plead b{color:var(--fg-primary);font-weight:600;}

/* 窗口壳/标题栏/活动 rail 走 gui-kit；此处仅页面专属覆盖 */
.frame{height:900px;min-width:1180px;position:relative;}
.vbody{flex:1;display:flex;min-height:0;}
.vbodymain{flex:1;min-width:0;display:flex;flex-direction:column;}
/* 活动 rail 走 gui-kit .act / .actbtn / .badge */

/* cmdbar + tabs */
.cmdbar{flex:none;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--border);background:var(--bg-void);height:50px;}
.cmdbar .t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px;}
.cmdbar .t .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent);}
.vtabs{display:flex;align-self:stretch;}
.vtab{display:flex;align-items:center;gap:7px;padding:0 15px;font-size:13px;font-weight:600;color:var(--fg-muted);cursor:pointer;position:relative;}
.vtab:hover{color:var(--fg-secondary);}
.vtab.on{color:var(--fg-primary);}
.vtab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--accent);}
.vtab .n{font-family:var(--mono);font-size:9.5px;color:var(--accent-bright);background:var(--bg-sel);border:1px solid var(--accent-dim);border-radius:9px;padding:0 6px;}
.cmdbar .sp{flex:1;}
.cmdbar .meta{font-family:var(--mono);font-size:10px;color:var(--fg-faint);}
.cmdbar .me{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:var(--fg-secondary);}
.av{width:24px;height:24px;border-radius:50%;background:var(--bg-sel);border:1px solid var(--accent-dim);display:grid;place-items:center;font-family:var(--mono);font-size:9px;font-weight:700;color:var(--accent-bright);flex:none;}
.av.g2{border-color:color-mix(in srgb,var(--gold) 50%,transparent);color:var(--gold-bright);}
.av.g3{border-color:color-mix(in srgb,var(--progress) 50%,transparent);color:var(--progress);}
.av.bot{border-style:dashed;color:var(--fg-muted);border-color:var(--border);}

.inner{flex:1;display:grid;grid-template-columns:1fr var(--rail-right);min-height:0;}
.inner.full{grid-template-columns:1fr;}
.maincol{min-width:0;overflow:hidden auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;background:var(--bg-base);}

.sec{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--fg-muted);display:flex;align-items:center;gap:8px;margin:18px 18px 9px;}
.sec::after{content:"";flex:1;height:1px;background:var(--border-soft);}
.sec .hint{font-weight:400;letter-spacing:0;text-transform:none;color:var(--fg-faint);}
.sec .n{color:var(--fg-faint);}

/* inbox rows */
.irow{display:flex;align-items:center;gap:11px;margin:0 18px 8px;background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:10px;padding:calc(var(--card-pad-y) + 2px) 14px;cursor:pointer;}
.irow:hover{border-color:var(--fg-muted);}
.irow .ki{font-family:var(--mono);font-size:12px;width:18px;text-align:center;flex:none;}
.irow .tx .t1{font-size:13px;font-weight:600;color:var(--fg-primary);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.irow .tx .t2{font-family:var(--mono);font-size:9.5px;color:var(--fg-muted);margin-top:4px;}
.irow .tx .t2 .why{color:var(--fg-faint);}
.irow .tx .t2 .a{color:var(--accent);}
.irow .sp{flex:1;}
.irow .age{font-family:var(--mono);font-size:9.5px;color:var(--fg-faint);}
.irow .age.hot{color:var(--warning);}
.chip{font-family:var(--mono);font-size:9px;font-weight:600;border-radius:5px;padding:1px 7px;white-space:nowrap;border:1px solid var(--border);color:var(--fg-secondary);display:inline-flex;align-items:center;gap:5px;}
.chip .dot{width:6px;height:6px;border-radius:2px;}
.chip.gate{color:var(--gold-bright);border-color:color-mix(in srgb,var(--gold) 50%,transparent);background:color-mix(in srgb,var(--gold) 6%,transparent);}
.chip.ask{color:var(--warning);border-color:color-mix(in srgb,var(--warning) 50%,transparent);background:color-mix(in srgb,var(--warning) 6%,transparent);}
.chip.field{color:var(--error);border-color:color-mix(in srgb,var(--error) 45%,transparent);background:color-mix(in srgb,var(--error) 6%,transparent);}
.ibtn{font-family:var(--sans);font-size:11.5px;font-weight:600;border-radius:7px;padding:5px 13px;cursor:pointer;border:1px solid var(--border);color:var(--fg-secondary);background:transparent;white-space:nowrap;}
.ibtn:hover{color:var(--fg-primary);border-color:var(--fg-muted);}
.ibtn.primary{color:var(--on-accent);background:var(--accent);border-color:var(--accent);font-weight:700;}
.ibtn.primary:hover{background:var(--accent-bright);}
.irow.dim{opacity:.65;}
.irow .who{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;color:var(--fg-muted);}

/* right rail */
.rail{background:var(--bg-panel);border-left:1px solid var(--border-soft);display:flex;flex-direction:column;overflow:hidden auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.rail .hd{padding:15px 17px 9px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--fg-muted);display:flex;align-items:center;gap:8px;}
.rail .hd::after{content:"";flex:1;height:1px;background:var(--border-soft);}
.mem{display:flex;align-items:center;gap:10px;margin:0 13px 8px;background:var(--bg-void);border:1px solid var(--border-soft);border-radius:10px;padding:10px 12px;}
.mem .tx .t1{font-size:12.5px;font-weight:700;color:var(--fg-primary);display:flex;align-items:center;gap:7px;}
.mem .tx .t1 .on{width:6px;height:6px;border-radius:50%;background:var(--success);}
.mem .tx .t1 .off{width:6px;height:6px;border-radius:50%;background:var(--fg-faint);}
.mem .tx .t2{font-family:var(--mono);font-size:9px;color:var(--fg-muted);margin-top:3px;line-height:1.6;}
.mem .sp{flex:1;}
.mem .pend{font-family:var(--mono);font-size:9px;color:var(--gold-bright);text-align:right;line-height:1.5;}
.handcard{margin:0 13px 8px;background:var(--bg-void);border:1px dashed var(--border);border-radius:10px;padding:10px 13px;font-family:var(--mono);font-size:10px;color:var(--fg-secondary);line-height:1.8;}
.handcard b{color:var(--fg-primary);font-weight:600;}
.handcard .a{color:var(--accent);}
.handcard .g{color:var(--gold-bright);}
.rail .note{margin-top:auto;border-top:1px solid var(--border-soft);padding:12px 17px;font-family:var(--mono);font-size:9.5px;color:var(--fg-faint);line-height:1.8;}
.rail .note .a{color:var(--accent);}

/* briefing */
.brief{max-width:780px;margin:18px auto;background:var(--bg-panel);border:1px solid var(--border);border-radius:13px;overflow:hidden;}
.brief .bhd{padding:18px 24px 14px;border-bottom:1px solid var(--border-soft);background:var(--bg-void);}
.brief .bhd .t{font-size:17px;font-weight:700;display:flex;align-items:baseline;gap:10px;}
.brief .bhd .t .d{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600;}
.brief .bhd .m{font-family:var(--mono);font-size:9.5px;color:var(--fg-faint);margin-top:5px;}
.brief .bhd .m .a{color:var(--accent);}
.bsec{padding:14px 24px 4px;}
.bsec .bt{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--fg-muted);display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.bsec .bt .n{color:var(--gold-bright);}
.bsec .bt::after{content:"";flex:1;height:1px;background:var(--border-soft);}
.bitem{display:flex;gap:10px;padding:7px 0;font-size:12.5px;color:var(--fg-secondary);border-bottom:1px solid var(--border-soft);align-items:baseline;}
.bitem:last-child{border-bottom:none;}
.bitem .ic{font-family:var(--mono);font-size:10.5px;width:16px;flex:none;text-align:center;}
.bitem .ic.ok{color:var(--success);} .bitem .ic.no{color:var(--error);} .bitem .ic.bk{color:var(--warning);} .bitem .ic.ct{color:var(--gold);}
.bitem b{color:var(--fg-primary);font-weight:600;}
.bitem .sp{flex:1;}
.bitem .by{font-family:var(--mono);font-size:9.5px;color:var(--fg-faint);white-space:nowrap;}
.bitem .by .a{color:var(--accent);}
.bfoot{padding:13px 24px 16px;font-family:var(--mono);font-size:9.5px;color:var(--fg-faint);line-height:1.8;border-top:1px solid var(--border-soft);margin-top:10px;}
.bfoot .a{color:var(--accent);}

/* notice */
.ncard{max-width:780px;margin:18px auto 0;background:var(--bg-panel);border:1px solid var(--border);border-radius:13px;padding:18px 24px;}
.ncard .t{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ncard .m{font-family:var(--mono);font-size:9.5px;color:var(--fg-faint);margin-top:5px;}
.ncard .body{font-size:13px;color:var(--fg-secondary);line-height:1.7;margin-top:10px;text-wrap:pretty;}
.ncard .body b{color:var(--fg-primary);}
.chan{max-width:780px;margin:14px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.chcard{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:12px;padding:14px 17px;}
.chcard .ct{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.chcard .ct.hum{color:var(--accent);} .chcard .ct.ag{color:var(--gold);}
.chcard .ct::after{content:"";flex:1;height:1px;background:var(--border-soft);}
.chcard ul{margin:0;padding-left:17px;font-size:12px;color:var(--fg-secondary);line-height:1.8;}
.chcard li b{color:var(--fg-primary);font-weight:600;}
.memo{max-width:780px;margin:14px auto 0;background:var(--bg-void);border:1px solid var(--border);border-radius:12px;padding:13px 17px;font-family:var(--mono);font-size:11px;line-height:1.9;color:var(--fg-secondary);}
.memo .hd2{color:var(--fg-faint);font-size:9.5px;margin-bottom:6px;}
.memo .hd2 .a{color:var(--accent);}
.memo .k{color:var(--gold-bright);}
.acktable{max-width:780px;margin:14px auto 24px;width:100%;}
.acktable table{width:100%;border-collapse:collapse;font-size:12px;background:var(--bg-panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:block;}
.acktable th{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--fg-muted);text-align:left;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--bg-void);}
.acktable td{padding:8px 14px;border-bottom:1px solid var(--border-soft);color:var(--fg-secondary);font-family:var(--mono);font-size:10.5px;}
.acktable tr:last-child td{border-bottom:none;}
.acktable td b{color:var(--fg-primary);font-weight:600;}
.acktable .ok{color:var(--success);} .acktable .run{color:var(--progress);} .acktable .pd{color:var(--fg-faint);}
.acktable table{display:table;}
.cwrap{padding-bottom:10px;}

.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg-elev);border:1px solid var(--accent-dim);color:var(--fg-primary);font-size:12.5px;border-radius:9px;padding:9px 16px;box-shadow:var(--shadow-toast);display:flex;gap:10px;align-items:center;white-space:nowrap;z-index:5;}
.toast .mono{font-family:var(--mono);font-size:10px;color:var(--fg-muted);}
</style>
</head>
<body>
<div class="pwrap">
  <div id="root"></div>
</div>

<script type="text/babel" src="../../tweaks-panel.jsx"></script>
<script type="text/babel" src="../gui-icons.jsx"></script>
<script type="text/babel" src="../gui-statusbar.jsx"></script>
<script type="text/babel" src="../gui-titlebar.jsx"></script>
<script type="text/babel" src="../gui-inbox.jsx"></script>
<script type="text/babel">
const {useState} = React;
const t = window.t || ((en,zh)=>en);

function VBar(){ return <GuiTitleBar/>; }
function VRail({active,badges}){
  const order=[['chat','Conversation'],['lanes','Lanes'],['inbox','Inbox'],['brief','Briefing'],['decide','Decision Center']];
  return (
    <div className="act">
      {order.map(([k,lbl])=>(
        <div key={k} className={"actbtn "+(active===k?'on':'')} title={lbl}>{ICONS[k]}{badges&&badges[k]&&<span className="badge" style={{background:'var(--gold)'}}>{badges[k]}</span>}</div>
      ))}
      <div className="actspacer"></div>
      <div className="actbtn" title="Settings">{ICONS.settings}</div>
    </div>
  );
}
function App(){
  const [tw,setTweak]=useTweaks(/*EDITMODE-BEGIN*/{
    "defaultTab": "notice"
  }/*EDITMODE-END*/);
  const tabs=['inbox','briefing','notice'];
  const tabLabels=[t('Inbox','收件箱'),t('Team briefing','团队简报'),t('Change notice','变更通告')];
  return (
    <React.Fragment>
      <div className="pkicker">viden · D7 + D8 concept · draft 01 — {t('V1.5 team edition','V1.5 团队版')}</div>
      <h1 className="ph1">{t('Team collaboration','团队协作')} <span className="ac">{t('inbox · briefing · notice','收件箱 · 简报 · 通告')}</span></h1>
      <p className="plead">{t('Team daily = ','团队日常 = ')}<b>{t('clearing the gate queue','清闸队列')}</b>{t('. Gates route to people by viden.toml ownership (D7 inbox); the scribe lane generates a daily ','。闸按 viden.toml 的 ownership 路由到人（D7 收件箱），书记官 lane 每日生成')}<b>{t('team briefing','团队简报')}</b>{t(' (D8); changes go ','（D8），变更走')}<b>{t('dual-channel','双通道')}</b>{t(': people get a summary in the inbox, agents get a memo injected into context with ack tracking. Clicking an inbox item enters the Decision Center (D2 v2) to review.','：人收摘要进收件箱，agent 收 memo 注入上下文并追踪 ack。点收件箱条目即进入决策中心（D2 v2）评审。')}</p>
    <div className="frame" data-screen-label="团队协作">
      <VBar/>
      <div className="vbody">
        <VRail active="inbox" badges={{inbox:5,decide:6}}/>
        <InboxView key={tw.defaultTab} defaultTab={tw.defaultTab}/>
      </div>
      <GuiStatusBar right={t('inbox · team','收件箱 · 团队')}/>
      <TweaksPanel>
        <TweakSection label={t('Content','内容')} />
        <TweakRadio label={t('Default tab','默认标签')} value={tw.defaultTab} options={tabs.map((k,i)=>({value:k,label:tabLabels[i]}))} onChange={v=>setTweak('defaultTab',v)} />
      </TweaksPanel>
    </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
