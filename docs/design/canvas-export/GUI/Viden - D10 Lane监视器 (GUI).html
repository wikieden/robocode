<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viden D10 · Lane Monitor (standalone window)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="i18n.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../tokens.css">
<style>
/* Token 单一真源 → ../tokens.css;本页只用 var(--*)。默认 :root = dark 皮肤。 */
*{box-sizing:border-box;}
body{margin:0;background:var(--page-bg);color:var(--fg-primary);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
body.popout{background:var(--bg-void);}

.pwrap{max-width:1620px;margin:0 auto;padding:28px 24px 70px;}
.pkicker{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.pkicker::before{content:"";width:24px;height:2px;background:var(--accent);}
.ph1{font-size:28px;margin:0 0 8px;letter-spacing:-.6px;}
.ph1 .ac{color:var(--accent);}
.plead{font-size:14px;color:var(--fg-secondary);margin:0 0 22px;max-width:900px;line-height:1.6;text-wrap:pretty;}
.plead b{color:var(--fg-primary);font-weight:600;}
.duo{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;}
.cap{font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);text-align:center;margin-top:10px;letter-spacing:.5px;}

/* ===== window chrome ===== */
.win{background:var(--bg-base);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55);display:flex;flex-direction:column;}
.winbar{flex:none;display:flex;align-items:center;gap:13px;height:46px;padding:0 14px;background:var(--bg-void);border-bottom:1px solid var(--border-soft);user-select:none;}
.winbar .dots{display:flex;gap:8px;}
.winbar .dots i{width:12px;height:12px;border-radius:50%;display:block;}
.winbar .dots i:nth-child(1){background:var(--error);}
.winbar .dots i:nth-child(2){background:var(--warning);}
.winbar .dots i:nth-child(3){background:var(--success);}
.winbar .wm{font-family:var(--mono);font-weight:700;font-size:13.5px;letter-spacing:.3px;}
.winbar .wm .r{color:var(--gold);}.winbar .wm .c{color:var(--accent);}
.winbar .tt{font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);}
.winbar .tt b{color:var(--fg-secondary);font-weight:600;}
.winbar .sp{flex:1;}
.winbar .pin{font-size:11px;color:var(--fg-muted);cursor:pointer;border:1px solid var(--border);border-radius:5px;padding:1px 8px;font-family:var(--mono);font-size:9.5px;}
.winbar .pin.on{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,transparent);}
.winbar .pop{color:var(--accent);cursor:pointer;font-family:var(--mono);font-size:9.5px;border:1px solid var(--accent-dim);border-radius:5px;padding:1px 8px;}
.winbar .pop:hover{color:var(--accent-bright);}

/* ===== dashboard ===== */
.dash{width:1100px;height:760px;}
.dhead{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border-soft);background:var(--bg-base);}
.dhead .t{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
.dhead .t .pulse{width:7px;height:7px;border-radius:50%;background:var(--success);animation:blink 1.8s infinite;}
@keyframes blink{50%{opacity:.3;}}
.dhead .cnt{font-family:var(--mono);font-size:10.5px;color:var(--fg-muted);}
.dhead .cnt b{color:var(--fg-primary);}
.fchips{display:flex;gap:5px;}
.fchip{font-family:var(--mono);font-size:10px;padding:2px 10px;border-radius:12px;color:var(--fg-muted);cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:5px;}
.fchip .pd{width:6px;height:6px;border-radius:2px;}
.fchip:hover{color:var(--fg-secondary);}
.fchip.on{background:var(--bg-sel);color:var(--accent-bright);border-color:var(--accent-dim);}
.dhead .sp{flex:1;}
.dhead .clock{font-family:var(--mono);font-size:11px;color:var(--fg-secondary);}
.dgrid{flex:1;overflow:hidden auto;padding:14px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-content:start;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}

/* lane card */
.lc{background:var(--bg-panel);border:1px solid var(--border-soft);border-radius:11px;padding:11px 13px;display:flex;flex-direction:column;gap:8px;min-height:128px;}
.lc.attn{border-color:color-mix(in srgb,var(--warning) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--warning) 15%,transparent), 0 0 18px color-mix(in srgb,var(--warning) 6%,transparent);}
.lc .r1{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--fg-primary);white-space:nowrap;overflow:hidden;}
.lc .r1 .lid{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--accent);flex:none;}
.lc .r1 .nm{overflow:hidden;text-overflow:ellipsis;}
.lc .r2{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9px;color:var(--fg-muted);}
.lc .r2 .pd{width:6px;height:6px;border-radius:2px;flex:none;}
.lc .r2 .stb{margin-left:auto;font-weight:700;font-size:8.5px;letter-spacing:.5px;border-radius:4px;padding:1px 6px;border:1px solid;}
.lc .viz{flex:1;min-height:34px;}
.lc .viz svg{display:block;width:100%;}
.lc .pbar{height:4px;border-radius:2px;background:var(--bg-void);overflow:hidden;margin-top:4px;}
.lc .pbar i{display:block;height:100%;}
.lc .ev{font-family:var(--mono);font-size:9px;color:var(--fg-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lc .ev b{color:var(--fg-muted);font-weight:600;}
.lc .act{font-family:var(--mono);font-size:9.5px;color:var(--gold-bright);cursor:pointer;}
.lc .act:hover{color:var(--gold);}

/* ticker */
.ticker{flex:none;border-top:1px solid var(--border-soft);background:var(--bg-void);padding:8px 16px;display:flex;flex-direction:column;gap:4px;height:108px;overflow:hidden;}
.ticker .th{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--fg-muted);display:flex;gap:8px;align-items:center;}
.tk{display:flex;gap:10px;font-family:var(--mono);font-size:10px;color:var(--fg-muted);white-space:nowrap;overflow:hidden;}
.tk .tm{color:var(--fg-faint);flex:none;}
.tk .pj2{flex:none;font-weight:600;}
.tk .tx{overflow:hidden;text-overflow:ellipsis;color:var(--fg-secondary);}
.tk .tx b{color:var(--fg-primary);font-weight:600;}

/* ===== compact strip ===== */
.strip{width:392px;height:760px;}
.shead{flex:none;display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--border-soft);}
.shead .t{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;}
.shead .t .pulse{width:6px;height:6px;border-radius:50%;background:var(--success);animation:blink 1.8s infinite;}
.shead .sp{flex:1;}
.shead .cnt{font-family:var(--mono);font-size:9.5px;color:var(--fg-muted);}
.slist{flex:1;overflow:hidden auto;padding:7px 8px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.sl{display:grid;grid-template-columns:auto 1fr auto;gap:3px 9px;padding:8px 10px;border-radius:9px;border:1px solid transparent;margin-bottom:3px;align-items:center;}
.sl:hover{background:var(--bg-base);}
.sl.attn{border-color:color-mix(in srgb,var(--warning) 50%,transparent);background:color-mix(in srgb,var(--warning) 4%,transparent);}
.sl .st{width:7px;height:7px;border-radius:50%;}
.sl .nm{font-size:11.5px;font-weight:600;color:var(--fg-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sl .sb{font-family:var(--mono);font-size:8.5px;font-weight:700;}
.sl .meta{grid-column:2/4;font-family:var(--mono);font-size:8.5px;color:var(--fg-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sl .meta .pj2{font-weight:700;}
.sgrp{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--fg-faint);padding:9px 10px 3px;display:flex;align-items:center;gap:6px;}
.sgrp .pd{width:6px;height:6px;border-radius:2px;}
.sfoot{flex:none;border-top:1px solid var(--border-soft);padding:8px 13px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;color:var(--fg-muted);}
.sfoot .b{color:var(--gold-bright);font-weight:700;}
.sfoot .go{margin-left:auto;color:var(--accent);cursor:pointer;}

/* popout mode */
.pop-fill{position:fixed;inset:0;display:flex;}
.pop-fill .win{flex:1;width:auto;height:auto;border-radius:0;border:none;box-shadow:none;}
.toast2{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--bg-elev);border:1px solid var(--accent-dim);color:var(--fg-primary);font-size:12px;border-radius:9px;padding:8px 16px;z-index:9;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
const {useState,useEffect} = React;
const t = window.t || ((en,zh)=>en);

const PROJ={
  'boss-rush':{color:'var(--gold)'},
  'viden-core':{color:'var(--accent)'},
  'spatial-lm':{color:'var(--progress)'},
  'arm-ctrl':{color:'var(--warning)'},
};
const ST={
  run:  {c:'var(--progress)', t:'RUN'},
  gate: {c:'var(--gold)',     t:'GATE'},
  ask:  {c:'var(--warning)',  t:'NEEDS YOU'},
  done: {c:'var(--success)',  t:'DONE'},
  idle: {c:'var(--fg-faint)', t:'IDLE'},
};

/* sparkline kinds */
function Spark({kind,phase,h=36,color='var(--accent)'}){
  const W=200,H=h;
  let d='';
  const P=[];
  if(kind==='loss'){for(let i=0;i<=60;i++){const x=i/60;P.push([x*W,H-( (1-(1.84+1.3*Math.exp(-x*4)+0.04*Math.sin(x*40+phase*0.2))/3.3) )*H]);}}
  else if(kind==='tele'){for(let i=0;i<=60;i++){const x=i/60;P.push([x*W,H/2+ (H*0.32)*Math.sin((x*4+phase*0.13)*2.1)+2.2*Math.sin(x*30+phase*0.3)]);}}
  else if(kind==='flat'){for(let i=0;i<=60;i++){const x=i/60;P.push([x*W,H*0.5+1.6*Math.sin(x*22+phase*0.1)]);}}
  d=P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return (<svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{height:h}}>
    <line x1="0" x2={W} y1={H/2} y2={H/2} stroke="#122936" strokeWidth="1"/>
    <path d={d} fill="none" stroke={color} strokeWidth="1.8"/>
  </svg>);
}

const LANES=[
  {proj:'boss-rush', lid:'L2', nm:t('gameplay · jump feel','gameplay · 跳跃手感'), agent:'codex · gpt-5-codex', st:'gate', viz:['bar',64,'var(--gold)'], ev:t('⏸ replay-regression gate passed · awaiting you','⏸ 回放回归闸通过 · 等你批准'), act:t('to Decision Center ↗','去决策中心 ↗')},
  {proj:'boss-rush', lid:'L1', nm:t('design · contract v1.1 proposal','策划 · 契约 v1.1 提议'), agent:'claude · sonnet-4.6', st:'gate', viz:['bar',100,'var(--gold)'], ev:t('§ contract change · awaiting confirm','§ 契约变更 · 等确认'), act:t('to Decision Center ↗','去决策中心 ↗')},
  {proj:'boss-rush', lid:'L4', nm:t('content gen · level variants','内容生成 · 关卡变体'), agent:'builtin · gemini-2.5', st:'ask', viz:['bar',82,'var(--warning)'], ev:t('? budget 82% · awaiting your call','? 预算 82% · 等你拍板'), act:t('to Decision Center ↗','去决策中心 ↗')},
  {proj:'boss-rush', lid:'L6', nm:t('render · snowfield shader','渲染 · 雪原 shader'), agent:'kiro · kiro-cli', st:'run', viz:['flat',0,'var(--progress)'], ev:t('golden-frame compare 4/9 · frame budget ✓','金样对比 4/9 · 帧预算 ✓')},
  {proj:'viden-core', lid:'L3', nm:t('provider retry policy','provider 重试策略'), agent:'claude · sonnet-4.6', st:'ask', viz:['flat',0,'var(--warning)'], ev:t('? scope decision · waiting 6m','? 范围决策 · 等待 6m'), act:t('to Decision Center ↗','去决策中心 ↗')},
  {proj:'viden-core', lid:'L8', nm:t('config loading refactor','config 加载重构'), agent:'codex · gpt-5-codex', st:'run', viz:['bar',71,'var(--progress)'], ev:t('cargo test re-running · 2/3','cargo test 重跑中 · 2/3')},
  {proj:'spatial-lm', lid:'L5', nm:t('training run-0612','训练 run-0612'), agent:'builtin · 8×A100', st:'run', viz:['loss',0,'var(--accent)'], ev:'step 12.4k/30k · loss 2.04 · ETA 16:10'},
  {proj:'spatial-lm', lid:'L9', nm:t('data cleaning v3','数据清洗 v3'), agent:'builtin · deepseek-v4', st:'done', viz:['bar',100,'var(--success)'], ev:t('✓ 4.2M samples · archived','✓ 4.2M 样本 · 已归档')},
  {proj:'arm-ctrl', lid:'L7', nm:t('elbow jitter diagnosis','肘关节抖动诊断'), agent:'claude · @robot-01', st:'run', viz:['tele',0,'var(--accent)'], ev:t('bench · 6.8Hz residual · 14m lease left','bench · 6.8Hz 残留 · 租约剩 14m')},
  {proj:'arm-ctrl', lid:'L10', nm:t('sim regression suite','仿真回归套件'), agent:'builtin · MuJoCo', st:'run', viz:['bar',45,'var(--progress)'], ev:t('scene 3/6 · all pass','scene 3/6 · 全部通过')},
  {proj:'arm-ctrl', lid:'L11', nm:t('perception · calibration flow','感知 · 标定流程'), agent:t('codex · pending start','codex · 待启动'), st:'idle', viz:['flat',0,'var(--fg-faint)'], ev:t('depends on L7 result · queued','依赖 L7 结论 · 排队中')},
  {proj:'viden-core', lid:'L12', nm:t('scribe','书记官 scribe'), agent:t('builtin · small model','builtin · 小模型'), st:'run', viz:['flat',0,'var(--accent-dim)'], ev:t('compiling 14:00 briefing · 3 change notices','整理 14:00 简报 · 3 条变更通告')},
];

const EVENTS=[
  ['14:08','arm-ctrl',t('L7 evidence pulled elbow-jitter/raw.parquet · FFT peak 6.8Hz','L7 证据回拉 elbow-jitter/raw.parquet · FFT 峰值 6.8Hz')],
  ['14:06','boss-rush',t('L2 replay-regression gate 12/12 pass → into Decision Center','L2 回放回归闸 12/12 通过 → 进入决策中心')],
  ['13:58','spatial-lm','L5 eval@12k gsm8k-mini 57.8 (+3.1)'],
  ['13:51','viden-core',t('L3 paused: scope decision escalated to you (429 semantics differ)','L3 暂停：范围决策升级给你（429 语义不一致）')],
  ['13:47','boss-rush',t('L1 proposes contract v1.1: feel param ranges written back','L1 提议契约 v1.1：手感参数区间回写')],
  ['13:40','boss-rush',t('L4 budget alert 82% → paused awaiting your call','L4 预算告警 82% → 暂停等待拍板')],
  ['13:32','arm-ctrl',t('L10 sim regression scene-3 pass · no regression','L10 仿真回归 scene-3 通过 · 无回退')],
  ['13:20','viden-core',t('L12 scribe distributed 3 change notices · 2 lanes acked','L12 书记官分发变更通告 ×3 · 2 个 lane 已 ack')],
];

function LaneCard({l,phase}){
  const s=ST[l.st];
  return (
    <div className={"lc "+((l.st==='ask'||l.st==='gate')?'attn':'')}>
      <div className="r1"><span className="lid">{l.lid}</span><span className="nm">{l.nm}</span></div>
      <div className="r2"><span className="pd" style={{background:PROJ[l.proj].color}}></span>{l.proj}<span>·</span>{l.agent}
        <span className="stb" style={{color:s.c,borderColor:'color-mix(in srgb,'+s.c+' 50%,transparent)'}}>{s.t}</span></div>
      <div className="viz">
        {l.viz[0]==='bar'
          ? <div style={{paddingTop:13}}><div className="pbar"><i style={{width:l.viz[1]+'%',background:l.viz[2]}}></i></div></div>
          : <Spark kind={l.viz[0]} phase={phase} color={l.viz[2]}/>}
      </div>
      <div className="ev">{l.ev}</div>
      {l.act && <div className="act">{l.act}</div>}
    </div>
  );
}

function Dashboard({phase,filter,setFilter,pop,standalone}){
  const lanes=LANES.filter(l=>filter==='all'||l.proj===filter);
  const need=LANES.filter(l=>l.st==='ask'||l.st==='gate').length;
  return (
    <div className={"win dash"} data-screen-label="监视墙窗口">
      <div className="winbar">
        <span className="dots"><i></i><i></i><i></i></span>
        <span className="wm"><span style={{color:'var(--accent)'}}>[</span><span style={{color:'var(--accent-bright)'}}>◉</span><span style={{color:'var(--accent)'}}>]</span> <span className="r">v</span><span className="c">iden</span></span>
        <span className="tt"><b>Lane Monitor</b>{standalone?t(' · standalone window',' · 独立窗口'):''}</span>
        <span className="sp"></span>
        <span className="pin on">📌 {t('pin top','置顶')}</span>
        {!standalone && <span className="pop" onClick={pop}>↗ {t('pop out window','弹出独立窗口')}</span>}
      </div>
      <div className="dhead">
        <span className="t"><span className="pulse"></span>{t('All lanes','全部 lane')}</span>
        <span className="cnt"><b>{LANES.length}</b> {t('lanes · 4 projects · ','条 · 4 项目 · ')}<b style={{color:'var(--gold-bright)'}}>{need}</b> {t('awaiting you','项等你')}</span>
        <div className="fchips">
          <span className={"fchip "+(filter==='all'?'on':'')} onClick={()=>setFilter('all')}>{t('All','全部')}</span>
          {Object.keys(PROJ).map(p=>(
            <span key={p} className={"fchip "+(filter===p?'on':'')} onClick={()=>setFilter(p)}><span className="pd" style={{background:PROJ[p].color}}></span>{p}</span>
          ))}
        </div>
        <span className="sp"></span>
        <span className="clock">{t('14:09:32 · all links healthy','14:09:32 · 全链路正常')}</span>
      </div>
      <div className="dgrid">
        {lanes.map(l=><LaneCard key={l.lid} l={l} phase={phase}/>)}
      </div>
      <div className="ticker" data-screen-label="事件流">
        <div className="th">{t('Event stream · scribe-compiled','事件流 · 书记官汇总')} <span style={{flex:1,height:1,background:'var(--border-soft)'}}></span></div>
        {EVENTS.slice(0,5).map((e,i)=>(
          <div className="tk" key={i}><span className="tm">{e[0]}</span><span className="pj2" style={{color:PROJ[e[1]].color}}>{e[1]}</span><span className="tx">{e[2]}</span></div>
        ))}
      </div>
    </div>
  );
}

function Strip({phase,pop,standalone}){
  const groups={};
  LANES.forEach(l=>{(groups[l.proj]=groups[l.proj]||[]).push(l);});
  const need=LANES.filter(l=>l.st==='ask'||l.st==='gate').length;
  return (
    <div className="win strip" data-screen-label="紧凑竖条窗口">
      <div className="winbar">
        <span className="dots"><i></i><i></i><i></i></span>
        <span className="wm"><span style={{color:'var(--accent)'}}>[</span><span style={{color:'var(--accent-bright)'}}>◉</span><span style={{color:'var(--accent)'}}>]</span> <span className="r">v</span><span className="c">iden</span></span>
        <span className="tt"><b>Lanes</b></span>
        <span className="sp"></span>
        <span className="pin on">📌</span>
        {!standalone && <span className="pop" onClick={pop}>↗</span>}
      </div>
      <div className="shead"><span className="t"><span className="pulse"></span>12 lanes</span><span className="sp"></span><span className="cnt">4 {t('projects · ','项目 · ')}{need} {t('awaiting you','项等你')}</span></div>
      <div className="slist">
        {Object.entries(groups).map(([p,ls])=>(
          <React.Fragment key={p}>
            <div className="sgrp"><span className="pd" style={{background:PROJ[p].color}}></span>{p}</div>
            {ls.map(l=>{
              const s=ST[l.st];
              return (
                <div key={l.lid} className={"sl "+((l.st==='ask'||l.st==='gate')?'attn':'')}>
                  <span className="st" style={{background:s.c}}></span>
                  <span className="nm">{l.lid} · {l.nm}</span>
                  <span className="sb" style={{color:s.c}}>{s.t}</span>
                  <span className="meta">{l.ev}</span>
                </div>
              );
            })}
          </React.Fragment>
        ))}
      </div>
      <div className="sfoot"><span className="b">⏸ 3 {t('gates','闸')}</span><span className="b">? 2 {t('asks','问询')}</span><span>· {t('Decision Center','决策中心')}</span><span className="go">{t('open ↗','打开 ↗')}</span></div>
    </div>
  );
}

function App(){
  const params=new URLSearchParams(location.search);
  const popMode=params.get('popout');
  const [tw,setTweak]=useTweaks(/*EDITMODE-BEGIN*/{
    "liveRefresh":true
  }/*EDITMODE-END*/);
  const [phase,setPhase]=useState(0);
  const [filter,setFilter]=useState('all');
  const [toast,setToast]=useState(null);
  useEffect(()=>{
    if(!tw.liveRefresh) return;
    const iv=setInterval(()=>setPhase(p=>p+1),300);
    return ()=>clearInterval(iv);
  },[tw.liveRefresh]);
  useEffect(()=>{if(popMode) document.body.classList.add('popout');},[popMode]);
  const pop=(kind)=>()=>{
    const w=window.open(location.pathname+'?popout='+kind,'viden-monitor-'+kind,'width='+(kind==='strip'?420:1180)+',height=820');
    if(!w){setToast(t('The browser blocked the popup — allow popups and retry','浏览器拦截了弹窗 — 请允许弹窗后重试'));setTimeout(()=>setToast(null),3000);}
  };

  if(popMode==='dash') return <div className="pop-fill"><Dashboard phase={phase} filter={filter} setFilter={setFilter} standalone/></div>;
  if(popMode==='strip') return <div className="pop-fill"><Strip phase={phase} standalone/></div>;

  return (
    <div className="pwrap">
      <div className="pkicker">viden · D10 concept · draft 01</div>
      <h1 className="ph1">{t('Lane Monitor','Lane 监视器')} <span className="ac">{t('standalone window · multi-screen','独立窗口 · 多屏')}</span></h1>
      <p className="plead">{t('Lane info and run status are pulled out of the main cockpit as ','lane 的信息与运行情况从主驾驶舱')}<b>{t('standalone windows','拉出为独立窗口')}</b>{t(' parked on a second screen: left is the ','，丢到副屏常驻：左为')}<b>{t('monitor wall','监视墙')}</b>{t(' (full second-screen — lane card grid + live curves + scribe event stream), right is the ','（副屏全尺寸——lane 卡片网格 + 实时曲线 + 书记官事件流），右为')}<b>{t('compact strip','紧凑竖条')}</b>{t(' (hugging the screen edge). Windows can pin on top; click ','（贴屏幕边缘）。窗口可置顶；点 ')}<b>↗</b>{t(' to actually pop out a real window. Lanes needing a decision are gold-outlined; click “to Decision Center” to jump back to the main window.',' 真的会弹出独立窗口试试。需要决策的 lane 金框高亮，点"去决策中心"跳回主窗。')}</p>
      <div className="duo">
        <div>
          <Dashboard phase={phase} filter={filter} setFilter={setFilter} pop={pop('dash')}/>
          <div className="cap">{t('Form A · monitor wall — full second-screen · 1100×760','形态 A · 监视墙 — 副屏全尺寸 · 1100×760')}</div>
        </div>
        <div>
          <Strip phase={phase} pop={pop('strip')}/>
          <div className="cap">{t('Form B · compact strip — screen-edge · 392×760','形态 B · 紧凑竖条 — 贴屏幕边缘 · 392×760')}</div>
        </div>
      </div>
      {toast && <div className="toast2">{toast}</div>}
      <TweaksPanel>
        <TweakSection label={t('Demo','演示')} />
        <TweakToggle label={t('Live refresh animation','实时刷新动画')} value={tw.liveRefresh} onChange={v=>setTweak('liveRefresh',v)} />
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
