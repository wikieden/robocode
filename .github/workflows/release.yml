name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload assets to
        required: true
        default: v0.1.3
      upload_to_release:
        description: Upload artifacts to the GitHub release
        type: boolean
        required: true
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release archive
        shell: bash
        run: |
          version="${{ github.event.inputs.tag }}"
          version="${version#v}"
          scripts/package-release.sh "$version" "${{ matrix.target }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: robocode-${{ github.event.inputs.tag }}-${{ matrix.target }}
          path: |
            dist/robocode-${{ github.event.inputs.tag }}-${{ matrix.target }}.tar.gz
            dist/robocode-${{ github.event.inputs.tag }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  upload-release:
    name: Upload to GitHub release
    needs: build
    if: ${{ github.event.inputs.upload_to_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-upload
          merge-multiple: true

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: gh release upload "$TAG" dist-upload/* --repo wikieden/robocode --clobber
